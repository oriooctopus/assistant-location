      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: warn

      - name: Upload System-mode appearance-pass log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemmode-log
          path: systemmode.log
          if-no-files-found: warn

      - name: Upload default-tab log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defaulttab-log
          path: defaulttab.log
          if-no-files-found: warn
