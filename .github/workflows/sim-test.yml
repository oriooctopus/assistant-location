name: sim-test

# Runs the app in the iOS Simulator, grants location permission, injects a
# fake GPS coordinate, and asserts the app POSTs a well-formed location payload
# to a local mock endpoint. Lets us verify the whole capture→send path with no
# physical phone.
#
# Manual only, opt-in: dispatch this when there's an actual visual/behavioral
# claim to verify, batched — one run per change, never one run per question.
# See the "CI budget" section in MODULES.md.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-test:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.oliverullman.assistantlocation
      MOCK_PORT: "8399"
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install pods
        run: pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-${{ runner.os }}-${{ hashFiles('Overland.xcodeproj/project.pbxproj', 'Podfile.lock') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: Build for simulator
        run: |
          xcodebuild \
            -workspace Overland.xcworkspace \
            -scheme Overland \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "APP_PATH=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)" >> $GITHUB_ENV

      - name: Boot simulator
        run: |
          set -x
          # Explicit iOS 26 runtime, not "whatever xcrun happens to boot".
          # Oliver's real phone is iOS 26.5 and the More-tile crash this suite
          # exists to catch is iOS-26-specific (Liquid Glass's UITabBarController
          # rewrite) -- a run 33437378601 booted iOS 18.5 and was green on this
          # exact path, proving nothing. Highest available 26.x runtime, picked
          # from what the runner actually has installed rather than a hardcoded
          # point version (26.3 exists as an Xcode install but has never shipped
          # a matching downloaded runtime -- see the diag-runtimes.yml findings
          # this was written from). Fails the job loudly, not a silent fallback
          # to 18.x, if no iOS 26 runtime is present at all.
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r \
            '[.runtimes[] | select(.isAvailable) | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26"))] | sort_by(.version) | last | .identifier // empty')
          if [ -z "$RUNTIME_ID" ]; then
            echo "FATAL: no available iOS 26 simulator runtime on this runner. Installed runtimes:"
            xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable) | .name'
            exit 1
          fi
          RUNTIME_NAME=$(xcrun simctl list runtimes -j | jq -r --arg id "$RUNTIME_ID" '.runtimes[] | select(.identifier == $id) | .name')
          echo "Selected simulator runtime: $RUNTIME_NAME ($RUNTIME_ID)"

          UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME_ID" \
            '.devices[$rt][]? | select(.name | test("^iPhone")) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "FATAL: no iPhone device type available under runtime $RUNTIME_ID"
            xcrun simctl list devices available -j | jq --arg rt "$RUNTIME_ID" '.devices[$rt]'
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # A device booted via simctl alone has no attached display/UI
          # client. Screenshots taken against it can capture a stale,
          # undriven framebuffer — observed as a picture of the home screen
          # even while the app was verifiably alive underneath (logging,
          # posting real coordinates). Opening Simulator.app gives the device
          # a real windowserver client so `simctl io screenshot` reflects what
          # is actually rendered.
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          for i in $(seq 1 20); do
            if pgrep -x Simulator >/dev/null 2>&1; then echo "Simulator.app up after ${i}s"; break; fi
            sleep 1
          done
          # Extra settle time for the home screen to actually finish painting.
          sleep 5

          # Needed by the not-the-home-screen guard in the next step
          # (scripts/screenshot_diff_pct.py).
          if ! python3 -c "import PIL" >/dev/null 2>&1; then
            pip3 install --quiet Pillow \
              || pip3 install --quiet --user Pillow \
              || pip3 install --quiet --break-system-packages Pillow \
              || echo "WARN: could not install Pillow; the home-screen guard will skip its check"
          fi

          # Reference screenshot of the pristine home screen, taken before the
          # app is ever launched. Every later screenshot gets diffed against
          # this — see check_not_home_screen below.
          # Retry until the wallpaper has actually rendered. Grabbing this
          # too early yields an all-black frame, and then every DARK-mode app
          # screenshot resembles it: run 33287511978 measured 25-30% pixel
          # difference and failed the >50% guard, where runs 33276188407 and
          # 33286963127 (wallpaper present) measured 56-59% on the very same
          # screens. A 6-point margin means this was always one slow boot away
          # from a red run; the app was correct in all three, only the
          # reference differed. Any real wallpaper clears mean luma 8 easily.
          #
          # The luma floor is 100, not the 8 it used to be, and the run
          # records whether it was ever met. Measured, not guessed:
          #
          #   run 33323516304  reference luma  60.8  -> 18 dark-mode MISSes
          #   run 33292474600  reference luma  86.3  ->  0 MISSes
          #   run 33322953943  reference luma 133.2  ->  0 MISSes
          #
          # 8 only catches an ALL-BLACK reference. It does not catch a
          # half-faded-in one, and a dim reference breaks this guard in a
          # specific direction: the comparison counts a pixel as "same" when
          # it is within 30/255, so a dark reference resembles every
          # DARK-MODE app screenshot. Run 33323516304 failed all 18 dark
          # shots at 28-30% while every light shot passed and the app was
          # verifiably fine (the grid renders correctly in the artifacts) —
          # the guard was measuring the reference, not the app.
          HOME_REF_OK=0
          for attempt in $(seq 1 10); do
            xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/home-reference.png"
            mean=$(python3 -c 'import sys; from PIL import Image; im = Image.open(sys.argv[1]).convert("L"); print(sum(im.getdata()) / (im.width * im.height))' "$GITHUB_WORKSPACE/home-reference.png" 2>/dev/null || echo 0)
            if python3 -c 'import sys; sys.exit(0 if float(sys.argv[1]) > 100 else 1)' "$mean"; then
              echo "home-reference captured on attempt $attempt (mean luma $mean)"
              HOME_REF_OK=1
              break
            fi
            echo "home-reference too dark to compare against (mean luma $mean), retrying"
            sleep 3
          done
          if [ "$HOME_REF_OK" -ne 1 ]; then
            echo "WARN: the home-screen reference never brightened past the floor; the not-the-home-screen guard will report but not fail this run"
          fi
          echo "HOME_REF_OK=$HOME_REF_OK" >> $GITHUB_ENV

      - name: Run app in simulator + assert it POSTs a location
        run: |
          set -x
          FAIL=0
          HOME_REF="$GITHUB_WORKSPACE/home-reference.png"

          # Positive check that a screenshot actually shows the app and not
          # the home screen / springboard. Compares against the pre-launch
          # home-reference.png with scripts/screenshot_diff_pct.py (whole-
          # image pixel-difference percentage, thresholded to ignore
          # anti-aliasing noise) rather than an exact hash: a springboard
          # screenshot taken at a different clock time still hashes
          # differently from the reference, but only a handful of pixels (the
          # clock digits) actually differ, whereas real app content differs
          # over most of the screen.
          #
          # Threshold calibrated against real captures, not guessed: a run
          # that crash-looped back to springboard on every launch (see
          # App/SceneDelegate.m's GLSceneDebugLog history) produced 9
          # screenshots that were byte-identical to EACH OTHER but 20.7%
          # different from home-reference.png — SpringBoard pages itself to
          # show the newly-installed app's icon right after install, so even
          # "still on the home screen" can legitimately differ from a
          # pre-install reference by a fifth of the pixels. Genuine app
          # content measured 87-98% different in the same comparison. 50%
          # sits with wide margin on both sides of that gap.
          #
          # An earlier version of this guard shelled out to ImageMagick's
          # `compare -metric AE`, which silently reported ~0% difference for
          # screenshots independently verified (via this same PIL diff, run
          # by hand against the downloaded artifacts) to differ by 87-98% —
          # a false negative in the guard itself, not a real capture failure.
          # Replaced outright rather than debugged further.
          check_not_home_screen() {
            local shot="$1" label="$2"
            if [ ! -s "$shot" ]; then
              echo "MISS: $label screenshot missing or empty ($shot)"; FAIL=1; return
            fi
            local out pct_int
            out=$(python3 scripts/screenshot_diff_pct.py "$HOME_REF" "$shot" 2>&1) || true
            if [[ ! "$out" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "WARN: could not compare $label to the home-screen reference: $out"
              return
            fi
            echo "compare($label): ${out}% of pixels differ from the home screen"
            pct_int=${out%.*}
            if [ "$pct_int" -lt 50 ]; then
              if [ "${HOME_REF_OK:-0}" -ne 1 ]; then
                # A reference too dark to compare against makes this check
                # meaningless, not failed — every dark-mode screenshot
                # resembles it. Report and move on rather than turning the
                # whole run red for something that says nothing about the app.
                echo "WARN: $label differs from the home reference by only ${out}%, but that reference was too dark to judge against — not failing"
              else
                echo "MISS: $label screenshot looks like the home screen, not the app (only ${out}% of pixels differ from the pre-launch reference)"
                FAIL=1
              fi
            fi
          }

          # Poll for the process actually being alive before screenshotting,
          # instead of a blind sleep — the runner has been observed taking
          # over a dozen seconds just to write a screenshot file.
          wait_for_app_process() {
            local waited=0
            while [ "$waited" -lt 15 ]; do
              if xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
                return 0
              fi
              sleep 1
              waited=$((waited + 1))
            done
            echo "WARN: $BUNDLE_ID did not show up in launchctl list within ${waited}s"
            return 1
          }

          # Start the mock endpoint (kept alive for this whole step).
          python3 scripts/mock_endpoint.py /tmp/received.log ${MOCK_PORT} >/tmp/mock.out 2>&1 &
          MOCK_PID=$!
          # Wait until it actually binds.
          for i in $(seq 1 20); do
            if curl -s -X POST http://127.0.0.1:${MOCK_PORT}/overland -d '{"locations":[]}' >/dev/null; then
              echo "mock up after ${i}s"; break
            fi
            sleep 1
          done
          curl -s -X POST http://127.0.0.1:${MOCK_PORT}/overland -d '{"locations":[]}' || { echo "mock failed to start"; cat /tmp/mock.out; exit 1; }

          # Install + drive the app headlessly via its NSUserDefaults keys.
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLAPIEndpointDefaults "http://127.0.0.1:${MOCK_PORT}/overland"
          # A dummy token, so the run can assert the token actually reaches the
          # Authorization header (see the auth=Bearer check below).
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLAPIAccessTokenDefaults "simtok0123456789"
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLTrackingStateDefaults -bool YES
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLPointsPerBatchDefaults -int 1
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLSendIntervalDefaults -int 1
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLDiscardPointsWithinDistanceDefaults -int 0
          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLDiscardPointsWithinSecondsDefaults -int 0

          xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLPointsPerBatchDefaults -int 0

          xcrun simctl privacy "$SIM_UDID" grant location-always "$BUNDLE_ID"

          echo "=== defaults readback (confirm they applied) ==="
          xcrun simctl spawn "$SIM_UDID" defaults read "$BUNDLE_ID" || echo "(no defaults domain!)"

          # Reliable app-log capture via log stream (NSLog -> os_log).
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact \
            --predicate 'process == "Overland"' > /tmp/app.log 2>&1 &
          LOG_PID=$!
          sleep 2

          echo "=== launch ==="
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          # Screenshot the main (default-tab) screen.
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/main-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/main-screen.png" "main-screen"
          sleep 2

          # Simulate a MOVING route (continuous didUpdateLocations callbacks) —
          # a static 'set' often doesn't drive updates. Runs in background.
          xcrun simctl location "$SIM_UDID" start --speed 15 --distance 20 \
            40.7128,-74.0060 40.7180,-74.0100 40.7230,-74.0140 40.7280,-74.0180 &
          LOC_PID=$!
          sleep 40
          kill $LOC_PID 2>/dev/null || true
          xcrun simctl location "$SIM_UDID" clear 2>/dev/null || true

          echo "=== authorization + queue DB (did the app CAPTURE points?) ==="
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data 2>/dev/null)
          echo "container: $CONTAINER"
          QDB="$CONTAINER/Library/Caches/GLLoggerCache.sqlite"
          if [ -f "$QDB" ]; then
            echo "queue rows: $(sqlite3 "$QDB" 'SELECT count(*) FROM data;' 2>/dev/null || echo '?')"
            sqlite3 "$QDB" 'SELECT substr(value,1,120) FROM data LIMIT 2;' 2>/dev/null || true
          else
            echo "(no queue DB at $QDB)"
          fi

          echo "=== app NSLogs ==="
          grep -iE "Monitoring|Author|Sending|Received|batch|Requesting" /tmp/app.log | sed -E 's/^[0-9T:.Z+-]+ //' | head -20 || true
          echo "=== received.log ==="; cat /tmp/received.log || true; echo "===================="

          # Screenshot every module's tab. UITEST_TAB is read by SceneDelegate
          # and is the tab's INDEX in the module-order sort (see MODULES.md,
          # +moduleOrder ascending): 0 Todos (50), 1 Growth (100),
          # 2 Finances (150), 3 Football (200), 4 Events (225),
          # 5 Journal (250), 6 Tracker (400), 7 Settings (500),
          # 8 Upload (600). Keep this list in sync with the modules'
          # +moduleOrder values, not assumed — a new module or a reorder
          # changes it. A new module appends its entry here, to the
          # appearance-sweep list below, and to both artifact path lists at
          # the bottom.
          TAB_ENTRIES=("0 todos" "1 growth" "2 finances" "3 football" "4 events" "5 journal" "6 tracker" "7 settings" "8 upload" "more more")
          # "more" is not an index: it selects moreNavigationController
          # itself (see SceneDelegate UITEST_TAB), so the system More
          # LIST gets screenshotted, not the module behind it.

          for TAB_ENTRY in "${TAB_ENTRIES[@]}"; do
            set -- $TAB_ENTRY
            TAB_INDEX=$1
            TAB_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_TAB=$TAB_INDEX xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TAB_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TAB_NAME}-screen.png" "$TAB_NAME"
          done

          # Events sits past the fourth tab (+moduleOrder 225), so it is
          # reached through the system More list and UIKit pushes it onto
          # moreNavigationController — which used to give it a "< More" back
          # header no direct tab has. GLModuleRegistry's GLMoreListThemer
          # hides that bar; this asserts it stayed hidden.
          #
          # Todos is the reference because it is a direct tab running the SAME
          # GLWebModuleViewController, and in CI neither can reach the real
          # server (no GL_BAKED_HOST is baked here), so both render the
          # identical native error view — the strip below the status bar is
          # pixel-identical unless one of them has extra chrome. See
          # scripts/check_no_more_header.py for the measured thresholds.
          #
          # This is the ONE module asserted rather than every More entry:
          # Journal/Tracker/Settings/Upload get the same fix, but they are
          # native screens whose own content legitimately occupies that strip,
          # so a pixel comparison against a web module's blank band would fail
          # them for the wrong reason.
          echo "=== More-module header guard ==="
          HEADER_OUT=$(python3 scripts/check_no_more_header.py \
            "$GITHUB_WORKSPACE/todos-screen.png" \
            "$GITHUB_WORKSPACE/events-screen.png" 2>&1) || true
          echo "check_no_more_header(events): $HEADER_OUT"
          case "$HEADER_OUT" in
            MISS:*) echo "$HEADER_OUT"; FAIL=1 ;;
            ERROR:*) echo "WARN: could not run the More-header guard: $HEADER_OUT" ;;
          esac

          # Open a More-grid TILE through the grid's own tap handler, which
          # UITEST_TAB never reaches (that sets selectedIndex, i.e. UIKit's
          # routing, not ours). Journal specifically: it is the one module
          # that wraps itself in a UINavigationController, and pushing one of
          # those raises NSInvalidArgumentException — so if the grid ever goes
          # back to pushing indiscriminately, the app dies here and the
          # not-the-home-screen guard below turns this red. A screenshot-only
          # suite cannot catch that any other way.
          for TILE_ENTRY in "GLModule.AutoJournalModule journal-tile" "GLModule.EventsModule events-tile"; do
            set -- $TILE_ENTRY
            TILE_ID=$1
            TILE_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_MORE_TILE=$TILE_ID xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            sleep 5
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" "$TILE_NAME"
            # An app that raised on the push is gone from launchctl by now;
            # a screenshot alone could still look plausible if the crash
            # happened after the frame was drawn.
            if ! xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "MISS: $TILE_NAME — app is no longer running after opening the tile (crashed?)"
              FAIL=1
            fi
          done

          # Same two tiles, but tapped THROUGH THE WEB PAGE (UITEST_MORE_TILE_TAP)
          # rather than by calling GLModuleRegistry's open method natively. The
          # loop above never touches more.html, gl-bridge.js, or GLWebBridge's
          # `openModule` handler -- it calls straight into
          # +openMoreTileWithIdentifier:, which is exactly why it stayed green
          # on the real bug: Oliver's crash happens tapping the tile ON HIS
          # PHONE, i.e. through the page's own click handler -> GLBridge.call
          # -> the WKScriptMessageHandler -> GLWebBridge -> here. This is the
          # one loop in this file that exercises that whole chain.
          for TILE_ENTRY in "GLModule.AutoJournalModule journal-tile-tap" "GLModule.EventsModule events-tile-tap"; do
            set -- $TILE_ENTRY
            TILE_ID=$1
            TILE_NAME=$2
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
            sleep 1
            SIMCTL_CHILD_UITEST_MORE_TILE_TAP=$TILE_ID xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
            wait_for_app_process || true
            # Longer settle than the native-path loop above: this waits on
            # the web page's own load (bridge round-trip + DOM render) before
            # the tile even exists to tap, on top of the hook's own 1.5s
            # internal delay (SceneDelegate.m).
            sleep 7
            xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" || true
            check_not_home_screen "$GITHUB_WORKSPACE/${TILE_NAME}-screen.png" "$TILE_NAME"
            if ! xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              echo "MISS: $TILE_NAME — app is no longer running after tapping the tile in the web page (crashed?)"
              FAIL=1
            fi
          done

          # Open Journal's Recent-recordings web page directly (UITEST_JOURNAL_RECENTS,
          # SceneDelegate.m), the one push in the Settings/More/Recents
          # web-conversion work none of the loops above reach: it's neither a
          # tab (UITEST_TAB) nor a More tile (UITEST_MORE_TILE), but a push
          # from inside the already-selected Journal tab.
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_JOURNAL_RECENTS=1 xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/recents-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/recents-screen.png" "recents"

          # The native palette normally comes from the theme server on 8304,
          # but sim-test never bakes GL_BAKED_HOST, so that fetch always fails
          # in CI and GLTheme falls back to the asset colours. Every shot above
          # therefore shows the FALLBACK, and proves nothing about whether a
          # selected theme reaches the native chrome. Inject the palette
          # directly (UITEST_NATIVE_PALETTE, one already-variant-resolved leaf
          # of design-tokens/native-theme.json) so these shots exercise the
          # real palette path.
          #
          # BOTH variants, deliberately. This block used to inject dusk-DARK
          # only, so every "the shell is themed" claim ever made off these
          # screenshots was about a variant Oliver's device does not render:
          # his phone resolves dusk-LIGHT. That gradient runs from warm peach
          # at the top to cool blue at the bottom, i.e. its far end is exactly
          # where the tab bar sits, which is the seam the dark-only shots
          # could never show. A suite that can only see one variant cannot
          # catch that class of bug, so the palette leaf and the appearance
          # mode are set together here and each variant gets its own shot.
          # GLThemeModeDefaults: 1=Light, 2=Dark, see Shared/GLTheme.h. The
          # appearance sweep below re-writes that default at the top of each
          # of its own passes, so leaving it set here cannot leak into it.
          # "bg-gradient" below is copied VERBATIM from design-tokens/
          # native-theme.json's dusk.light / dusk.dark leaves (not retyped —
          # see this block's own goal-command grep, which diffs it back
          # against that file). This is the whole reason these two variants
          # exist as a real test target at all: dusk-light's flat "bg" and
          # its gradient's own bottom stop are two different colours (warm
          # peach vs. the cool blue at position 1), so a native chrome path
          # that quietly dropped the gradient and fell back to flat "bg"
          # would still produce a plausible-looking, still-wrong screenshot.
          DUSK_LIGHT='{"bg":"#f6e8dc","surface":"#fbf5ef","text":"#382a52","text-dim":"#7d6f96","accent":"#7c4dcc","danger":"#c0392b","bg-gradient":{"angle":165,"stops":[{"color":"#fde5d0","position":0},{"color":"#ecd9f2","position":0.48},{"color":"#cfe3f6","position":1}]}}'
          DUSK_DARK='{"bg":"#1c1130","surface":"#2c223e","text":"#f0eafb","text-dim":"#a99cc4","accent":"#c9a2ff","danger":"#ff6b6b","bg-gradient":{"angle":165,"stops":[{"color":"#221040","position":0},{"color":"#321a52","position":0.48},{"color":"#0e2742","position":1}]}}'

          # Journal is tab index 5, matching TAB_ENTRIES above -- it moved from
          # 4 when Growth was added, and run 33288060109 screenshotted Events
          # under this filename before the index was corrected. Read the index
          # off TAB_ENTRIES rather than hardcoding a remembered one. Journal's
          # own cards and controls read the same GLTheme tokens as the shell,
          # so it is the shot that shows a MODULE, not just the chrome, under
          # a real palette.
          for DUSK_VARIANT in light dark; do
            if [ "$DUSK_VARIANT" = light ]; then
              DUSK_PALETTE="$DUSK_LIGHT"
              DUSK_MODE=1
            else
              DUSK_PALETTE="$DUSK_DARK"
              DUSK_MODE=2
            fi
            xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLThemeModeDefaults -int "$DUSK_MODE"
            for DUSK_TARGET in "more more" "5 journal"; do
              set -- $DUSK_TARGET
              DUSK_TAB=$1
              DUSK_NAME=$2
              DUSK_SHOT="$GITHUB_WORKSPACE/${DUSK_NAME}-dusk-${DUSK_VARIANT}-screen.png"
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
              sleep 1
              SIMCTL_CHILD_UITEST_TAB=$DUSK_TAB \
                SIMCTL_CHILD_UITEST_NATIVE_PALETTE="$DUSK_PALETTE" \
                xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
              wait_for_app_process || true
              sleep 4
              xcrun simctl io "$SIM_UDID" screenshot "$DUSK_SHOT" || true
              check_not_home_screen "$DUSK_SHOT" "${DUSK_NAME}-dusk-${DUSK_VARIANT}"
            done
          done

          kill $MOCK_PID $LOG_PID 2>/dev/null || true
          cp /tmp/app.log "$GITHUB_WORKSPACE/app.log" 2>/dev/null || true

          echo "=== uncaught-exception lines in app.log (if any) ==="
          grep -iE "uncaught exception|NSInvalidArgumentException|NSInternalInconsistencyException|Terminating app" /tmp/app.log || echo "(none found in the log-stream capture)"

          # Appearance sweep: force Light and Dark (GLThemeModeDefaults, see
          # Shared/GLTheme.h — 1=Light, 2=Dark) and re-screenshot every tab
          # under each, so a hardcoded (non-adaptive) colour shows up as a
          # wrong-looking screenshot in one of the two passes.
          for PASS in "2 dark" "1 light"; do
            set -- $PASS
            MODE_INT=$1
            MODE_NAME=$2
            xcrun simctl spawn "$SIM_UDID" defaults write "$BUNDLE_ID" GLThemeModeDefaults -int "$MODE_INT"
            for TAB_ENTRY in "${TAB_ENTRIES[@]}"; do
              set -- $TAB_ENTRY
              TAB_INDEX=$1
              TAB_NAME=$2
              xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
              sleep 1
              SIMCTL_CHILD_UITEST_TAB=$TAB_INDEX xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
              wait_for_app_process || true
              sleep 4
              xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/${TAB_NAME}-screen-${MODE_NAME}.png" || true
              check_not_home_screen "$GITHUB_WORKSPACE/${TAB_NAME}-screen-${MODE_NAME}.png" "${TAB_NAME}-${MODE_NAME}"
            done
          done

          # PASS criteria. The mode assertion names the mode we actually ship
          # (significant-change) rather than "some mode started", because the
          # previous version grepped for the old default's log line and so went
          # red when the default changed while the app was working fine.
          #
          # A real coordinate reaching the endpoint is REQUIRED, not a bonus.
          # It was demoted to best-effort when simctl injection looked flaky,
          # which left the suite unable to fail for the one thing that matters.
          # If it does turn out to flake, say so and re-scope it deliberately —
          # do not quietly downgrade it again.
          grep -q "Location Authorization Status Always" /tmp/app.log || { echo "MISS: Always authorization"; FAIL=1; }
          grep -q "Monitoring significant location changes" /tmp/app.log || { echo "MISS: did not start in significant-change mode"; FAIL=1; }
          grep -q 'coordinates' /tmp/received.log || { echo "MISS: no location reached the endpoint"; FAIL=1; }
          # The stored token must actually reach the wire. Everything else here
          # can be green while the app posts unauthenticated, which is what the
          # real server was rejecting with 401 auth=none.
          grep -q 'auth=Bearer' /tmp/received.log || { echo "MISS: request carried no Bearer Authorization header"; FAIL=1; }
          # The whole tab bar is assembled at runtime from the GLModule
          # conformers, so a module that fails to register leaves the bar
          # quietly short a tab with nothing else going red. Assert the exact
          # roster, not just the count — a wrong ORDER is also a regression.
          grep -q "Module registry: installed 9 tabs: Todos, Growth, Finances, Football, Events, Journal, Tracker, Settings, Upload" /tmp/app.log || {
            echo "MISS: module registry did not install the expected tabs";
            grep -i "Module registry" /tmp/app.log || echo "(no registry log line at all)";
            FAIL=1;
          }
          # The launch-hook fan-out (moduleDidFinishLaunchingWithOptions:) has
          # no other visible signal — if a module's hook were ever renamed out
          # from under the registry's respondsToSelector: check, launch setup
          # would silently stop firing while the tab still appeared. Assert
          # the exact roster of modules that responded, same as tab install.
          grep -q "Module registry: launch hooks fired for 1 modules: Tracker" /tmp/app.log || {
            echo "MISS: module registry launch-hook fan-out did not fire for the expected modules";
            grep -i "Module registry" /tmp/app.log || echo "(no registry log line at all)";
            FAIL=1;
          }

          if [ $FAIL -eq 0 ]; then
            echo "PASS: app launches, authorizes Always, and starts tracking to the configured endpoint"
          else
            echo "FAIL: a core smoke-test signal was missing"; exit 1
          fi

      - name: Collect simulator crash reports
        # always(): must run even when the step above exited 1 -- that's the
        # whole point, since a crashing tile tap fails that step and this is
        # what explains why. CrashReporter runs on the macOS HOST watching the
        # simulated process like any other local process, so an
        # uncaught-exception SIGABRT lands in the host's own
        # DiagnosticReports directory, not anywhere inside the simulator's
        # filesystem.
        if: always()
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/crash-reports"
          find ~/Library/Logs/DiagnosticReports ~/Library/Logs/DiagnosticReports/Retired \
            -iname "Overland*.ips" -exec cp {} "$GITHUB_WORKSPACE/crash-reports/" \; 2>/dev/null || true
          echo "=== crash reports found ==="
          ls -la "$GITHUB_WORKSPACE/crash-reports" 2>/dev/null || true
          for f in "$GITHUB_WORKSPACE"/crash-reports/*.ips; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-reports/
          if-no-files-found: ignore

      - name: "Default tab: cold launch, resume, and negative-resume"
        run: |
          set -x
          FAIL=0
          HOME_REF="$GITHUB_WORKSPACE/home-reference.png"

          # Same not-home-screen guard as the main step above -- redefined
          # here since bash functions/vars don't persist across steps.
          check_not_home_screen() {
            local shot="$1" label="$2"
            if [ ! -s "$shot" ]; then
              echo "MISS: $label screenshot missing or empty ($shot)"; FAIL=1; return
            fi
            local out pct_int
            out=$(python3 scripts/screenshot_diff_pct.py "$HOME_REF" "$shot" 2>&1) || true
            if [[ ! "$out" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "WARN: could not compare $label to the home-screen reference: $out"
              return
            fi
            echo "compare($label): ${out}% of pixels differ from the home screen"
            pct_int=${out%.*}
            if [ "$pct_int" -lt 50 ]; then
              if [ "${HOME_REF_OK:-0}" -ne 1 ]; then
                echo "WARN: $label differs from the home reference by only ${out}%, but that reference was too dark to judge against — not failing"
              else
                echo "MISS: $label screenshot looks like the home screen, not the app (only ${out}% of pixels differ from the pre-launch reference)"
                FAIL=1
              fi
            fi
          }

          wait_for_app_process() {
            local waited=0
            while [ "$waited" -lt 15 ]; do
              if xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
                return 0
              fi
              sleep 1
              waited=$((waited + 1))
            done
            echo "WARN: $BUNDLE_ID did not show up in launchctl list within ${waited}s"
            return 1
          }

          # First field of the matching launchctl-list line is the pid.
          get_pid() {
            xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep "$BUNDLE_ID" | awk '{print $1}' | head -1
          }

          # Fresh log capture for this step: the main step's `log stream` was
          # already killed above and its output already uploaded as app.log.
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact \
            --predicate 'process == "Overland"' > /tmp/defaulttab.log 2>&1 &
          DT_LOG_PID=$!
          sleep 2

          echo "=== cold launch: no UITEST_TAB set, must open on Growth ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/growth-defaulttab-cold-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/growth-defaulttab-cold-screen.png" "growth-defaulttab-cold"
          grep -q "GLDefaultTab: cold launch -> Growth (index 1)" /tmp/defaulttab.log || {
            echo "MISS: cold launch did not open on Growth"; FAIL=1;
          }

          echo "=== resume: backgrounded past a 0s threshold must reset to Growth ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          # UITEST_TAB starts this run on Finances (index 2) instead, so the
          # resume path is the ONLY thing that can put it back on Growth --
          # a suite that only ever launched fresh (always UITEST_TAB unset)
          # couldn't tell "always opens on Growth" from "resume works".
          SIMCTL_CHILD_UITEST_TAB=2 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=0 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          PID_BEFORE=$(get_pid)
          echo "pid before resume: $PID_BEFORE"
          if [ -z "$PID_BEFORE" ]; then
            echo "MISS: could not read the app's pid before backgrounding it"; FAIL=1
          fi
          # Background it (foreground Safari instead), then foreground it
          # again WITHOUT --terminate-running-process, so this exercises a
          # real resume of the SAME process rather than a fresh cold start.
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 4
          PID_AFTER=$(get_pid)
          echo "pid after resume: $PID_AFTER"
          if [ -z "$PID_AFTER" ] || [ "$PID_AFTER" != "$PID_BEFORE" ]; then
            echo "MISS: pid changed across the resume ($PID_BEFORE -> $PID_AFTER) — this measured a cold start, not a resume, and proves nothing"
            FAIL=1
          fi
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/growth-defaulttab-resume-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/growth-defaulttab-resume-screen.png" "growth-defaulttab-resume"
          grep -qE "GLDefaultTab: resume after [0-9]+s -> Growth \(index 1\)" /tmp/defaulttab.log || {
            echo "MISS: resume past the threshold did not reset to Growth"; FAIL=1;
          }

          echo "=== negative: backgrounded BELOW a 3600s threshold must keep the current tab ==="
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" || true
          sleep 1
          SIMCTL_CHILD_UITEST_TAB=2 SIMCTL_CHILD_UITEST_RESUME_THRESHOLD_SECONDS=3600 \
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          wait_for_app_process || true
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" "defaulttab-negative-reference"
          # Snapshot how many times the registry has selected a default tab
          # BEFORE this resume, so the assertion below is "did THIS resume
          # trigger a selection" rather than a brittle absolute count across
          # the whole step (the cold-launch and resume sub-tests above each
          # add their own lines).
          PRE_COUNT=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          xcrun simctl launch "$SIM_UDID" com.apple.mobilesafari
          sleep 3
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" || true
          check_not_home_screen "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" "finances-defaulttab-negative"
          grep -qE "GLDefaultTab: resume after [0-9]+s -> kept current tab" /tmp/defaulttab.log || {
            echo "MISS: a short resume changed the default-tab outcome (expected 'kept current tab')"; FAIL=1;
          }
          POST_COUNT=$(grep -c "Module registry: default tab ->" /tmp/defaulttab.log || true)
          if [ "$POST_COUNT" -ne "$PRE_COUNT" ]; then
            echo "MISS: a short resume triggered a default-tab selection anyway ($PRE_COUNT -> $POST_COUNT registry selections)"
            FAIL=1
          fi
          # Pixel proof Finances is STILL selected, not just "some app
          # screen": compare against the reference taken right after this
          # sub-flow's own cold launch, same session, so nothing else
          # (theme mode, simulator state) differs between the two shots.
          SAME_OUT=$(python3 scripts/screenshot_diff_pct.py \
            "$GITHUB_WORKSPACE/defaulttab-negative-reference-screen.png" \
            "$GITHUB_WORKSPACE/finances-defaulttab-negative-screen.png" 2>&1) || true
          echo "compare(negative-resume vs its own pre-resume reference): ${SAME_OUT}% differ"
          if [[ "$SAME_OUT" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SAME_INT=${SAME_OUT%.*}
            if [ "$SAME_INT" -ge 15 ]; then
              echo "MISS: negative-resume screenshot differs ${SAME_OUT}% from its own pre-resume reference — the tab appears to have changed"
              FAIL=1
            fi
          else
            echo "WARN: could not pixel-compare the negative-resume screenshot to its reference: $SAME_OUT"
          fi

          kill $DT_LOG_PID 2>/dev/null || true
          cp /tmp/defaulttab.log "$GITHUB_WORKSPACE/defaulttab.log" 2>/dev/null || true

          if [ $FAIL -eq 0 ]; then
            echo "PASS: cold launch and a long resume both open on Growth; a short resume keeps the current tab"
          else
            echo "FAIL: a default-tab signal was missing"; exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-screen
          path: |
            home-reference.png
            main-screen.png
            todos-screen.png
            growth-screen.png
            events-screen.png
            finances-screen.png
            football-screen.png
            journal-screen.png
            tracker-screen.png
            settings-screen.png
            upload-screen.png
            more-screen.png
            journal-tile-screen.png
            events-tile-screen.png
            journal-tile-tap-screen.png
            events-tile-tap-screen.png
            recents-screen.png
            more-dusk-light-screen.png
            more-dusk-dark-screen.png
            journal-dusk-light-screen.png
            journal-dusk-dark-screen.png
            growth-defaulttab-cold-screen.png
            defaulttab-resume-reference-screen.png
            growth-defaulttab-resume-screen.png
            defaulttab-negative-reference-screen.png
            finances-defaulttab-negative-screen.png

      - name: Upload appearance-sweep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-sweep
          path: |
            todos-screen-dark.png
            growth-screen-dark.png
            events-screen-dark.png
            finances-screen-dark.png
            football-screen-dark.png
            journal-screen-dark.png
            tracker-screen-dark.png
            settings-screen-dark.png
            upload-screen-dark.png
            more-screen-dark.png
            todos-screen-light.png
            growth-screen-light.png
            events-screen-light.png
            finances-screen-light.png
            football-screen-light.png
            journal-screen-light.png
            tracker-screen-light.png
            settings-screen-light.png
            upload-screen-light.png
            more-screen-light.png

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: warn

      - name: Upload default-tab log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defaulttab-log
          path: defaulttab.log
          if-no-files-found: warn
