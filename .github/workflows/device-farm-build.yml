name: device-farm-build

# Manual only. Drives real XCUITest touch input on the More page in the iOS
# simulator (UITests/MoreReproUITest.swift) and uploads the log + screenshots.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-
      - name: Bake a dummy host (GLEndpointURL raises on the unbaked placeholder at launch)
        run: |
          {
            echo '#define GL_BAKED_HOST @"127.0.0.1"'
            echo '#define GL_BAKED_TOKEN @"dummy"'
            echo '#define GL_BAKED_COMMIT @"sim-repro"'
          } > App/BakedConfig.h
      - name: Add UITest target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_uitest_target.rb
      - name: Install pods
        run: pod install
      - name: Pick simulator (iOS 26, biggest iPhone)
        run: |
          RT=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable) | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26"))] | sort_by(.version) | last | .identifier // empty')
          test -n "$RT" || { echo "no iOS 26 runtime"; exit 1; }
          xcrun simctl list devices available -j | jq -r --arg rt "$RT" '.devices[$rt][]? | .name' | sort
          UDID=""
          for n in "iPhone 16 Plus" "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Plus" "iPhone 17"; do
            UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RT" --arg n "$n" '.devices[$rt][]? | select(.name == $n) | .udid' | head -1)
            [ -n "$UDID" ] && { echo "using $n"; break; }
          done
          test -n "$UDID" || UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RT" '.devices[$rt][]? | select(.name | test("^iPhone")) | .udid' | head -1)
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.oliverullman.assistantlocation UITestSkipNotificationPrompt -bool true
      - name: Start app log
        run: |
          xcrun simctl spawn "$SIM_UDID" log stream --level debug --style compact --predicate 'process == "Overland"' > /tmp/app.log 2>&1 &
          sleep 2
      - name: Run XCUITest
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Overland.xcworkspace \
            -scheme OverlandUITests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath repro.xcresult \
            -only-testing:UITests/MoreReproUITest \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Export attachments
        if: always()
        run: |
          cp /tmp/app.log app.log || true
          mkdir -p crashes; cp ~/Library/Logs/DiagnosticReports/Overland* crashes/ 2>/dev/null || true
          ls "$HOME/Library/Logs/DiagnosticReports" > crashes/listing.txt 2>&1 || true
          mkdir -p attachments
          xcrun xcresulttool export attachments --path repro.xcresult --output-path attachments || true
          grep -E "REPRO|Test Case|error:|failed" xcodebuild.log > repro-lines.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro
          path: |
            xcodebuild.log
            app.log
            crashes
            repro-lines.txt
            attachments
