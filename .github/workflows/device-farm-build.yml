name: device-farm-build

# Builds the app IPA + XCUITest runner IPA for AWS Device Farm and uploads them
# as artifacts. Device Farm orchestration (upload, schedule, poll) is driven
# separately from the dev box, so this slow macOS step only rebuilds when needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Bake the shared host + secret into the app
        env:
          DROP_HOST: ${{ secrets.DROP_HOST }}
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DROP_HOST" || { echo "DROP_HOST secret is empty/missing"; exit 1; }
          test -n "$DROP_TOKEN" || { echo "DROP_TOKEN secret is empty/missing"; exit 1; }
          # Without this, GLEndpointURL() raises on first launch (GL_BAKED_HOST
          # stays the committed placeholder) and the app crashes before any
          # UITest can interact with it — see build.yml for the same step.
          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GL_BAKED_HOST @\"$DROP_HOST\""
            echo "#define GL_BAKED_TOKEN @\"$DROP_TOKEN\""
          } > App/BakedConfig.h
          echo "BakedConfig.h written ($(wc -l < App/BakedConfig.h) lines)"
          grep -q NO_TOKEN_BAKED_IN App/BakedConfig.h \
            && { echo "token placeholder survived the bake"; exit 1; } || true
          grep -q NO_HOST_BAKED_IN App/BakedConfig.h \
            && { echo "host placeholder survived the bake"; exit 1; } || true

      - name: Add UITest target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_uitest_target.rb

      - name: Install pods
        run: pod install

      - name: Build for testing (device, signed)
        run: |
          KEY=/tmp/asc_key.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          xcodebuild build-for-testing \
            -workspace Overland.xcworkspace \
            -scheme OverlandUITests \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGN_STYLE=Automatic \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM=J66WVM2DTX \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Package IPAs
        run: |
          PROD=dd/Build/Products/Debug-iphoneos
          echo "products:"; ls "$PROD"
          # App IPA
          rm -rf Payload && mkdir Payload
          cp -r "$PROD/Overland.app" Payload/
          # Device Farm auto-resigns every app it runs under XCTest (the
          # "skip re-signing" option is unavailable for XCTest per AWS docs),
          # and its resigner is fragile against apps with embedded app
          # extensions — each .appex carries its own embedded.mobileprovision
          # and entitlements, and resigning multiple targets at once fails
          # outright with "Signing error with app or tests" before any
          # device even boots. XCTest can't drive extensions out-of-process
          # anyway (see JournalControlUITest.swift's env-var workaround), so
          # stripping them here for the Device Farm package loses no test
          # coverage — this app.ipa is never shipped to users, only build.yml
          # (TestFlight) and ota.yml ship the real one with extensions intact.
          rm -rf Payload/Overland.app/PlugIns
          zip -qr app.ipa Payload && rm -rf Payload
          # Test-runner IPA
          RUNNER=$(ls -d "$PROD"/*-Runner.app | head -1)
          echo "runner: $RUNNER"
          rm -rf Payload && mkdir Payload
          cp -r "$RUNNER" Payload/
          zip -qr tests.ipa Payload && rm -rf Payload
          ls -la app.ipa tests.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: device-farm-ipas
          path: |
            app.ipa
            tests.ipa
