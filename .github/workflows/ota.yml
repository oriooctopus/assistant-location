name: ota

# Builds an ad-hoc signed ipa for over-the-air install on the one registered
# device, alongside the TestFlight build in build.yml. Same cert; the ad hoc
# provisioning profiles are downloaded by fastlane from App Store Connect, so
# no PROVISIONING_PROFILE secret is needed here.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "MODULES.md"
      - "scripts/**"
      - ".github/workflows/gen-project.yml"
      - ".github/workflows/sim-test.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/device-farm-build.yml"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Bake the shared host + secret into the app and the share extension
        env:
          DROP_HOST: ${{ secrets.DROP_HOST }}
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DROP_HOST" || { echo "DROP_HOST secret is empty/missing"; exit 1; }
          test -n "$DROP_TOKEN" || { echo "DROP_TOKEN secret is empty/missing"; exit 1; }
          # Replaces the committed placeholders; the host and token never live
          # in git. One secret pair for both: the location server accepts the
          # same shared token as Bearer on /drop and on /overland, and both
          # endpoints live on the same host.
          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GLDropHost @\"$DROP_HOST\""
            echo "#define GLDropToken @\"$DROP_TOKEN\""
          } > ShareToDesktop/ShareConfig.h
          echo "ShareConfig.h written ($(wc -l < ShareToDesktop/ShareConfig.h) lines)"

          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GL_BAKED_HOST @\"$DROP_HOST\""
            echo "#define GL_BAKED_TOKEN @\"$DROP_TOKEN\""
          } > App/BakedConfig.h
          echo "BakedConfig.h written ($(wc -l < App/BakedConfig.h) lines)"

          # Guard: a build that silently kept a placeholder would ship an app
          # that 401s forever (token) or can't resolve a host (host), which is
          # exactly the bug this replaced.
          grep -q NO_TOKEN_BAKED_IN App/BakedConfig.h ShareToDesktop/ShareConfig.h \
            && { echo "token placeholder survived the bake"; exit 1; } || true
          grep -q NO_HOST_BAKED_IN App/BakedConfig.h ShareToDesktop/ShareConfig.h \
            && { echo "host placeholder survived the bake"; exit 1; } || true

      - name: Build ad-hoc ipa
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane adhoc

      # The poller on another machine downloads the `ota-ipa` artifact and
      # expects exactly one ipa inside it.
      - name: Locate the ipa
        run: |
          # No set -u: macOS ships bash 3.2, where an empty array reads as unset.
          set -eo pipefail
          shopt -s nullglob
          IPAS=(build/adhoc/*.ipa)
          test ${#IPAS[@]} -eq 1 || { echo "expected exactly 1 ipa in build/adhoc, found ${#IPAS[@]}: ${IPAS[*]}"; exit 1; }
          echo "IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Found ${IPAS[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ota-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 5
          if-no-files-found: error
