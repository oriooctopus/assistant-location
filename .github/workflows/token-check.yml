name: token-check

# TEMPORARY: prints only the SHA-256 of the DROP_TOKEN secret so it can be
# compared against the server's shared secret without revealing either.
# Delete once the comparison is done.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          printf '%s' "$DROP_TOKEN" | sha256sum
          echo "length: ${#DROP_TOKEN}"
