name: build

# Builds the signed app on a macOS runner and uploads to TestFlight, driven by
# the App Store Connect API key + a pre-generated distribution cert & profile
# (all stored as repo secrets). No Mac, no Xcode GUI.
#
# Manual only: `ota` is the default delivery path (runs automatically on
# every push to main, installs in ~1 min). TestFlight is the fallback for
# when the phone is off the tailnet — dispatch this by hand when needed. See
# the "CI budget" section in MODULES.md before dispatching.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate + provisioning profile
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12
          echo "$PROVISIONING_PROFILE" | base64 -d > /tmp/profile.mobileprovision

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID $UUID"

      - name: Bake the shared host + secret into the app and the share extension
        env:
          DROP_HOST: ${{ secrets.DROP_HOST }}
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DROP_HOST" || { echo "DROP_HOST secret is empty/missing"; exit 1; }
          test -n "$DROP_TOKEN" || { echo "DROP_TOKEN secret is empty/missing"; exit 1; }
          # Replaces the committed placeholders; the host and token never live
          # in git. One secret pair for both: the location server accepts the
          # same shared token as Bearer on /drop and on /overland, and both
          # endpoints live on the same host.
          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GLDropHost @\"$DROP_HOST\""
            echo "#define GLDropToken @\"$DROP_TOKEN\""
          } > ShareToDesktop/ShareConfig.h
          echo "ShareConfig.h written ($(wc -l < ShareToDesktop/ShareConfig.h) lines)"

          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GL_BAKED_HOST @\"$DROP_HOST\""
            echo "#define GL_BAKED_TOKEN @\"$DROP_TOKEN\""
            echo "#define GL_BAKED_COMMIT @\"$GITHUB_SHA\""
          } > App/BakedConfig.h
          echo "BakedConfig.h written ($(wc -l < App/BakedConfig.h) lines)"

          # Guard: a build that silently kept a placeholder would ship an app
          # that 401s forever (token) or can't resolve a host (host), which is
          # exactly the bug this replaced.
          grep -q NO_TOKEN_BAKED_IN App/BakedConfig.h ShareToDesktop/ShareConfig.h \
            && { echo "token placeholder survived the bake"; exit 1; } || true
          grep -q NO_HOST_BAKED_IN App/BakedConfig.h ShareToDesktop/ShareConfig.h \
            && { echo "host placeholder survived the bake"; exit 1; } || true

      - name: Build + upload to TestFlight
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane beta
