name: build

# Builds the signed app on a macOS runner and uploads it to TestFlight, driven
# entirely by the App Store Connect API key (stored as repo secrets). No Mac,
# no Xcode GUI involvement — push to main (or run manually) and the build lands
# in TestFlight for the account holder to install.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: TestFlight build + upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane beta
