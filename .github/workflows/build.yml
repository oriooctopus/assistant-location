name: build

# Builds the signed app on a macOS runner and uploads to TestFlight, driven by
# the App Store Connect API key + a pre-generated distribution cert & profile
# (all stored as repo secrets). No Mac, no Xcode GUI. Push to main or run
# manually; the build lands in TestFlight for the account holder to install.
on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**"
      - ".github/workflows/sim-test.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate + provisioning profile
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12
          echo "$PROVISIONING_PROFILE" | base64 -d > /tmp/profile.mobileprovision

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i /tmp/profile.mobileprovision | plutil -extract UUID raw -)
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID $UUID"

      - name: Bake the drop token into the share extension
        env:
          DROP_TOKEN: ${{ secrets.DROP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DROP_TOKEN" || { echo "DROP_TOKEN secret is empty/missing"; exit 1; }
          # Replaces the committed placeholder; the token never lives in git.
          {
            echo '// Generated by CI — do not commit the result.'
            echo '#define GLDropEndpoint @"http://100.103.237.24:8302/drop"'
            echo "#define GLDropToken @\"$DROP_TOKEN\""
          } > ShareToDesktop/ShareConfig.h
          echo "ShareConfig.h written ($(wc -l < ShareToDesktop/ShareConfig.h) lines)"

      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane beta
