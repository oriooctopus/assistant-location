name: ota-listen

# Builds the standalone Listen app (com.oliverullman.listen) as an ad-hoc ipa for
# over-the-air install. Same cert/ASC-key flow as ota.yml; no Pods, no extensions.
on:
  push:
    branches: [main]
    paths:
      - "ListenApp/**"
      - "Shared/GLLog.h"
      - "Overland.xcodeproj/**"
      - "fastlane/**"
      - ".github/workflows/ota-listen.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-listen:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Bake the host into the app
        env:
          DROP_HOST: ${{ secrets.DROP_HOST }}
        run: |
          set -euo pipefail
          test -n "$DROP_HOST" || { echo "DROP_HOST secret is empty/missing"; exit 1; }
          {
            echo '// Generated by CI — do not commit the result.'
            echo "#define GL_BAKED_HOST @\"$DROP_HOST\""
          } > ListenApp/ListenBakedConfig.h
          grep -q NO_HOST_BAKED_IN ListenApp/ListenBakedConfig.h \
            && { echo "host placeholder survived the bake"; exit 1; } || true
          echo "ListenBakedConfig.h written"

      - name: Build Listen ad-hoc ipa
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane listen_adhoc

      # The poller on another machine downloads the `ota-listen-ipa` artifact and
      # expects exactly one ipa inside it.
      - name: Locate the ipa
        run: |
          # No set -u: macOS ships bash 3.2, where an empty array reads as unset.
          set -eo pipefail
          shopt -s nullglob
          IPAS=(build/adhoc-listen/*.ipa)
          test ${#IPAS[@]} -eq 1 || { echo "expected exactly 1 ipa in build/adhoc-listen, found ${#IPAS[@]}: ${IPAS[*]}"; exit 1; }
          echo "IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Found ${IPAS[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ota-listen-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 5
          if-no-files-found: error
