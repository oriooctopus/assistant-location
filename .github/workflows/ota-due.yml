name: ota-due

# Builds the Due Clone app (com.oliverullman.due) as an ad-hoc ipa for
# over-the-air install. Same cert/ASC-key flow as ota.yml; no Pods. Also runs on pushes to the due-app branch (a workflow that exists only on a branch cannot be dispatched).
on:
  workflow_dispatch:
  push:
    branches: [due-app]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-due:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Bake the server URL into the app
        env:
          DUE_SERVER_URL: ${{ secrets.DUE_SERVER_URL }}
        run: |
          set -euo pipefail
          test -n "$DUE_SERVER_URL" || { echo "DUE_SERVER_URL secret is empty/missing"; exit 1; }
          SERVER="$(printf %s "$DUE_SERVER_URL" | tr -d '\r\n')"
          {
            echo '// Generated by CI, do not commit the result.'
            echo 'enum Baked {'
            echo "    static let server = \"$SERVER\""
            echo '}'
          } > DueApp/BakedConfig.swift
          # Guard: a placeholder that survives would ship an app that cannot reach the server.
          if grep -q 'NO_[A-Z]*_BAKED_IN' DueApp/BakedConfig.swift; then echo "placeholder survived the bake"; exit 1; fi
          echo "BakedConfig.swift written ($(wc -l < DueApp/BakedConfig.swift) lines)"

      - name: Build Due Clone ad-hoc ipa
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane due_adhoc

      # The poller on another machine downloads the `ota-due-ipa` artifact and
      # expects exactly one ipa inside it.
      - name: Locate the ipa
        run: |
          # No set -u: macOS ships bash 3.2, where an empty array reads as unset.
          set -eo pipefail
          shopt -s nullglob
          IPAS=(build/adhoc-due/*.ipa)
          test ${#IPAS[@]} -eq 1 || { echo "expected exactly 1 ipa in build/adhoc-due, found ${#IPAS[@]}: ${IPAS[*]}"; exit 1; }
          echo "IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Found ${IPAS[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ota-due-ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 5
          if-no-files-found: error
