name: diag-runtimes

# Throwaway diagnostic: lists installed Xcodes and simulator runtimes on the
# macos-15 runner image, so sim-test.yml can select an iOS 26 runtime
# explicitly instead of guessing. Deleted once sim-test.yml is updated.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    steps:
      - name: List Xcode installations
        run: |
          ls -d /Applications/Xcode*.app || true
          echo "---"
          for x in /Applications/Xcode*.app; do
            echo "== $x =="
            "$x/Contents/Developer/usr/bin/xcodebuild" -version || true
          done

      - name: List simulator runtimes (default xcode-select)
        run: |
          xcode-select -p
          xcrun simctl list runtimes
          echo "--- devices ---"
          xcrun simctl list devices available

      - name: List runtimes for each Xcode explicitly
        run: |
          for x in /Applications/Xcode*.app; do
            echo "== $x runtimes =="
            sudo xcode-select -s "$x"
            xcrun simctl list runtimes || true
          done
