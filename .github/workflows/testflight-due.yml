name: testflight-due

# Builds the Due Clone app (com.oliverullman.due, with its NSE and NCE extensions) for the App Store,
# uploads it to TestFlight and adds the build to the "Due Testers" external group (public link).
# Manual only; requires the App Store Connect app record to exist. Does not submit for beta review.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Bake the server URL into the app
        env:
          DUE_SERVER_URL: ${{ secrets.DUE_SERVER_URL }}
        run: |
          set -euo pipefail
          test -n "$DUE_SERVER_URL" || { echo "DUE_SERVER_URL secret is empty/missing"; exit 1; }
          SERVER="$(printf %s "$DUE_SERVER_URL" | tr -d '\r\n')"
          {
            echo '// Generated by CI, do not commit the result.'
            echo 'enum Baked {'
            echo "    static let server = \"$SERVER\""
            echo '}'
          } > DueApp/BakedConfig.swift
          # Guard: a placeholder that survives would ship an app that cannot reach the server.
          if grep -q 'NO_[A-Z]*_BAKED_IN' DueApp/BakedConfig.swift; then echo "placeholder survived the bake"; exit 1; fi
          echo "BakedConfig.swift written ($(wc -l < DueApp/BakedConfig.swift) lines)"

      - name: Build + upload Due to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane due_testflight
