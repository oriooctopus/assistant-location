name: unit-test

# Runs the plain-XCTest SharedTests bundle against the simulator: Shared/
# classes with no UIKit/app dependency (GLTodoOutbox, the Todos tab's
# offline write queue), plus GLTabBarButtonLocatorTests, which DOES need
# UIKit (a real UITabBarController) but still no host app, no signing, no
# Pods -- this bundle depends on none of them, so it's much cheaper than
# sim-test.yml. The simulator this runs against is now pinned to iOS 26 (see
# "Pick an available iPhone simulator" below) precisely because
# GLTabBarButtonLocatorTests exists to catch an iOS-26-only tab bar layout
# change; a green run on iOS 18 would exercise the old, unaffected layout
# and prove nothing about it.
#
# Manual only, opt-in: dispatch this when there's an actual behavior change
# to verify, not on every push. See MODULES.md's "CI budget" section.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Add SharedTests target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_shared_tests_target.rb

      - name: Confirm the SharedTests scheme is visible
        run: xcodebuild -list -project Overland.xcodeproj

      - name: Pick an available iPhone simulator
        run: |
          set -euo pipefail
          # Explicit iOS 26 runtime, not "whatever xcrun happens to boot" --
          # copied verbatim from sim-test.yml's "Boot simulator" step. This
          # bundle's whole point (GLTabBarButtonLocatorTests) is proving the
          # recursive tab-bar-button walk works under iOS 26's ("Liquid
          # Glass") UITabBarController rewrite, where the per-item button
          # views are nested rather than direct children of the bar -- a
          # green run on iOS 18 would boot the OLD flat layout and prove
          # nothing about the bug this suite exists to catch. Fails loudly,
          # not a silent fallback to an older runtime, if no iOS 26 runtime
          # is present at all.
          RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r \
            '[.runtimes[] | select(.isAvailable) | select(.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-26"))] | sort_by(.version) | last | .identifier // empty')
          if [ -z "$RUNTIME_ID" ]; then
            echo "FATAL: no available iOS 26 simulator runtime on this runner. Installed runtimes:"
            xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable) | .name'
            exit 1
          fi
          RUNTIME_NAME=$(xcrun simctl list runtimes -j | jq -r --arg id "$RUNTIME_ID" '.runtimes[] | select(.identifier == $id) | .name')
          echo "Selected simulator runtime: $RUNTIME_NAME ($RUNTIME_ID)"

          UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME_ID" \
            '.devices[$rt][]? | select(.name | test("^iPhone")) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            echo "FATAL: no iPhone device type available under runtime $RUNTIME_ID"
            xcrun simctl list devices available -j | jq --arg rt "$RUNTIME_ID" '.devices[$rt]'
            exit 1
          fi
          echo "Selected simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run SharedTests
        run: |
          set -o pipefail
          # -project, not -workspace: Overland.xcworkspace is CocoaPods-
          # generated (pod install, run by sim-test.yml/device-farm-build.yml
          # for the targets that actually link Pods) and isn't in the repo.
          # SharedTests deliberately depends on no Pods, so building straight
          # off the .xcodeproj skips that step entirely rather than adding it
          # just to generate a workspace this target doesn't need.
          xcodebuild test \
            -project Overland.xcodeproj \
            -scheme SharedTests \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-tests-log
          path: test-output.log
