name: ota-cycle

# Builds the standalone Cycle app (com.oliverullman.cycle) as an ad-hoc ipa for install on
# registered devices. Same cert/ASC-key flow as ota-gripes.yml; no Pods. Manual only. CycleApp/web/config.js
# is generated here from secrets and is gitignored, so a build can never ship a stale or empty one.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ota-cycle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Write CycleApp/web/config.js from secrets
        env:
          CYCLE_SUPABASE_URL: ${{ secrets.CYCLE_SUPABASE_URL }}
          CYCLE_SUPABASE_ANON_KEY: ${{ secrets.CYCLE_SUPABASE_ANON_KEY }}
          CYCLE_BOX_URL: ${{ secrets.CYCLE_BOX_URL }}
        run: |
          set -euo pipefail
          test -n "$CYCLE_SUPABASE_URL" || { echo "CYCLE_SUPABASE_URL secret is empty/missing"; exit 1; }
          test -n "$CYCLE_SUPABASE_ANON_KEY" || { echo "CYCLE_SUPABASE_ANON_KEY secret is empty/missing"; exit 1; }
          test -n "$CYCLE_BOX_URL" || { echo "CYCLE_BOX_URL secret is empty/missing"; exit 1; }
          mkdir -p CycleApp/web
          # jq builds the JSON so quotes or backslashes in a secret cannot break the file.
          jq -n --arg u "$CYCLE_SUPABASE_URL" --arg k "$CYCLE_SUPABASE_ANON_KEY" --arg b "$CYCLE_BOX_URL" \
            '"window.CYCLE_CONFIG = " + ({supabaseUrl: $u, supabaseAnonKey: $k, boxUrl: $b, overlays: ["private/config.js", "private/overlay.js"]} | tojson) + ";"' -r \
            > CycleApp/web/config.js
          test -s CycleApp/web/config.js
          echo "config.js written ($(wc -c < CycleApp/web/config.js) bytes)"

      - name: Add private resources
        env:
          OVERLAY_DEPLOY_KEY: ${{ secrets.OVERLAY_DEPLOY_KEY }}
          OVERLAY_SRC_PATH: ${{ secrets.OVERLAY_SRC_PATH }}
          OVERLAY_CFG_URL: ${{ secrets.OVERLAY_CFG_URL }}
        run: |
          set -euo pipefail
          test -n "$OVERLAY_DEPLOY_KEY" && test -n "$OVERLAY_SRC_PATH" && test -n "$OVERLAY_CFG_URL" || { echo "private resource secrets missing"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVERLAY_DEPLOY_KEY" > ~/.ssh/pr_key && chmod 600 ~/.ssh/pr_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/pr_key -o IdentitiesOnly=yes"
          SRC=/tmp/pr-src
          # Output of these git commands is silenced: it would name the private tree.
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:oriooctopus/assistant.git "$SRC" >/dev/null 2>&1
          git -C "$SRC" sparse-checkout set --no-cone "/$OVERLAY_SRC_PATH/" >/dev/null 2>&1
          mkdir -p CycleApp/web/private
          cp -R "$SRC/$OVERLAY_SRC_PATH/." CycleApp/web/private/
          rm -rf "$SRC" ~/.ssh/pr_key
          rm -f CycleApp/web/private/config.example.js CycleApp/web/private/.gitignore CycleApp/web/private/*.test.mjs
          N=$(find CycleApp/web/private -type f | wc -l)
          test "$N" -ge 1 || { echo "private resources empty"; exit 1; }
          test -s CycleApp/web/private/overlay.js || { echo "private resources incomplete"; exit 1; }
          jq -n --arg u "$OVERLAY_CFG_URL" '"window.CK_CONFIG = " + ({url: $u} | tojson) + ";"' -r > CycleApp/web/private/config.js
          echo "private resources added ($N files)"

      - name: Build Cycle ad-hoc ipa
        env:
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane cycle_adhoc

      # The poller on another machine downloads the `ota-cycle-ipa` artifact and
      # expects exactly one ipa inside it.
      - name: Locate the ipa
        run: |
          # No set -u: macOS ships bash 3.2, where an empty array reads as unset.
          set -eo pipefail
          shopt -s nullglob
          IPAS=(build/adhoc-cycle/*.ipa)
          test ${#IPAS[@]} -eq 1 || { echo "expected exactly 1 ipa in build/adhoc-cycle, found ${#IPAS[@]}: ${IPAS[*]}"; exit 1; }
          echo "IPA_PATH=${IPAS[0]}" >> "$GITHUB_ENV"
          echo "Found ${IPAS[0]}"

      # The ipa embeds private resources and this repo's artifacts are public: upload only ciphertext.
      - name: Seal the ipa
        env:
          OVERLAY_ENC_KEY: ${{ secrets.OVERLAY_ENC_KEY }}
        run: |
          set -euo pipefail
          test -n "$OVERLAY_ENC_KEY" || { echo "seal key missing"; exit 1; }
          mkdir -p build/sealed
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:OVERLAY_ENC_KEY -in "$IPA_PATH" -out build/sealed/cycle.bin
          test -s build/sealed/cycle.bin
          echo "SEALED_PATH=build/sealed/cycle.bin" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ota-cycle-ipa
          path: ${{ env.SEALED_PATH }}
          retention-days: 5
          if-no-files-found: error
