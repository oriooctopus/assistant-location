name: testflight-cycle

# Builds the standalone Cycle app (WKWebView wrapper, com.oliverullman.cycle), uploads it to
# TestFlight and adds the build to the "Cycle Testers" external group. Manual only; requires the
# App Store Connect app record to exist (a one-time manual step: the API cannot create it). Does not submit for beta review.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Guard, no private resources in this build
        run: |
          test ! -e CycleApp/web/private || { echo "CycleApp/web/private must not exist in this build"; exit 1; }

      - name: Select newest Xcode (Apple requires iOS 26 SDK for uploads)
        run: |
          echo "Available Xcodes:"; ls -d /Applications/Xcode_*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Import signing certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/dist.p12

          KEYCHAIN=/tmp/build.keychain
          KPW=ci-temp-pw
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # make the temp keychain searchable alongside the defaults
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db


      - name: Write CycleApp/web/config.js from secrets
        env:
          CYCLE_SUPABASE_URL: ${{ secrets.CYCLE_SUPABASE_URL }}
          CYCLE_SUPABASE_ANON_KEY: ${{ secrets.CYCLE_SUPABASE_ANON_KEY }}
          CYCLE_BOX_URL: ${{ secrets.CYCLE_BOX_URL }}
        run: |
          set -euo pipefail
          test -n "$CYCLE_SUPABASE_URL" || { echo "CYCLE_SUPABASE_URL secret is empty/missing"; exit 1; }
          test -n "$CYCLE_SUPABASE_ANON_KEY" || { echo "CYCLE_SUPABASE_ANON_KEY secret is empty/missing"; exit 1; }
          test -n "$CYCLE_BOX_URL" || { echo "CYCLE_BOX_URL secret is empty/missing"; exit 1; }
          mkdir -p CycleApp/web
          # jq builds the JSON so quotes or backslashes in a secret cannot break the file.
          jq -n --arg u "$CYCLE_SUPABASE_URL" --arg k "$CYCLE_SUPABASE_ANON_KEY" --arg b "$CYCLE_BOX_URL" \
            '"window.CYCLE_CONFIG = " + ({supabaseUrl: $u, supabaseAnonKey: $k, boxUrl: $b} | tojson) + ";"' -r \
            > CycleApp/web/config.js
          test -s CycleApp/web/config.js
          echo "config.js written ($(wc -c < CycleApp/web/config.js) bytes)"

      - name: Build + upload Cycle to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: fastlane cycle_beta
