name: mutation-audit

# Runs scripts/mutation_audit.py (apply one production mutation, run
# SharedTests, restore, repeat) against GLTodoOutbox.m -- proves the suite
# actually kills the mutations it's meant to catch.
on:
  workflow_dispatch:
  # TEMPORARY: same reason as unit-test.yml's push trigger -- workflow_dispatch
  # is only exposed in the UI/API for a workflow file on the DEFAULT branch,
  # and this file only exists on todo-outbox so far. REMOVE this `push:`
  # block (keep workflow_dispatch) once it has landed on main.
  push:
    branches: [todo-outbox]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-audit:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Add SharedTests target
        run: |
          gem install xcodeproj --no-document
          ruby scripts/add_shared_tests_target.rb

      - name: Pick an available iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r \
            '[.devices[][] | select(.name | test("^iPhone"))] | last | .udid // empty')
          [ -n "$UDID" ] || { echo "no simulator"; exit 1; }
          xcrun simctl boot "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run mutation audit
        run: python3 scripts/mutation_audit.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.json
            mutation-logs/
