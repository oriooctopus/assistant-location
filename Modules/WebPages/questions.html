<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facebook</title>
<script src="gl-bridge.js"></script>
<link rel="stylesheet" href="page.css">
<style>
  /* page.css pins html/body to height:100%, and a gradient theme (dusk) paints
     its --gl-bg-image over that one-viewport-tall box, then REPEATS it down the
     rest of a scrolling page: the colour jumped back to the gradient's start
     every viewport height. Let the root grow with its content so the gradient
     spans the whole document (same fix as more.html's body). */
  html, body { height: auto; min-height: 100%; }
  /* Scale: radius 10 / 14 / 18 (page.css card) / pill; spacing 4 / 8 / 12 / 16. */
  .q-item { padding: 12px 16px; }
  .q-item + .q-item { border-top: 1px solid rgba(127, 127, 127, 0.18); }
  .q-head { display: flex; align-items: center; gap: 8px; padding: 16px 20px 8px 20px; }
  .q-section { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gl-text-dim); }
  .q-count { min-width: 22px; padding: 1px 7px; border-radius: 999px; text-align: center; font-size: 12px; font-weight: 700;
    background: rgba(127, 127, 127, 0.22); color: var(--gl-text); }
  .q-title { font-size: 16px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-sub { margin-top: 1px; font-size: 13px; color: var(--gl-text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-body { font-size: 14px; line-height: 1.35; color: var(--gl-text); margin-top: 4px; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .q-time { font-size: 12px; color: var(--gl-text-dim); white-space: nowrap; flex: none; }
  .q-earlier { color: var(--gl-text-dim) !important; font-size: 14px !important; }

  .av { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--gl-text); }
  .av.sm { width: 36px; height: 36px; font-size: 15px; }
  .q-main { display: flex; align-items: flex-start; gap: 12px; }
  .q-main .q-col { min-width: 0; flex: 1; }
  .q-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .q-tap { cursor: pointer; min-height: 44px; }
  .q-replied { opacity: 0.7; }
  .q-replied .q-body { color: var(--gl-text-dim); }

  /* Swipe-to-reveal rows (iOS Mail style): the foreground slides left over a
     right-anchored action bar whose width tracks the reveal. */
  .q-item.sw { padding: 0; position: relative; overflow: hidden; }
  .sw-fg { position: relative; padding: 12px 16px; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .sw-bar { position: absolute; top: 0; right: 0; bottom: 0; width: 0; overflow: hidden; }
  .sw-in { position: absolute; top: 0; right: 0; bottom: 0; display: flex; }
  .sw-btn { width: 88px; border: none; padding: 0 8px; font: inherit; font-size: 14px; font-weight: 700; line-height: 1.15; }
  .sw-btn.accent { background: var(--gl-accent); color: var(--gl-bg); }
  .sw-btn.danger { background: var(--gl-danger); color: #fff; }
  .sw-btn:disabled { opacity: 0.5; }

  /* Visits */
  .v-item .sw-fg { display: flex; align-items: center; gap: 12px; }
  .v-date { flex: none; width: 52px; padding: 6px 0; border-radius: 14px; text-align: center; background: rgba(127, 127, 127, 0.16); }
  .v-wd { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gl-accent); }
  .v-day { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .v-mon { font-size: 11px; color: var(--gl-text-dim); }
  .v-mid { min-width: 0; flex: 1; }
  .v-when { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .v-item.past { opacity: 0.55; }
  .v-item.past .v-wd { color: var(--gl-text-dim); }

  .t-pill { min-height: 44px; min-width: 64px; background: none; border: 1px solid rgba(127, 127, 127, 0.45); color: var(--gl-accent);
    border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; padding: 0 16px; white-space: nowrap; flex: none; }
  .t-pill.t-sold { background: var(--gl-accent); border-color: var(--gl-accent); color: var(--gl-bg); }
  .t-confirm { display: flex; gap: 8px; margin-top: 12px; }
  .t-confirm button { flex: 1; min-height: 44px; padding: 0 12px; font: inherit; font-size: 14px; font-weight: 700; border: none; border-radius: 14px; }
  .t-confirm .t-cancel { background: rgba(127, 127, 127, 0.18); color: var(--gl-text); }
  .t-confirm .t-yes { background: var(--gl-accent); color: var(--gl-bg); }
  .t-pill.t-sold-confirm { flex: 1 1 100%; white-space: normal; text-align: center; border-radius: 14px; }
  .t-pill:disabled { opacity: 0.6; }
  .t-sold-done { font-size: 13px; font-weight: 600; color: var(--gl-accent); white-space: nowrap; }
  .t-older { display: block; width: 100%; min-height: 48px; text-align: left; background: none; border: none; border-top: 1px solid rgba(127, 127, 127, 0.18);
    color: var(--gl-accent); font: inherit; font-size: 14px; font-weight: 700; }
  .t-item { cursor: pointer; }
  .t-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .t-row .t-txt { min-width: 0; flex: 1; }
  .t-chat { margin-top: 12px; max-height: 260px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; cursor: default; }
  .t-msg { max-width: 82%; padding: 8px 12px; border-radius: 18px; font-size: 14px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
  .t-msg.buyer { align-self: flex-start; background: rgba(127, 127, 127, 0.24); color: var(--gl-text); border-bottom-left-radius: 6px; }
  .t-msg.you { align-self: flex-end; background: var(--gl-accent); color: var(--gl-bg); border-bottom-right-radius: 6px; }
  .t-msg .t-mt { display: block; font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .t-note { font-size: 12px; color: var(--gl-text-dim); }
  .t-empty { padding: 24px 16px; text-align: center; color: var(--gl-text-dim); font-size: 15px; }

  /* Answer view */
  .q-detail { padding: 16px; }
  .q-detail .q-main { align-items: center; }
  .q-detail .t-chat { max-height: none; margin-top: 16px; }
  .q-detail .q-body { display: block; -webkit-line-clamp: unset; font-size: 16px; margin-top: 16px; }
  #q-text {
    display: block; width: calc(100% - 32px); margin: 0 16px 12px 16px; min-height: 96px;
    background: var(--gl-surface-translucent); color: var(--gl-text);
    border: 1px solid rgba(127, 127, 127, 0.3); border-radius: 14px; padding: 12px;
    font: inherit; font-size: 16px; resize: vertical;
  }
  #q-send { display: block; width: calc(100% - 32px); margin: 0 16px 16px 16px; min-height: 48px; border-radius: 14px; font-size: 16px; }

  .q-empty-card { padding: 48px 24px; text-align: center; }
  .q-empty-card .q-empty-icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .q-empty-card .q-empty-h { font-size: 17px; font-weight: 700; color: var(--gl-text); }
  .q-empty-card .q-empty-p { font-size: 14px; margin-top: 4px; }

  .q-toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding: 12px 16px; border-radius: 14px; background: var(--gl-surface); color: var(--gl-text); font-size: 14px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(127, 127, 127, 0.3); }
  .q-toast .gl-btn-plain { min-height: 44px; }
  .gl-back-btn { min-height: 44px; min-width: 44px; text-align: left; }
</style>
</head>
<body>
<div class="gl-header">
  <button id="q-back" class="gl-back-btn" type="button">Back</button>
  <span id="q-header-title" class="gl-header-title">Facebook</span>
</div>

<div id="q-error" class="gl-error-banner gl-hidden">
  <span id="q-error-text"></span>
  <button class="gl-btn-plain" id="q-retry" type="button">Retry</button>
</div>

<div id="q-saved" class="gl-saved-mark gl-hidden">
  <span>Saved copy</span>
  <button class="gl-btn-plain" id="q-saved-retry" type="button">Retry</button>
</div>

<div id="q-loading" class="gl-empty-state"><div class="gl-spinner" style="margin:0 auto 12px auto"></div>Loading…</div>
<div id="q-empty" class="gl-card q-empty-card gl-empty-state gl-hidden">
  <div class="q-empty-icon" aria-hidden="true">&#127881;</div>
  <div class="q-empty-h">All caught up</div>
  <div class="q-empty-p">No buyers need you right now. New questions show up here.</div>
</div>
<div id="q-list" role="list"></div>

<div id="q-answer" class="gl-hidden">
  <div class="gl-card q-detail">
    <div class="q-main">
      <div id="q-a-av" class="av" aria-hidden="true"></div>
      <div class="q-col" style="min-width:0;flex:1">
        <div id="q-a-title" class="q-title"></div>
        <div id="q-a-listing" class="q-sub"></div>
      </div>
    </div>
    <div id="q-a-earlier"></div>
    <div id="q-a-body" class="q-body"></div>
  </div>
  <textarea id="q-text" placeholder="Your reply" aria-label="Your reply"></textarea>
  <button id="q-send" class="gl-btn" type="button" disabled>Send</button>
</div>

<div id="q-toast" class="q-toast gl-hidden"><span id="q-toast-msg"></span><button class="gl-btn-plain gl-hidden" id="q-undo" type="button">Undo</button></div>

<script>
(function () {
  'use strict';

  // A question is {id, source, title, body, createdAt, context, answer} (see
  // location-server/lib/questions.mjs). Nothing below knows about Marketplace:
  // a reply is POSTed to question.answer.endpoint with question.answer.payload
  // plus {text, opId}, so a new question source needs no change to this page.
  var OUTBOX_KEY = 'gl.questions.outbox';
  // Last successful list, painted first so the page is never blank offline.
  // Per-page key: file:// pages share one localStorage.
  var CACHE_KEY = 'gl.questions.cache';
  // Replies Oliver just sent, shown optimistically under "Replied" for a day.
  var REPLIED_KEY = 'gl.questions.replied';
  var REPLIED_MS = 24 * 3600 * 1000;

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('q-list'), loadingEl = $('q-loading'), emptyEl = $('q-empty'), errorEl = $('q-error');
  var answerEl = $('q-answer'), textEl = $('q-text'), sendBtn = $('q-send'), titleEl = $('q-header-title');

  var questions = [];      // last fetched list, minus anything answered since
  var takeovers = []; // {listing, buyer, value, reason}: buyers Oliver took over by hand
  var expandedChat = null; // tkey of the takeover row whose conversation is open
  var olderOpen = false;   // the collapsed "N older" takeover group is expanded
  var confirming = null;   // 'listing\0buyer' of the takeover row showing its confirm buttons
  var visits = [], offers = [];  // confirmed pickups; offered times are parsed but not shown
  var loaded = false;      // a list (live or the saved copy) is on screen
  var fresh = false;       // the live fetch has succeeded at least once
  var current = null;      // question shown in the answer view, or null on the list
  var pendingOpen = null;  // {listing, buyer} from a notification tap that arrived before the list did
  var toastTimer = null;

  function apiBase() {
    var boot = window.GL_BOOT;
    return (boot && typeof boot.apiBase === 'string') ? boot.apiBase : '';
  }

  function headers() {
    return GLBridge.call('getApiToken', {}).then(function (r) {
      var h = { 'Content-Type': 'application/json' };
      if (r && r.token) h['Authorization'] = 'Bearer ' + r.token;
      return h;
    });
  }

  function ago(iso) {
    var mins = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    if (mins < 60 * 24) return Math.round(mins / 60) + 'h ago';
    return Math.round(mins / 60 / 24) + 'd ago';
  }

  var undoAction = null;
  function toast(msg, undo, ms) {
    var t = $('q-toast');
    $('q-toast-msg').textContent = msg;
    undoAction = undo || null;
    $('q-undo').classList.toggle('gl-hidden', !undo);
    t.classList.remove('gl-hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('gl-hidden'); undoAction = null; }, ms || (undo ? 6000 : 2500));
  }

  function showError(msg) {
    $('q-error-text').textContent = msg;
    errorEl.classList.remove('gl-hidden');
  }

  // ---- views ---------------------------------------------------------------
  function showList() {
    current = null;
    answerEl.classList.add('gl-hidden');
    titleEl.textContent = 'Facebook';
    loadingEl.classList.toggle('gl-hidden', loaded);
    renderList();
  }

  var DAY = 24 * 3600 * 1000;
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  // Whole calendar days from today to iso (negative = past).
  function dayDiff(iso) { return Math.round((startOfDay(new Date(iso)) - startOfDay(new Date())) / DAY); }
  function clock(iso) { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  // Buyer title is "Buyer \u00b7 Listing"; take it apart for display only.
  function splitTitle(title, ctx) {
    var i = title.indexOf(' \u00b7 ');
    var buyer = (ctx && ctx.buyer) || (i === -1 ? title : title.slice(0, i));
    var listing = (ctx && ctx.listing) || (i === -1 ? '' : title.slice(i + 3));
    return { buyer: buyer, listing: listing };
  }

  // Deterministic soft colour per name; the glyph stays var(--gl-text) so it
  // reads on light, dark and the dusk gradient alike.
  function avatar(name, cls) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    var a = el('div', 'av' + (cls ? ' ' + cls : ''), (name.trim().charAt(0) || '?').toUpperCase());
    a.style.background = 'hsla(' + h + ', 65%, 55%, 0.30)';
    a.style.boxShadow = 'inset 0 0 0 1px hsla(' + h + ', 65%, 55%, 0.5)';
    a.setAttribute('aria-hidden', 'true');
    return a;
  }

  // ---- swipe-to-reveal rows -------------------------------------------------
  // key -> the row that is open. The list re-renders wholesale (poll, Sold
  // confirm state), so the open row is identified by key, not by DOM node.
  var openKey = null, openRow = null, lastSwipeAt = 0;
  var SW_BTN = 88, SW_LOCK = 10;

  function swBtn(label, kind, handler, disabled) {
    var b = el('button', 'sw-btn ' + kind, label); b.type = 'button';
    if (disabled) b.disabled = true;
    b.addEventListener('click', function (ev) { ev.stopPropagation(); handler(); });
    return b;
  }

  // fg: the row's content; actions: swBtn() buttons revealed by dragging left.
  function swipeRow(key, cls, fg, actions, onTap) {
    var W = SW_BTN * actions.length;
    var r = el('div', cls + ' sw'); r.setAttribute('role', 'listitem'); r.dataset.key = key;
    fg.classList.add('sw-fg');
    var bar = el('div', 'sw-bar'), inner = el('div', 'sw-in');
    actions.forEach(function (a) { inner.appendChild(a); });
    bar.appendChild(inner); r.appendChild(bar); r.appendChild(fg);
    var offset = 0;
    function set(px, animate) {
      offset = px;
      var tr = animate ? 'transform .2s ease' : 'none';
      fg.style.transition = tr; bar.style.transition = animate ? 'width .2s ease' : 'none';
      fg.style.transform = px ? 'translateX(' + px + 'px)' : '';
      bar.style.width = -px + 'px';
      inner.style.width = W + 'px';
      r.classList.toggle('open', px === -W);
    }
    function settle(open, animate) {
      set(open ? -W : 0, animate);
      if (open) { openKey = key; openRow = r; }
      else if (openRow === r) { openKey = null; openRow = null; }
    }
    r.swipeClose = function () { settle(false, true); };
    if (actions.length && key === openKey) { settle(true, false); }

    var sx = 0, sy = 0, startOff = 0, axis = null, tracking = false;
    r.addEventListener('touchstart', function (e) {
      if (!actions.length || e.touches.length !== 1) return;
      if (openRow && openRow !== r) openRow.swipeClose();
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; startOff = offset; axis = null; tracking = true;
    }, { passive: true });
    r.addEventListener('touchmove', function (e) {
      if (!tracking) return;
      var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
      if (axis === null) {
        if (Math.abs(dx) < SW_LOCK && Math.abs(dy) < SW_LOCK) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';   // locked for the rest of this touch
      }
      if (axis !== 'x') return;                            // vertical: leave it to the scroller
      e.preventDefault();
      set(Math.max(-W, Math.min(0, startOff + dx)), false);
    }, { passive: false });
    function end(cancelled) {
      if (!tracking) return;
      tracking = false;
      if (axis !== 'x') return;
      lastSwipeAt = Date.now();                            // swallow the click this touch ends with
      settle(cancelled ? startOff < 0 : offset < -W / 2, true);
    }
    r.addEventListener('touchend', function () { end(false); });
    r.addEventListener('touchcancel', function () { end(true); });
    fg.addEventListener('click', function () {
      if (Date.now() - lastSwipeAt < 150) return;
      if (r.classList.contains('open')) { r.swipeClose(); return; }
      if (onTap) onTap();
    });
    return r;
  }
  // A touch or click anywhere outside the open row closes it.
  function closeOpenIfOutside(e) { if (openRow && !openRow.contains(e.target)) openRow.swipeClose(); }
  document.addEventListener('touchstart', closeOpenIfOutside, { passive: true });
  document.addEventListener('click', closeOpenIfOutside);

  function section(title, rows) {
    if (rows.length === 0) return;
    var h = el('div', 'q-head');
    h.appendChild(el('div', 'q-section', title));
    h.appendChild(el('span', 'q-count', String(rows.length)));
    var card = el('div', 'gl-card'); card.setAttribute('role', 'list');
    rows.forEach(function (r) { card.appendChild(r); });
    listEl.appendChild(h); listEl.appendChild(card);
  }

  // Avatar + name (bold) with the time right-aligned, listing dim, preview clamped.
  function buyerRow(cls, who, preview, time) {
    var r = el('div', cls); r.setAttribute('role', 'listitem');
    var main = el('div', 'q-main');
    main.appendChild(avatar(who.buyer));
    var col = el('div', 'q-col');
    var line = el('div', 'q-line');
    line.appendChild(el('div', 'q-title', who.buyer));
    if (time) line.appendChild(el('div', 'q-time', time));
    col.appendChild(line);
    if (who.listing) col.appendChild(el('div', 'q-sub', who.listing));
    if (preview) col.appendChild(el('div', 'q-body', preview));
    main.appendChild(col); r.appendChild(main);
    return r;
  }

  function readReplied() {
    var all = JSON.parse(localStorage.getItem(REPLIED_KEY) || '[]');
    return all.filter(function (r) { return Date.now() - Date.parse(r.sentAt) < REPLIED_MS; });
  }
  function writeReplied(items) { localStorage.setItem(REPLIED_KEY, JSON.stringify(items)); }

  function renderList() {
    listEl.innerHTML = '';
    if (!loaded || current) return;
    var replied = readReplied();
    var empty = questions.length + visits.length + replied.length === 0;
    emptyEl.classList.toggle('gl-hidden', !empty);
    listEl.classList.remove('gl-hidden');
    section('Questions', questions.map(function (q) {
      var fg = buyerRow('', splitTitle(q.title, q.context), q.body, ago(q.createdAt)); fg.removeAttribute('role');
      var ok = !!(q.context && q.context.listing && q.context.buyer);
      var r = swipeRow('q:' + q.id, 'q-item q-tap', fg, [
        swBtn('Send back to AI', 'accent', function () { questionAction(q, '/questions/send-back', 'Sent back to AI', "Couldn't send back: "); }, !ok),
        swBtn('Discard', 'danger', function () { questionAction(q, '/questions/dismiss', 'Discarded', "Couldn't discard: "); }, !ok),
      ], function () { showAnswer(q); });
      r.dataset.id = q.id;
      return r;
    }));
    section('Replied', replied.slice().reverse().map(function (r) {
      return buyerRow('q-item q-replied', splitTitle(r.title), 'You: ' + r.text, ago(r.sentAt));
    }));
    section('Visits', visits.filter(function (v) { return !v.past; }).map(visitRow));
    section('Past visits', visits.filter(function (v) { return v.past; }).map(visitRow));
    renderTakeovers();
  }

  // Sold button: first tap arms ("Tap again to confirm sold to X", ~4s), second
  // tap queues it. No window.confirm (WKWebView shows none). soldState is keyed
  // by listing+buyer: 'confirm' | 'sending' | 'done'. The row leaves on the next poll.
  var soldState = {}, soldTimers = {};
  function visitRow(v) {
    var k = tkey(v), st = soldState[k];
    var fg = el('div', '');
    var d = new Date(v.pickupAt);
    var date = el('div', 'v-date');
    date.appendChild(el('div', 'v-wd', d.toLocaleDateString([], { weekday: 'short' })));
    date.appendChild(el('div', 'v-day', String(d.getDate())));
    date.appendChild(el('div', 'v-mon', d.toLocaleDateString([], { month: 'short' })));
    fg.appendChild(date);
    var mid = el('div', 'v-mid');
    mid.appendChild(el('div', 'q-title', v.buyer));
    mid.appendChild(el('div', 'q-sub', v.listing));
    var n = dayDiff(v.pickupAt);
    mid.appendChild(el('div', 'v-when', (n === 0 ? 'Today ' : n === 1 ? 'Tomorrow ' : '') + clock(v.pickupAt)));
    fg.appendChild(mid);
    var cls = 'q-item v-item' + (v.past ? ' past' : '');
    if (st === 'done') {
      fg.appendChild(el('span', 't-sold-done', 'Marking sold…'));
      return swipeRow('v:' + k, cls, fg, []);
    }
    return swipeRow('v:' + k, cls, fg, [
      swBtn(st === 'confirm' ? 'Tap again' : st === 'sending' ? 'Sending…' : 'Sold', 'accent', function () { tapSold(v); }, st === 'sending'),
      swBtn('Delete', 'danger', function () { deleteVisit(v); }),
    ]);
  }

  // Optimistic like hand-back: the row goes now, a refusal puts it back.
  function deleteVisit(v) {
    var i = visits.indexOf(v), k = tkey(v);
    visits = visits.filter(function (x) { return x !== v; });
    delete soldState[k]; clearTimeout(soldTimers[k]);
    openKey = null;
    renderList();
    toast('Visit deleted');
    headers().then(function (h) {
      return fetch(apiBase() + '/visits/delete', { method: 'POST', headers: h, body: JSON.stringify({ listing: v.listing, buyer: v.buyer }) });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }).catch(function (err) {
      visits.splice(Math.min(Math.max(i, 0), visits.length), 0, v);
      renderList();
      showError("Couldn't delete visit: " + err.message);
    });
  }

  function tapSold(v) {
    var k = tkey(v);
    if (soldState[k] === 'sending' || soldState[k] === 'done') return;
    if (soldState[k] !== 'confirm') {
      soldState[k] = 'confirm';
      clearTimeout(soldTimers[k]);
      soldTimers[k] = setTimeout(function () { if (soldState[k] === 'confirm') { delete soldState[k]; renderList(); } }, 4000);
      renderList();
      return;
    }
    clearTimeout(soldTimers[k]);
    soldState[k] = 'sending';
    renderList();
    headers().then(function (h) {
      return fetch(apiBase() + '/listings/sold', { method: 'POST', headers: h, body: JSON.stringify({ listing: v.listing, buyer: v.buyer }) });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      soldState[k] = 'done';
      renderList();
    }, function (err) { throw err; }).catch(function (err) {
      delete soldState[k];
      renderList();
      showError("Couldn't mark sold: " + err.message);
    });
  }

  // No message from either side for more than this: folded into "N older".
  // A takeover with no lastMessageAt yet is unknown, not old, and stays out.
  var STALE_MS = 5 * 24 * 3600 * 1000;
  function isStale(t) { return t.lastMessageAt !== null && Date.now() - Date.parse(t.lastMessageAt) > STALE_MS; }

  function tkey(t) { return t.listing + '\0' + t.buyer; }

  // What the chat is about: the recorded transcript when there is one, else just
  // the last inbox preview line.
  function chatView(t) {
    var box = document.createElement('div'); box.className = 't-chat';
    if (t.messages) {
      t.messages.forEach(function (m) {
        var b = document.createElement('div'); b.className = 't-msg ' + m.from; b.textContent = m.text;
        if (m.time) { var mt = document.createElement('span'); mt.className = 't-mt'; mt.textContent = m.time; b.appendChild(mt); }
        box.appendChild(b);
      });
      if (t.approximate) { var n = document.createElement('div'); n.className = 't-note'; n.textContent = 'Older reads only kept the messages, not their order.'; box.appendChild(n); }
    } else {
      var none = document.createElement('div'); none.className = 't-note'; none.textContent = 'No messages recorded yet.'; box.appendChild(none);
    }
    if (t.preview) {
      var pv = document.createElement('div'); pv.className = 't-note'; pv.textContent = 'Latest in inbox: ' + t.preview; box.appendChild(pv);
    }
    return box;
  }

  function takeoverRow(t) {
    var r = el('div', 'q-item t-item'); r.setAttribute('role', 'listitem');
    var line = el('div', 't-row');
    line.style.alignItems = 'flex-start';
    line.appendChild(avatar(t.buyer));
    var txt = el('div', 't-txt');
    txt.appendChild(el('div', 'q-title', t.buyer));
    txt.appendChild(el('div', 'q-sub', t.listing));
    txt.appendChild(el('div', 'q-body', t.reason));
    if (t.lastMessageAt) txt.appendChild(el('div', 'q-time', 'Last message ' + ago(t.lastMessageAt)));
    line.appendChild(txt);
    if (confirming !== tkey(t)) {
      var pill = el('button', 't-pill', 'Hand back'); pill.type = 'button';
      pill.addEventListener('click', function () { confirming = tkey(t); renderList(); });
      line.appendChild(pill);
    }
    r.appendChild(line);
    r.setAttribute('aria-expanded', String(expandedChat === tkey(t)));
    r.addEventListener('click', function (ev) {
      if (ev.target.closest('button') || ev.target.closest('.t-chat')) return;
      expandedChat = expandedChat === tkey(t) ? null : tkey(t);
      renderList();
    });
    if (expandedChat === tkey(t)) r.appendChild(chatView(t));
    if (confirming === tkey(t)) {
      var c = document.createElement('div'); c.className = 't-confirm';
      var no = document.createElement('button'); no.type = 'button'; no.className = 't-cancel'; no.textContent = 'Cancel';
      no.addEventListener('click', function () { confirming = null; renderList(); });
      var yes = document.createElement('button'); yes.type = 'button'; yes.className = 't-yes'; yes.textContent = 'Hand back to auto-reply';
      yes.addEventListener('click', function () { handBack(t); });
      c.appendChild(no); c.appendChild(yes); r.appendChild(c);
    }
    return r;
  }

  function renderTakeovers() {
    var h = el('div', 'q-head');
    h.appendChild(el('div', 'q-section', 'Taken over by you'));
    h.appendChild(el('span', 'q-count', String(takeovers.length)));
    var card = document.createElement('div'); card.className = 'gl-card'; card.id = 'q-takeovers'; card.setAttribute('role', 'list');
    if (takeovers.length === 0) {
      var e = document.createElement('div'); e.className = 't-empty'; e.textContent = 'No conversations taken over.';
      card.appendChild(e);
    }
    var recent = takeovers.filter(function (t) { return !isStale(t); });
    var older = takeovers.filter(isStale);
    recent.forEach(function (t) { card.appendChild(takeoverRow(t)); });
    if (older.length) {
      var tog = document.createElement('button'); tog.type = 'button'; tog.className = 'q-item t-older';
      tog.setAttribute('aria-expanded', String(olderOpen));
      tog.textContent = older.length + ' older ' + (olderOpen ? '\u25B4' : '\u25BE');
      tog.addEventListener('click', function () { olderOpen = !olderOpen; renderList(); });
      card.appendChild(tog);
      if (olderOpen) older.forEach(function (t) { card.appendChild(takeoverRow(t)); });
    }
    listEl.appendChild(h); listEl.appendChild(card);
  }

  // Not queued offline like replies: handing back is an immediate, visible
  // change to what the auto-responder does, so a failure reverts and says so.
  function postTakeover(path, t) {
    return headers().then(function (h) {
      return fetch(apiBase() + path, { method: 'POST', headers: h, body: JSON.stringify({ listing: t.listing, buyer: t.buyer, value: t.value }) });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
    });
  }

  function handBack(t) {
    var i = takeovers.indexOf(t);
    confirming = null;
    takeovers.splice(i, 1);
    renderList();
    postTakeover('/takeovers/hand-back', t).then(function () {
      toast('Handed back ' + t.buyer + ' to auto-reply', function () {
        takeovers.splice(Math.min(i, takeovers.length), 0, t);
        renderList();
        postTakeover('/takeovers/restore', t).catch(function (err) {
          takeovers = takeovers.filter(function (x) { return x !== t; });
          renderList();
          showError("Couldn't undo: " + err.message);
        });
      });
    }, function (err) {
      takeovers.splice(Math.min(i, takeovers.length), 0, t);
      renderList();
      showError("Couldn't hand back: " + err.message);
    });
  }

  function showAnswer(q) {
    current = q;
    listEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
    loadingEl.classList.add('gl-hidden');
    titleEl.textContent = 'Reply';
    var who = splitTitle(q.title, q.context);
    $('q-a-title').textContent = who.buyer;
    $('q-a-listing').textContent = who.listing;
    var av = avatar(who.buyer);
    $('q-a-av').replaceWith(av); av.id = 'q-a-av';
    var earlier = $('q-a-earlier');
    earlier.innerHTML = '';
    var bodyEl = $('q-a-body');
    bodyEl.textContent = q.body;
    bodyEl.classList.remove('gl-hidden');
    if (q.messages && q.messages.length) {
      // Full chat history. The recorded read can predate the newest message, so
      // add it when the transcript does not already end with it.
      var msgs = q.messages.slice();
      var last = msgs[msgs.length - 1];
      if (!(last.from === 'buyer' && last.text === q.body)) msgs.push({ from: 'buyer', text: q.body, time: null });
      earlier.appendChild(chatView({ messages: msgs, approximate: q.approximate }));
      bodyEl.classList.add('gl-hidden');
      earlier.firstChild.style.maxHeight = '45vh';
    } else {
      var older = (q.context && q.context.messages) || [];
      older.slice(0, -1).forEach(function (text) {
        var d = document.createElement('div'); d.className = 'q-body q-earlier'; d.textContent = text; earlier.appendChild(d);
      });
    }
    textEl.value = readDraft(q.id);
    sendBtn.disabled = textEl.value.trim() === '';
    answerEl.classList.remove('gl-hidden');
    // Newest message in view; only scrollable once the panel is displayed.
    if (earlier.firstChild) earlier.firstChild.scrollTop = earlier.firstChild.scrollHeight;
  }

  // Called by native (QuestionsViewController) when a notification is tapped.
  window.openQuestion = function (ref) {
    var hit = questions.filter(function (q) {
      return q.context && q.context.listing === ref.listing && q.context.buyer === ref.buyer;
    })[0];
    if (hit) { showAnswer(hit); return; }
    // Not in the list: either it has not loaded yet, or it was already answered.
    if (!fresh) { pendingOpen = ref; return; }
    showList();
  };

  // Called by native each time the page is brought back on screen.
  window.refreshQuestions = function () { load(); };

  // ---- data ----------------------------------------------------------------
  function load() {
    if (!loaded) loadingEl.classList.remove('gl-hidden');
    errorEl.classList.add('gl-hidden');
    return headers().then(function (h) {
      return fetch(apiBase() + '/questions', { headers: h });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      questions = json.questions;
      visits = json.visits;
      offers = json.pending;
      takeovers = json.takeovers;
      localStorage.setItem(CACHE_KEY, JSON.stringify(json));
      loaded = true;
      fresh = true;
      $('q-saved').classList.add('gl-hidden');
      loadingEl.classList.add('gl-hidden');
      if (pendingOpen) { var ref = pendingOpen; pendingOpen = null; window.openQuestion(ref); }
      if (!current) renderList();
      else if (!questions.some(function (q) { return q.id === current.id; })) showList();
      replayOutbox();
    }).catch(function (err) {
      loadingEl.classList.add('gl-hidden');
      if (loaded) $('q-saved').classList.remove('gl-hidden'); // the saved copy is what is on screen
      showError("Couldn't load questions: " + err.message);
    });
  }

  // ---- answering: optimistic, durable (see .claude/rules/offline-writes.md) --
  function readOutbox() { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || '[]'); }
  function writeOutbox(items) { localStorage.setItem(OUTBOX_KEY, JSON.stringify(items)); }

  // Resolves 'ok' | 'network' (server may or may not have seen it: keep queued,
  // the server is idempotent on opId) | throws on a genuine HTTP rejection.
  function post(item) {
    return headers().then(function (h) {
      var body = Object.assign({}, item.answer.payload, { text: item.text, opId: item.opId });
      return fetch(apiBase() + item.answer.endpoint, { method: 'POST', headers: h, body: JSON.stringify(body) });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return 'ok';
    }, function () { return 'network'; });
  }

  function replayOutbox() {
    var items = readOutbox();
    if (items.length === 0) return;
    (function next(i) {
      if (i >= items.length) return;
      post(items[i]).then(function (r) {
        if (r === 'network') return;           // still offline: keep the rest queued
        writeOutbox(readOutbox().filter(function (o) { return o.opId !== items[i].opId; }));
        next(i + 1);
      }, function (err) {
        // Rejected by a reachable server: replaying just gets refused again.
        writeOutbox(readOutbox().filter(function (o) { return o.opId !== items[i].opId; }));
        showError('A queued reply was rejected (' + err.message + ')');
        next(i + 1);
      });
    })(0);
  }

  function send() {
    var text = textEl.value.trim();
    if (!current || !text) return;
    var q = current;
    var item = { opId: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10), questionId: q.id, answer: q.answer, text: text };
    writeOutbox(readOutbox().concat([item]));          // durable before anything is confirmed
    questions = questions.filter(function (x) { return x.id !== q.id; });
    clearDraft(q.id);
    writeReplied(readReplied().concat([{ opId: item.opId, title: q.title, text: text, sentAt: new Date().toISOString() }]));
    showList();
    toast('Sent');
    post(item).then(function (r) {
      if (r === 'ok') writeOutbox(readOutbox().filter(function (o) { return o.opId !== item.opId; }));
    }, function (err) {
      writeOutbox(readOutbox().filter(function (o) { return o.opId !== item.opId; }));
      writeReplied(readReplied().filter(function (r) { return r.opId !== item.opId; }));
      questions = [q].concat(questions);               // revert: the server refused it
      renderList();
      showError("Reply wasn't sent: " + err.message);
    });
  }

  // Swipe actions on a question: send it back to the auto-responder, or discard
  // it. Optimistic, not outbox-queued (like hand-back): they change what the bot
  // does, so a failure puts the question back and says so.
  // contract: POST {path} {listing,buyer} -> {result:'ok'}
  function questionAction(q, path, doneMsg, errPrefix) {
    var body = { listing: q.context.listing, buyer: q.context.buyer };
    var i = questions.indexOf(q);
    questions = questions.filter(function (x) { return x.id !== q.id; });
    clearDraft(q.id);
    openKey = null;
    renderList();
    toast(doneMsg, null, 6000);
    headers().then(function (h) {
      return fetch(apiBase() + path, { method: 'POST', headers: h, body: JSON.stringify(body) });
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
    }).catch(function (err) {
      questions.splice(Math.min(Math.max(i, 0), questions.length), 0, q);
      renderList();
      showError(errPrefix + err.message);
    });
  }

  // Half-typed reply, kept per question so a page reload (a newer page version
  // being swapped in) does not wipe it. Storage can be unavailable: then no draft.
  var DRAFT_PREFIX = 'gl.questions.draft.';
  function readDraft(id) { try { return localStorage.getItem(DRAFT_PREFIX + id) || ''; } catch (e) { return ''; } }
  function clearDraft(id) { try { localStorage.removeItem(DRAFT_PREFIX + id); } catch (e) { /* no storage, no draft */ } }
  textEl.addEventListener('input', function () {
    sendBtn.disabled = textEl.value.trim() === '';
    if (!current) return;
    try {
      if (textEl.value === '') localStorage.removeItem(DRAFT_PREFIX + current.id);
      else localStorage.setItem(DRAFT_PREFIX + current.id, textEl.value);
    } catch (e) { /* no storage, no draft */ }
  });
  sendBtn.addEventListener('click', send);
  $('q-retry').addEventListener('click', load);
  $('q-saved-retry').addEventListener('click', load);
  $('q-undo').addEventListener('click', function () {
    var u = undoAction; undoAction = null;
    $('q-toast').classList.add('gl-hidden');
    if (u) u();
  });
  $('q-back').addEventListener('click', function () {
    if (current) showList();
    else GLBridge.call('goBack', {}).catch(function () {});
  });

  // Paint the saved copy first (minus anything already answered and queued in
  // the outbox), then replace it with the live list.
  var cachedRaw = localStorage.getItem(CACHE_KEY);
  if (cachedRaw !== null) {
    var cached = JSON.parse(cachedRaw);
    var queued = readOutbox().map(function (o) { return o.questionId; });
    questions = cached.questions.filter(function (q) { return queued.indexOf(q.id) === -1; });
    visits = cached.visits;
    offers = cached.pending;
    takeovers = cached.takeovers;
    loaded = true;
    loadingEl.classList.add('gl-hidden');
    $('q-saved').classList.remove('gl-hidden');
    renderList();
  }

  load();
})();
</script>
</body>
</html>
