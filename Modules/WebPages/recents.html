<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recent</title>
<!-- Moved here from location-server/public/recents.html as part of the
     asset-update-mechanism task: this page used to carry its OWN inlined
     copy of the GL bridge client because it lived in a different repo than
     Overland-iOS/Modules/WebPages/gl-bridge.js. Now that all three pages
     (more.html, settings.html, recents.html) live in this one directory and
     ship through GLWebPageCache (see Shared/GLWebPageCache.h), it shares the
     same sibling files everything else does -- one copy, not three. -->
<script src="gl-bridge.js"></script>
<link rel="stylesheet" href="page.css">
<style>
  /* This page's own layout rules are kept exactly as they were when this
     file lived at location-server/public/recents.html, deliberately NOT
     folded into the shared page.css even where a selector name overlaps
     (.gl-card, .gl-empty-state, .gl-error-banner, .gl-btn-plain, .gl-hidden)
     -- this <style> block is later in <head> than page.css's <link>, so on
     an equal-specificity clash the rule below still wins and the page keeps
     rendering pixel-identical to before this move. Folding these into
     page.css (removing the duplication for real) is a follow-up, not part
     of this task's boundary ("do not change how any page looks"). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background-image: var(--gl-bg-image, none);
    background-color: var(--gl-bg);
    color: var(--gl-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .gl-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 10px 16px;
    padding-top: max(14px, env(safe-area-inset-top, 0px));
  }
  .gl-header-title { font-size: 18px; font-weight: 600; flex: 1; text-align: center; margin-right: 32px; }
  .gl-back-btn, .gl-toggle-btn {
    background: none; border: none; color: var(--gl-accent); font-size: 15px; padding: 6px 4px; font-weight: 600;
  }
  /* Filter pills (All / Tweets) -- approved mockup-recent-option-b.html.
     Client-side only: re-renders from the same lastRecordings cache the
     Clean/Raw toggle already uses below, no second fetch. */
  .gl-filter-pills { display: flex; gap: 8px; padding: 0 16px 12px 16px; }
  .gl-filter-pill {
    background: var(--gl-surface); border: none; border-radius: 999px;
    color: var(--gl-text-dim); font-size: 13px; font-weight: 600;
    padding: 6px 14px;
  }
  .gl-filter-pill.gl-active { background: var(--gl-accent); color: #fff; }
  .gl-list { padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px; }
  .gl-card {
    background: var(--gl-surface);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  /* Subtle border on tweet cards in the All view -- mockup's .gl-card.is-tweet. */
  .gl-card.gl-is-tweet { border: 1px solid var(--gl-accent); }
  .gl-kind-glyph { font-size: 16px; line-height: 1.4; }
  .gl-row-body { flex: 1; min-width: 0; }
  .gl-transcript { font-size: 15px; color: var(--gl-text); white-space: pre-wrap; word-break: break-word; }
  .gl-timestamp-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .gl-timestamp { font-size: 12px; color: var(--gl-text-dim); }
  /* Small star-icon + "Tweet" marker next to the timestamp -- mockup's .tweet-mark. */
  .gl-tweet-mark { font-size: 11px; font-weight: 600; color: var(--gl-accent); }
  /* Private-entry lock toggle (sits in the timestamp row) and the locked
     card's placeholder. "On" is the colour 🔒 emoji; "off" is a faint
     monochrome outline (an emoji ignores `color`, so a 🔓 on every card read
     as if every entry were locked). */
  .gl-lock-btn {
    background: none; border: none; padding: 2px 4px; margin-left: auto;
    font-size: 14px; line-height: 1; color: var(--gl-text-dim);
  }
  .gl-lock-btn:not(.gl-on) { opacity: 0.35; }
  .gl-lock-btn svg { display: block; width: 12px; height: 12px; }
  .gl-card.gl-locked .gl-transcript { color: var(--gl-text-dim); font-style: italic; }
  .gl-edited-mark { font-size: 11px; color: var(--gl-text-dim); }
  .gl-transcript.gl-editable { cursor: text; }
  .gl-edit-box { width: 100%; }
  .gl-edit-area {
    display: block; width: 100%; resize: none; overflow: hidden; font: inherit; font-size: 15px;
    color: var(--gl-text); background: var(--gl-bg); border: 1px solid var(--gl-accent);
    border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word;
  }
  .gl-edit-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
  .gl-lock-msg { font-size: 12px; color: var(--gl-danger); margin-top: 4px; }
  .gl-empty-state, .gl-loading-state { padding: 48px 24px; text-align: center; color: var(--gl-text-dim); font-size: 15px; }
  .gl-error-banner {
    margin: 0 16px 16px 16px; padding: 12px 14px; border-radius: 12px;
    background: rgba(255, 59, 48, 0.14); color: var(--gl-danger); font-size: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .gl-btn-plain { background: none; border: none; color: var(--gl-accent); font-size: 14px; font-weight: 600; padding: 4px 6px; }
  .gl-hidden { display: none !important; }
</style>
</head>
<body>
<div class="gl-header">
  <button id="gl-back-btn" class="gl-back-btn" type="button">Back</button>
  <span class="gl-header-title">Recent</span>
  <button id="gl-toggle-btn" class="gl-toggle-btn" type="button">Clean</button>
</div>

<div id="gl-filter-pills" class="gl-filter-pills gl-hidden">
  <button id="gl-filter-all-btn" class="gl-filter-pill gl-active" type="button">All</button>
  <button id="gl-filter-tweets-btn" class="gl-filter-pill" type="button">Tweets</button>
</div>

<div id="gl-loading" class="gl-loading-state">Loading…</div>
<div id="gl-error" class="gl-error-banner gl-hidden">
  <span id="gl-error-text"></span>
  <button id="gl-retry-btn" class="gl-btn-plain" type="button">Retry</button>
</div>
<div id="gl-saved" class="gl-saved-mark gl-hidden">
  <span>Saved copy</span>
  <button id="gl-saved-retry" class="gl-btn-plain" type="button">Retry</button>
</div>
<div id="gl-empty" class="gl-empty-state gl-hidden">No recordings yet.</div>
<div id="gl-list" class="gl-list gl-hidden"></div>

<script>
(function () {
  'use strict';

  var backBtn = document.getElementById('gl-back-btn');
  var toggleBtn = document.getElementById('gl-toggle-btn');
  var loadingEl = document.getElementById('gl-loading');
  var errorEl = document.getElementById('gl-error');
  var errorTextEl = document.getElementById('gl-error-text');
  var emptyEl = document.getElementById('gl-empty');
  var listEl = document.getElementById('gl-list');
  var retryBtn = document.getElementById('gl-retry-btn');
  var filterPillsEl = document.getElementById('gl-filter-pills');
  var filterAllBtn = document.getElementById('gl-filter-all-btn');
  var filterTweetsBtn = document.getElementById('gl-filter-tweets-btn');

  var savedEl = document.getElementById('gl-saved');
  var CACHE_KEY = 'gl.recents.cache'; // per-page key: file:// pages share one localStorage

  var QUEUE_KEY = 'gl.recents.privateQueue'; // pending private-flag writes, oldest first -- survives reload/relaunch

  // Private journal entries: hidden until Face ID succeeds. `unlocked` lives
  // only in memory for this page view, so a reload or relaunch re-locks, and
  // visibilitychange (below) re-locks when the page is backgrounded.
  var unlocked = false;
  // Outline open padlock for the "not private" toggle state (static markup, no server data).
  var UNLOCKED_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">'
    + '<rect x="3" y="7.5" width="10" height="7" rx="1.5"/><path d="M5.5 7.5V5a2.5 2.5 0 0 1 4.9-.7"/></svg>';
  var unlockMsgFilename = null; // card showing "Update Overland to unlock"
  var authPending = false;
  var replaying = false;
  var replayAgain = false;
  var editingFilename = null; // card whose transcript is open in a textarea; list re-renders are skipped meanwhile

  var showCleaned = true;
  var showTweetsOnly = false; // All/Tweets pill filter -- mockup-recent-option-b.html
  var lastRecordings = null; // last successfully-fetched list, for a toggle-only re-render (matches native: transcriptToggleTapped just reloads, no re-fetch)
  var displayDateFormatter = new Intl.DateTimeFormat(undefined, {
    dateStyle: 'medium', timeStyle: 'short'
  });

  // GL_BOOT.apiBase (added by GLWebModuleViewController's bootScriptSource
  // for every managed page, see Shared/GLWebModuleViewController.m) is the
  // location-server origin, e.g. "http://100.x.x.x:8302" -- needed ONLY now
  // that this page can be loaded from a bundle/cache copy via file://, where
  // a bare "/journal/recordings" would resolve against the file:// origin
  // and 404/fail instead of reaching the real server. When this page is
  // loaded directly FROM location-server (still true for headless testing
  // and location-server's own test suite -- see server.mjs's static route),
  // GL_BOOT is either absent or carries no apiBase, and the empty-string
  // fallback reproduces the exact same relative-URL behavior this page
  // always had.
  function apiBase() {
    var boot = window.GL_BOOT;
    return (boot && typeof boot.apiBase === 'string') ? boot.apiBase : '';
  }

  function transcriptTextFor(recording) {
    // Cached copies of private entries are saved without their text (see
    // writeCache()); only reachable offline after un-privating from a cold cache.
    if (recording.textOmitted) return '(text not saved offline)';
    var transcript = recording.transcript;
    if (transcript == null || typeof transcript !== 'string') return 'Transcribing…';
    var edited = showCleaned ? editedTextFor(recording) : null;
    if (edited !== null) return edited;
    if (transcript.length === 0) return '(no words recognized)';
    if (!showCleaned) return transcript;
    var clean = recording.transcriptClean;
    return (typeof clean === 'string') ? clean : transcript;
  }

  // Hand-corrected text: the newest queued (unconfirmed) edit wins over the
  // server's transcriptEdited, so the correction shows at once and survives a
  // refetch racing the write. null = never edited.
  function editedTextFor(recording) {
    var value = typeof recording.transcriptEdited === 'string' ? recording.transcriptEdited : null;
    readQueue().forEach(function (op) {
      if (op.kind === 'edit' && op.filename === recording.filename) value = op.text; // oldest first, newest wins
    });
    return value;
  }

  // What the textarea starts with: the shown body, but '' for an empty
  // transcript rather than the "(no words recognized)" placeholder.
  function editableTextFor(recording) {
    var edited = editedTextFor(recording);
    if (edited !== null) return edited;
    var clean = recording.transcriptClean;
    return (typeof clean === 'string') ? clean : recording.transcript;
  }

  function timestampTextFor(recording) {
    var savedAt = recording.savedAt;
    if (typeof savedAt !== 'string') return '';
    var date = new Date(savedAt);
    if (isNaN(date.getTime())) return savedAt;
    return displayDateFormatter.format(date);
  }

  // ---- Pending private-flag ops -------------------------------------------
  // The queue is the source of truth for "what did the user ask for that the
  // server has not confirmed yet". It is APPLIED OVER every list we hold
  // (cached or freshly fetched), so a refetch racing an in-flight write can
  // never flip the card back, and a refused write is reverted just by
  // dropping its op.
  function readQueue() {
    var raw = localStorage.getItem(QUEUE_KEY);
    return raw === null ? [] : JSON.parse(raw);
  }

  function writeQueue(queue) {
    localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
  }

  function isPrivate(recording) {
    var value = recording.isPrivate === true;
    readQueue().forEach(function (op) {
      if (op.kind !== 'edit' && op.filename === recording.filename) value = op.private; // oldest first, so the newest op wins
    });
    return value;
  }

  // The list as saved to localStorage: raw server flags, but a private entry
  // (by server flag OR pending op) keeps NO text, so a device cache never
  // holds a private transcript in plaintext.
  function writeCache() {
    var recordings = lastRecordings.map(function (r) {
      if (!isPrivate(r) && r.isPrivate !== true) return r;
      var copy = Object.assign({}, r, { textOmitted: true });
      delete copy.transcript;
      delete copy.transcriptClean;
      delete copy.transcriptEdited;
      return copy;
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify({ recordings: recordings }));
  }

  // Recordings currently on screen, after the All/Tweets pill filter. Kept as
  // a function (not a cached array) so it always reflects the latest
  // lastRecordings/showTweetsOnly pair -- called from both showResults (fresh
  // fetch) and the pill/toggle click handlers (re-render only).
  function filteredRecordings() {
    if (!lastRecordings) return [];
    if (!showTweetsOnly) return lastRecordings;
    return lastRecordings.filter(function (r) { return r.isTweet === true; });
  }

  function autosize(area) {
    area.style.height = 'auto';
    area.style.height = area.scrollHeight + 'px';
  }

  function render(recordings) {
    listEl.innerHTML = '';
    recordings.forEach(function (recording, index) {
      var card = document.createElement('div');
      card.className = 'gl-card' + (recording.isTweet ? ' gl-is-tweet' : '');
      card.dataset.index = String(index);

      var glyph = document.createElement('span');
      glyph.className = 'gl-kind-glyph';
      // Text content only -- never innerHTML -- so a malicious `kind` value
      // can't do anything worse than fail this equality check.
      glyph.textContent = recording.kind === 'voice' ? '\u{1F3A4}' : '\u{1F4DD}';

      var body = document.createElement('div');
      body.className = 'gl-row-body';

      var locked = isPrivate(recording) && !unlocked;
      card.dataset.filename = recording.filename;
      if (locked) card.classList.add('gl-locked');

      var transcriptEl = document.createElement('div');
      transcriptEl.className = 'gl-transcript';
      // A locked card never receives the transcript at all (not hidden by CSS),
      // so there is no text in the DOM to read, select or find.
      transcriptEl.textContent = locked ? '\u{1F512} Private entry' : transcriptTextFor(recording); // textContent: server strings are never trusted as markup

      var timestampRow = document.createElement('div');
      timestampRow.className = 'gl-timestamp-row';

      var timestampEl = document.createElement('span');
      timestampEl.className = 'gl-timestamp';
      timestampEl.textContent = timestampTextFor(recording);
      timestampRow.appendChild(timestampEl);

      if (!locked && showCleaned && editedTextFor(recording) !== null) {
        var editedMark = document.createElement('span');
        editedMark.className = 'gl-edited-mark';
        editedMark.textContent = 'edited';
        timestampRow.appendChild(editedMark);
      }

      // Small marker next to the timestamp, shown in the All view too (per
      // mockup-recent-option-b.html's .tweet-mark) so a tweet card is
      // identifiable without switching to the Tweets filter.
      if (recording.isTweet) {
        var markEl = document.createElement('span');
        markEl.className = 'gl-tweet-mark';
        markEl.textContent = '★ Tweet';
        timestampRow.appendChild(markEl);
      }

      var lockBtn = document.createElement('button');
      lockBtn.type = 'button';
      lockBtn.className = 'gl-lock-btn' + (isPrivate(recording) ? ' gl-on' : '');
      if (isPrivate(recording)) lockBtn.textContent = '\u{1F512}';
      else lockBtn.innerHTML = UNLOCKED_ICON;
      lockBtn.setAttribute('aria-pressed', isPrivate(recording) ? 'true' : 'false');
      lockBtn.setAttribute('aria-label', isPrivate(recording) ? 'Make not private' : 'Mark private');
      timestampRow.appendChild(lockBtn);

      var editable = !locked && showCleaned && typeof recording.transcript === 'string' && !recording.textOmitted;
      if (editable) transcriptEl.classList.add('gl-editable');
      if (editable && editingFilename === recording.filename) {
        var box = document.createElement('div');
        box.className = 'gl-edit-box';
        var area = document.createElement('textarea');
        area.className = 'gl-edit-area';
        area.value = editableTextFor(recording);
        area.addEventListener('input', function () { autosize(area); });
        var actions = document.createElement('div');
        actions.className = 'gl-edit-actions';
        ['Cancel', 'Save'].forEach(function (label) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'gl-btn-plain gl-edit-' + label.toLowerCase();
          btn.textContent = label;
          actions.appendChild(btn);
        });
        box.appendChild(area);
        box.appendChild(actions);
        body.appendChild(box);
      } else {
        body.appendChild(transcriptEl);
      }
      body.appendChild(timestampRow);
      if (locked && unlockMsgFilename === recording.filename) {
        var msgEl = document.createElement('div');
        msgEl.className = 'gl-lock-msg';
        msgEl.textContent = 'Update Overland to unlock';
        body.appendChild(msgEl);
      }
      card.appendChild(glyph);
      card.appendChild(body);
      listEl.appendChild(card);
    });
    var openArea = listEl.querySelector('.gl-edit-area');
    if (openArea) { autosize(openArea); openArea.focus(); }
  }

  function showLoading() {
    loadingEl.classList.remove('gl-hidden');
    errorEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
    listEl.classList.add('gl-hidden');
    filterPillsEl.classList.add('gl-hidden');
  }

  function showError(message) {
    loadingEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
    listEl.classList.add('gl-hidden');
    filterPillsEl.classList.add('gl-hidden');
    errorTextEl.textContent = "Couldn't load recordings: " + message;
    errorEl.classList.remove('gl-hidden');
  }

  // Re-renders from lastRecordings/showTweetsOnly without a fetch -- the
  // shared tail for a fresh fetch (showResults), the Tweets/All pill click,
  // and the Clean/Raw toggle click, all of which change what's ON SCREEN but
  // never the underlying data.
  function renderFiltered(force) {
    if (editingFilename && !force) return; // never destroy an in-progress edit; closing the editor re-renders
    var recordings = filteredRecordings();
    if (recordings.length === 0) {
      // Distinct copy for an empty Tweets filter vs. a genuinely empty
      // account -- "No tweets yet." would be misleading/wrong if shown for
      // an account with zero recordings at all.
      emptyEl.textContent = showTweetsOnly ? 'No tweets yet.' : 'No recordings yet.';
      emptyEl.classList.remove('gl-hidden');
      listEl.classList.add('gl-hidden');
      // Clear stale cards from a PREVIOUS render (e.g. switching from All,
      // which had cards, to a Tweets filter with none) -- gl-hidden only
      // hides the container visually, it doesn't empty it, and leftover
      // .gl-card nodes sitting inert in the DOM is exactly the kind of stale
      // state this filter must not leak.
      listEl.innerHTML = '';
    } else {
      emptyEl.classList.add('gl-hidden');
      listEl.classList.remove('gl-hidden');
      render(recordings);
    }
  }

  function updateFilterPills() {
    filterAllBtn.classList.toggle('gl-active', !showTweetsOnly);
    filterTweetsBtn.classList.toggle('gl-active', showTweetsOnly);
  }

  function showResults(recordings) {
    lastRecordings = recordings;
    loadingEl.classList.add('gl-hidden');
    errorEl.classList.add('gl-hidden');
    // Pills only make sense once there's a fetched list to filter -- hidden
    // during loading/error, same lifecycle as gl-list/gl-empty.
    filterPillsEl.classList.remove('gl-hidden');
    renderFiltered();
  }

  // Last successful list, painted first on the next load (and kept on screen
  // when a later fetch fails) so the page is never blank offline.
  function readCache() {
    var raw = localStorage.getItem(CACHE_KEY);
    return raw === null ? null : JSON.parse(raw).recordings;
  }

  function fetchRecordings() {
    if (!lastRecordings) showLoading();
    GLBridge.call('getApiToken', {}).then(function (tokenRes) {
      var token = tokenRes && tokenRes.token;
      return fetch(apiBase() + '/journal/recordings?limit=20', {
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      });
    }).then(function (res) {
      if (!res.ok) {
        return Promise.reject(new Error('HTTP ' + res.status));
      }
      return res.json().catch(function () {
        return Promise.reject(new Error('malformed response'));
      });
    }).then(function (json) {
      var recordings = Array.isArray(json.recordings) ? json.recordings : [];
      lastRecordings = recordings;
      writeCache();
      savedEl.classList.add('gl-hidden');
      showResults(recordings);
      replayQueue(); // anything still queued from an earlier offline toggle
    }).catch(function (err) {
      var message = (err && err.message) || 'unknown error';
      if (lastRecordings) {
        // A list is already on screen (the cached copy). A TypeError is
        // fetch's network failure: keep it as a saved copy, no alarm. A real
        // answer (HTTP error, bad JSON) still shows the banner, with the
        // list left visible underneath.
        savedEl.classList.remove('gl-hidden');
        if (!(err instanceof TypeError)) {
          errorTextEl.textContent = "Couldn't load recordings: " + message;
          errorEl.classList.remove('gl-hidden');
        }
        return;
      }
      showError(message);
    });
  }

  function updateToggleLabel() {
    toggleBtn.textContent = showCleaned ? 'Clean' : 'Raw';
    toggleBtn.setAttribute('aria-label', showCleaned ? 'Showing cleaned transcripts' : 'Showing raw transcripts');
  }

  backBtn.addEventListener('click', function () {
    GLBridge.call('goBack', {}).catch(function () {});
  });

  toggleBtn.addEventListener('click', function () {
    showCleaned = !showCleaned;
    updateToggleLabel();
    GLBridge.call('setPref', { key: 'cleanTranscripts', value: showCleaned }).catch(function () {});
    // Re-render from the last fetch rather than re-fetching -- toggling
    // Clean/Raw is a display concern, the underlying data hasn't changed
    // (matches native's transcriptToggleTapped, which just reloads the table).
    if (lastRecordings) renderFiltered();
  });

  // All/Tweets pill filter: same "re-render from lastRecordings, don't
  // re-fetch" pattern as Clean/Raw above. Deliberately NOT persisted via
  // GLBridge setPref/getPref like Clean/Raw is -- there's no spec requirement
  // for the filter choice to survive a re-open, and defaulting back to All
  // each time the page opens is the simpler, safer behavior (a stale Tweets
  // filter silently hiding new voice/text entries would be a worse surprise
  // than having to tap the pill again).
  filterAllBtn.addEventListener('click', function () {
    if (!showTweetsOnly) return;
    showTweetsOnly = false;
    updateFilterPills();
    if (lastRecordings) renderFiltered();
  });

  filterTweetsBtn.addEventListener('click', function () {
    if (showTweetsOnly) return;
    showTweetsOnly = true;
    updateFilterPills();
    if (lastRecordings) renderFiltered();
  });

  // ---- Private toggle: optimistic + offline-durable -------------------------
  // Same shape as todo-sorter (see .claude/rules/offline-writes.md): paint
  // first, make the write durable BEFORE the request (queue write precedes
  // the fetch, removed on 2xx), network failure keeps it queued for replay,
  // an HTTP refusal reverts. The server is idempotent on opId.
  function newOpId() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function setPrivate(recording, value) {
    var queue = readQueue();
    queue.push({ opId: newOpId(), filename: recording.filename, private: value });
    writeQueue(queue);
    writeCache();
    renderFiltered();
    replayQueue();
  }

  function saveEdit(recording, text) {
    var queue = readQueue();
    queue.push({ opId: newOpId(), kind: 'edit', filename: recording.filename, text: text });
    writeQueue(queue);
    writeCache();
    editingFilename = null;
    renderFiltered();
    replayQueue();
  }

  function closeEditor() {
    editingFilename = null;
    if (lastRecordings) renderFiltered();
  }

  // Sends one op. Returns 'ok' | 'rejected' | 'network'. 'network' covers
  // every failure with no HTTP answer (fetch TypeError, abort/timeout, bridge
  // token failure): we cannot know the server missed it, so it stays queued.
  function sendOp(op) {
    return GLBridge.call('getApiToken', {}).then(function (tokenRes) {
      var token = tokenRes && tokenRes.token;
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 15000);
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      var isEdit = op.kind === 'edit';
      return fetch(apiBase() + (isEdit ? '/journal/recordings/transcript' : '/journal/recordings/private'), {
        method: 'POST', headers: headers, signal: controller.signal,
        body: JSON.stringify(isEdit
          ? { opId: op.opId, filename: op.filename, text: op.text }
          : { opId: op.opId, filename: op.filename, private: op.private })
      }).then(function (res) { clearTimeout(timer); return res.ok ? 'ok' : 'rejected'; },
              function (err) { clearTimeout(timer); throw err; });
    }).catch(function () { return 'network'; });
  }

  // Drains the queue oldest-first, one op at a time. Re-entrancy: a call
  // while a drain is running just flags another pass, so an op queued
  // mid-drain is never stranded.
  function replayQueue() {
    if (replaying) { replayAgain = true; return; }
    replaying = true;
    function next() {
      var queue = readQueue();
      if (queue.length === 0) {
        if (replayAgain) { replayAgain = false; return next(); }
        replaying = false;
        return;
      }
      var op = queue[0];
      sendOp(op).then(function (outcome) {
        if (outcome === 'network') { replaying = false; replayAgain = false; return; } // keep queued; retry on next load / online
        writeQueue(readQueue().filter(function (q) { return q.opId !== op.opId; }));
        if (lastRecordings) {
          if (outcome === 'ok') {
            lastRecordings.forEach(function (r) {
              if (r.filename !== op.filename) return;
              if (op.kind === 'edit') r.transcriptEdited = op.text;
              else r.isPrivate = op.private;
            });
          } else {
            // Genuine refusal: dropping the op IS the revert (the overlay
            // falls back to the server value).
            errorTextEl.textContent = op.kind === 'edit' ? "Couldn't save edit." : "Couldn't update private entry.";
            errorEl.classList.remove('gl-hidden');
          }
          writeCache();
          renderFiltered();
        }
        next();
      });
    }
    next();
  }

  // Face ID gate. Only an explicit {ok: true} reveals anything; every error
  // (cancel, failure, old app build without the method) leaves cards locked.
  function unlock(filename) {
    if (authPending) return;
    authPending = true;
    unlockMsgFilename = null;
    GLBridge.call('authenticate', { reason: 'Unlock private journal entries' }, { timeoutMs: 60000 }).then(function (res) {
      if (res && res.ok === true) {
        unlocked = true;
      }
    }, function (err) {
      if (err && /unknown method/.test(err.message)) unlockMsgFilename = filename; // cancel/failed: stay locked silently
    }).then(function () {
      authPending = false;
      if (lastRecordings) renderFiltered();
    });
  }

  // One delegated listener: a tap on a locked card (anywhere, including its
  // lock button, since an unauthenticated user must not be able to un-private
  // it) starts the unlock; otherwise the lock button toggles the flag.
  listEl.addEventListener('click', function (event) {
    var card = event.target.closest('.gl-card');
    if (!card || !lastRecordings) return;
    var recording = lastRecordings.filter(function (r) { return r.filename === card.dataset.filename; })[0];
    if (!recording) return;
    if (isPrivate(recording) && !unlocked) { unlock(recording.filename); return; }
    if (event.target.closest('.gl-edit-cancel')) { closeEditor(); return; }
    if (event.target.closest('.gl-edit-save')) {
      var text = card.querySelector('.gl-edit-area').value.trim();
      var current = editableTextFor(recording);
      if (text === '' || text === (current || '').trim()) closeEditor();
      else saveEdit(recording, text);
      return;
    }
    if (!event.target.closest('.gl-lock-btn') && event.target.closest('.gl-transcript.gl-editable') && !editingFilename) {
      editingFilename = recording.filename;
      renderFiltered(true);
      return;
    }
    if (event.target.closest('.gl-lock-btn')) setPrivate(recording, !isPrivate(recording));
  });

  // Backgrounding re-locks, so a private entry never stays readable on a
  // phone that was unlocked, put down, and picked up later.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'hidden') return;
    unlocked = false;
    unlockMsgFilename = null;
    editingFilename = null; // an open editor may hold a private entry's text
    if (lastRecordings) renderFiltered();
  });

  window.addEventListener('online', replayQueue);

  retryBtn.addEventListener('click', fetchRecordings);
  document.getElementById('gl-saved-retry').addEventListener('click', fetchRecordings);

  // Paint the saved copy before any bridge round trip or fetch.
  var cached = readCache();
  if (cached) {
    savedEl.classList.remove('gl-hidden');
    showResults(cached);
  }
  replayQueue(); // private-flag writes left over from a previous (offline) page view

  GLBridge.call('getPref', { key: 'cleanTranscripts' }).then(function (res) {
    showCleaned = (res && typeof res.value === 'boolean') ? res.value : true;
    updateToggleLabel();
    if (lastRecordings) renderFiltered();
    fetchRecordings();
  }, function () {
    updateToggleLabel();
    fetchRecordings();
  });
})();
</script>
</body>
</html>
