    }
    if (idx === -1) return;
    var entry = attachments[idx];
    if (entry.objectUrl) { try { URL.revokeObjectURL(entry.objectUrl); } catch (e) { /* ignore */ } }
    attachments.splice(idx, 1);
    if (!entry.id) idbLoud(idbDelete(localId));
    renderAttachments();
    updateStartEnabled();
    saveDraft();
  }

  /**
   * Best-effort fetches an already-uploaded attachment's bytes as a thumbnail
   * preview -- GET /sessions/upload/<id> needs the Authorization header, so
   * this can't just be an <img src="..."> (no way to attach a header to an
   * image-tag fetch); fetch -> blob -> objectURL is the standard workaround.
   * Falls back to the placeholder icon (renderAttachments' objectUrl-null
   * branch) on any failure -- a thumbnail that never loads is cosmetic, the
   * entry's id/status are untouched either way and it still counts toward
   * Start normally.
   */
  function fetchThumbnail(entry) {
    authedFetch('/sessions/upload/' + encodeURIComponent(entry.id)).then(function (res) {
      if (!res.ok) return Promise.reject(new Error('HTTP ' + res.status));
      return res.blob();
    }).then(function (blob) {
      // entry may since have been removeAttachment()'d -- harmless either
      // way, same reasoning as uploadAttachment's late-finish comment above:
      // renderAttachments() only ever paints the CURRENT attachments array.
      try { entry.objectUrl = URL.createObjectURL(blob); } catch (e) { /* stays a placeholder */ }
      renderAttachments();
    }).catch(function () { /* stays a placeholder -- see header comment */ });
  }

  /** Adds an id the server already has as a `done` attachment (never re-uploads), then best-effort fetches its thumbnail. Shared by draft restore and window.addAttachments below. */
  function addServerAttachment(id) {
    // Load-bearing: the draft restore runs only once /sessions/projects
    // answers, and on a share-sheet cold launch native's addAttachments runs
    // first and saves this id into the draft -- so the restore re-adds it.
    // The dedupe lives here so both callers get it, whatever the order.
    var existing = attachments.find(function (a) { return a.id === id; });
    if (existing) return existing;
    var entry = { localId: 'server-' + id, id: id, status: 'done', fileName: null, objectUrl: null, file: null };
    attachments.push(entry);
    renderAttachments();
    fetchThumbnail(entry);
    return entry;
  }

  /** Draft restore: each id is shown as an already-`done` attachment (see addServerAttachment). */
  function restoreAttachments(ids) {
    ids.forEach(addServerAttachment);
  }

  // `<uuid>.<ext>` for exactly the extensions the server ever actually
  // issues (saveUpload's sniffImageType never emits "jpeg", only "jpg" --
  // see lib/sessions.mjs) -- matches server.mjs's UPLOAD_ID_RE except that
  // it also accepts "jpeg" for validating ids that came from elsewhere; this
  // is strictly the set of ids a real /sessions/upload response can contain.
  var ATTACH_ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|gif|webp)$/i;

  // Called by native (GLWebModuleViewController's -callWebFunctionIfDefined:,
  // same typeof-guard convention as startVoiceMode/focusTextMode above) AFTER
  // the mode function, on a cold or warm launch from
  // overland://session/text?attach=<id1>,<id2> -- the share extension has
  // already uploaded these via POST /sessions/upload before opening this
  // URL, so this just wires the already-issued ids into the page the same
  // way a draft restore does. Invalid ids are dropped silently (never sent
  // on to the server, which would 400 the whole Start on one bad one); the
  // 5-cap and its "N skipped" message are shared with the manual picker.
  window.addAttachments = function (ids) {
    if (!Array.isArray(ids)) return;
    // Dedupe against ids ALREADY present (any status -- an id the page
    // already knows about in any form counts) -- native can call this again
    // after a page reload from the same deep link (e.g. the WKWebView
    // relaunches mid-flow), and a draft restore may already have re-added
    // these same ids before native's call runs. Without this, the exact
    // same screenshot shows up as two separate thumbnails and gets sent to
    // /sessions/start twice in the same `attachments` array.
    var existingIds = attachments.map(function (a) { return a.id; });
    var valid = ids.filter(function (id) {
      return typeof id === 'string' && ATTACH_ID_RE.test(id) && existingIds.indexOf(id) === -1;
    });
    var room = MAX_ATTACHMENTS - attachments.length;
    var toAdd = valid.slice(0, Math.max(room, 0));
    toAdd.forEach(addServerAttachment);
    if (valid.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (valid.length - toAdd.length) + ' skipped.');
    }

    saveDraft();
  };

  attachBtn.addEventListener('click', function () { attachInput.click(); });

  attachInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(attachInput.files || []);
    attachInput.value = ''; // clears the input so picking the SAME file again still fires 'change'
    var room = MAX_ATTACHMENTS - attachments.length;
    var toAdd = files.slice(0, Math.max(room, 0));
    // Each pick is independent -- two copies of the same photo become two
    // separate attachments with their own upload/id, and removing one never
    // touches the other (they don't share any state beyond the File object
    // each holds its own reference to).
    toAdd.forEach(addAttachment);
    if (files.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (files.length - toAdd.length) + ' skipped.');
    }
  });

  // --- start session -------------------------------------------------------

  // Optimistic commit (see MODULES.md's "web-backed tabs are optimistic"
  // contract): the tap itself is treated as the event that starts the
  // session, not the server's response. The form clears and the
  // confirmation shows BEFORE the network round-trip resolves, so Oliver can
  // queue up a second Start immediately instead of watching a disabled
  // button say "Starting…" -- the exact wait this task exists to remove.
  // `starting` no longer gates the button (removed from updateStartEnabled
  // below); the button re-disables itself naturally once hasStartableContent()
  // goes false from the optimistic clear, and re-enables the instant new
  // content is typed.
  var startAwaitingWrites = false;
  function startSession() {

    var autoSkill = projectSource !== 'manual';
    var writes = pending.map(function (id) { return storedWrites[id]; }).filter(Boolean);
    if (!writes.length) { startSessionWith(project, text, ids, true, pending, autoSkill); return; }

      startSessionWith(project, text, ids, true, pending, autoSkill);
    }, function (err) {

      showError("Couldn't keep the screenshot on this device, so nothing was started: " + err.message);
    });
  }

  // clearComposer=false is the voice auto-send path: the composer was already
  // emptied at stop and may hold a NEW draft by now, which must survive.
  // autoSkill=true asks the box to double-check the skill (from the text, else the screenshot) because it was not picked by hand.
  function startSessionWith(project, promptText, attachmentIds, clearComposer, pendingIds, autoSkill) {
    pendingIds = pendingIds || [];
    // project === null means nothing chosen yet -- '' (None) is a real,
    // startable choice (see updateStartEnabled's comment on this contract).
    if (project === null || (!promptText && !attachmentIds.length && !pendingIds.length)) return;

    // Every attempt owns its own idempotency key and carries it in the
    // persisted queue entry, so a replay after a reload re-sends the SAME key
    // (the server dedupes on it) instead of spawning a second session.
    var key = randomIdempotencyKey();

    // write fails nothing is cleared.

    setConfirmation('Starting', autoSkill ? 'Starting — checking which skill fits…' : 'Starting' + (project ? ' in ' + project : '') + '…');

    // the prompt and attachments from it (see onStartRejected).
    if (clearComposer) {

      updateStartEnabled();

  // --- offline queues: Start and Reply are saved first, replayed until the
  // box answers. Policy: a network failure keeps the entry and retries
  // automatically (load, 'online', coming back to the page, a timer); an HTTP
  // 4xx/5xx is a real answer, the entry is dropped and the user is told.

  var PENDING_STARTS_KEY = 'gl-session-pending-starts-v1';

    }

    queue.push(item);

  }

  }

  function scheduleQueueRetry() {
    if (queueTimer) return;
    queueTimer = setTimeout(function () { queueTimer = null; flushQueues(); }, QUEUE_RETRY_MS);
  }
  function flushQueues() {
    retryPendingAttachments();
    flushStarts();
    flushReplies();
  }

  function postJson(path, body) {
    return authedFetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        return { ok: res.ok, status: res.status, json: json };
      });
    });
  }

  var flushingStarts = false;

  // Uploads a queued Start's not-yet-uploaded screenshots (blobs from
  // IndexedDB), recording each server id in the saved entry so a retry never
  // re-uploads it. Resolves {ok:true} or {ok:false, status, json} for a 4xx
  // on upload; rejects on a network failure.
  function uploadQueuedAttachments(entry) {
    return (entry.pending || []).reduce(function (chain, item) {
      return chain.then(function (state) {
        if (!state.ok || item.id) return state;
        return idbGet(item.localId).then(function (file) {
          if (!file) return { ok: false, status: 0, json: { error: 'a screenshot is missing from device storage' } };
          return uploadFile(file);
        }).then(function (result) {
          if (!result.ok || !result.json || !result.json.id) return { ok: false, status: result.status, json: result.json };
          item.id = result.json.id;
          var queue = readQueue(PENDING_STARTS_KEY);
          queue.forEach(function (q) { if (q.key === entry.key) q.pending = entry.pending; });
          writeQueue(PENDING_STARTS_KEY, queue);
          return state;
        });
      });
    }, Promise.resolve({ ok: true }));
  }

  function flushStarts() {
    if (flushingStarts) return;
    var entry = readQueue(PENDING_STARTS_KEY)[0];
    if (!entry) return;
    flushingStarts = true;
    uploadQueuedAttachments(entry).then(function (up) {
      if (!up.ok) return up;
      entry.body.attachments = (entry.body.attachments || []).concat((entry.pending || []).map(function (p) { return p.id; }));
      return postJson('/sessions/start', entry.body);
    }).then(function (result) {
      dequeue(PENDING_STARTS_KEY, entry.key);
      flushingStarts = false;
      clearError('start-queue');
      (entry.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
      if (result.ok) onStartSucceeded(result.json);
      else onStartRejected(entry, result);
      flushStarts();
    }, function (err) {
      // Network-level failure: the entry stays saved and is retried.
      flushingStarts = false;
      showError('Box unreachable: ' + err.message + '. Your request is saved and starts automatically when the box is back.', 'start-queue');
      scheduleQueueRetry();
    });
  }

  function onStartSucceeded(json) {
    var how = json.skillSource === 'text' ? 'Skill picked from what you said'
      : json.skillSource === 'screenshot' ? 'Skill picked from the screenshot' : '';
    setConfirmation('Started · ' + (json.project ? '/' + json.project : 'no skill'),
      (how ? how + '\n' : '') + json.name + ' (' + json.id + ')', true);
    confirmationEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    resetSuggestState();
    loadRecent();
  }

  // The box answered and refused: never retried (it would just refuse
  // again). Give back exactly what was typed, merged with anything typed
  // since, and say why.
  function onStartRejected(entry, result) {
    var msg = (result.json && result.json.error) || ('HTTP ' + result.status);
    confirmationEl.classList.add('gl-hidden');
    var typedSince = promptEl.value.trim();
    promptEl.value = [entry.body.prompt, typedSince].filter(Boolean).join('\n\n');
    (entry.body.attachments || []).forEach(addServerAttachment);
    saveDraft();
    showError("Couldn't start the session: " + msg);
    updateStartEnabled();
  }

  var flushingReplies = false;
  function flushReplies() {
    if (flushingReplies) return;
    var item = readQueue(PENDING_REPLIES_KEY)[0];
    if (!item) return;
    flushingReplies = true;
    postJson('/sessions/' + encodeURIComponent(item.sessionId) + '/reply', { text: item.text, idempotencyKey: item.key, model: item.model || undefined }).then(function (result) {
      dequeue(PENDING_REPLIES_KEY, item.key);
      flushingReplies = false;
      var d = detail && detail.sessionId === item.sessionId ? detail : null;
      var entry = d && d.local.find(function (l) { return l.key === item.key; });
      if (!result.ok) {
        if (entry) entry.status = 'failed';
        showError("Couldn't send the reply: " + ((result.json && result.json.error) || ('HTTP ' + result.status)), 'reply');
        if (d) renderDetail(true);
      } else {
        try { localStorage.removeItem(REPLY_DRAFT_PREFIX + item.sessionId); } catch (e) { /* ignore */ }
        if (entry) entry.status = 'sent';
        if (d) {
          d.pendingWorking = d.fetchSeq + 1;
          d.info = Object.assign({}, d.info, { state: 'working' });
          clearError('reply');
          renderDetail(true);
          fetchTranscript();
        }
      }
      flushReplies();
    }, function () {
      // Network-level failure: the bubble stays pending, the entry stays saved.
      flushingReplies = false;
      scheduleQueueRetry();
    });
  }

  window.addEventListener('online', flushQueues);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { flushQueues(); pollVoice(); }
  });

  startBtn.addEventListener('click', startSession);

  // --- recent sessions -----------------------------------------------------

  var stateDisplayFormatter = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });

  function renderRecent(sessions) {
    recentListEl.innerHTML = '';
    if (!sessions.length) {
      recentListEl.classList.add('gl-hidden');
      recentEmptyEl.classList.remove('gl-hidden');
      return;
    }
    recentEmptyEl.classList.add('gl-hidden');
    recentListEl.classList.remove('gl-hidden');
    sessions.forEach(function (s) {
      var row = document.createElement('div');
      row.className = 'gl-row';

      var body = document.createElement('div');
      body.style.minWidth = '0';
      var name = document.createElement('div');
      name.className = 'gl-row-label';
      name.textContent = s.name || '(untitled)'; // textContent only -- server strings are never markup
      var sub = document.createElement('div');
      sub.className = 'gl-row-sub';
      var when = s.startedAt ? stateDisplayFormatter.format(new Date(s.startedAt)) : '';
      var skillText = s.skill ? '/' + s.skill + (s.skillAuto ? ' (auto)' : '') : '';
      sub.textContent = [skillText, s.project && s.project !== s.skill ? s.project : '', when].filter(Boolean).join(' · ');
      body.appendChild(name);
      body.appendChild(sub);

      var stateEl = document.createElement('span');
      var stateText = s.state || 'unknown';
      stateEl.className = 'gl-recent-row-state ' + stateText;
      stateEl.textContent = stateLabel(stateText);

      row.appendChild(body);
      row.appendChild(stateEl);
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      row.addEventListener('click', function () { openDetail(s); });
      recentListEl.appendChild(row);
    });
  }

  function loadRecent() {
    return authedFetch('/sessions/recent').then(function (res) {
      if (!res.ok) return Promise.reject(new Error('HTTP ' + res.status));
      return res.json();
    }).then(function (json) {
      var sessions = Array.isArray(json.sessions) ? json.sessions : [];
      localStorage.setItem(RECENT_CACHE_KEY, JSON.stringify({ sessions: sessions }));
      recentSavedEl.classList.add('gl-hidden');
      recentShown = true;
      renderRecent(sessions);
      // A successful load clears any earlier error THIS SAME FUNCTION raised
      // (e.g. a prior refresh that 401'd) -- without this, a stale banner
      // from a transient failure sits on screen forever even after a later
      // load quietly succeeds, which reads as "still broken" when it isn't.
      // Scoped to 'recent' (see showError/clearError's source param above)
      // so this can never wipe a DIFFERENT, still-real error loadProjects()
      // raised concurrently on the same initial page load.
      clearError('recent');
    }).catch(function (err) {
      if (recentShown) recentSavedEl.classList.remove('gl-hidden'); // the saved copy is what is on screen

    });
  }

  // Paint the saved copy before the live fetch settles.
  var cachedRecent = localStorage.getItem(RECENT_CACHE_KEY);
  if (cachedRecent !== null) {
    recentShown = true;
    recentSavedEl.classList.remove('gl-hidden');
    renderRecent(JSON.parse(cachedRecent).sessions);
  }


  // --- session detail: transcript + reply ----------------------------------

  var REPLY_DRAFT_PREFIX = 'gl-session-reply-draft-v1:';
  var detailEl = document.getElementById('gl-detail');
  var launcherEl = document.getElementById('gl-launcher');
  var headerTitleEl = document.getElementById('gl-header-title');
  var detailNameEl = document.getElementById('detail-name');
  var detailStateEl = document.getElementById('detail-state');
  var detailProjectEl = document.getElementById('detail-project');
  var openClaudeEl = document.getElementById('detail-open-claude');
  var detailScrollEl = document.getElementById('detail-scroll');
  var detailHintEl = document.getElementById('detail-hint');
  var replyEl = document.getElementById('detail-reply');
  var replyModelEl = document.getElementById('detail-model-select');
  var sendBtn = document.getElementById('detail-send');

  var detail = null; // {sessionId, info, messages, truncated, local:[], loaded, fetchSeq, timer}

  function replyDraftKey() { return REPLY_DRAFT_PREFIX + detail.sessionId; }
  function isBusyState(st) { return st === 'working' || st === 'busy'; }

  // http(s) URLs become tappable links. target=_blank is what hands the URL to
  // Safari natively (GLWebModuleViewController createWebViewWithConfiguration);
  // this page is file://, so a same-frame navigation would replace the app UI.
  var URL_RE = /https?:\/\/[^\s<>"'`)\]]+/g;
  function appendTextWithLinks(parent, text) {
    var last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      var url = m[0].replace(/[.,;:!?]+$/, '');
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = url;
      parent.appendChild(a);
      last = m.index + url.length;
      URL_RE.lastIndex = last;

    text.split(/(`[^`\n]+`)/).forEach(function (part) {
      if (!part) return;
      if (part.length > 2 && part.charAt(0) === '`' && part.charAt(part.length - 1) === '`') {
        var c = document.createElement('code');
        appendTextWithLinks(c, part.slice(1, -1));
        parent.appendChild(c);
      } else {
        appendTextWithLinks(parent, part);
      }
    });
  }

  // Light formatting only: ``` fences -> <code block>, `x` -> <code>. Everything
  // is inserted via textContent/text nodes, never innerHTML.
  function renderRichText(text) {
    var wrap = document.createElement('div');
    wrap.className = 'gl-msg-text';
    var parts = String(text || '').split(/```/);
    parts.forEach(function (part, i) {
      var inFence = i % 2 === 1;
      if (inFence && i < parts.length - 1) {
        var pre = document.createElement('code');
        pre.className = 'gl-codeblock';
        pre.textContent = part.replace(/^[^\n]*\n/, '').replace(/\n$/, ''); // drop the ```lang line
        wrap.appendChild(pre);
      } else if (part) {
        // an unterminated trailing fence renders as plain text, backticks included
        appendInline(wrap, inFence ? '```' + part : part.replace(/^\n/, '').replace(/\n$/, ''));
      }
    });
    return wrap;
  }

  function renderDetailMessages() {
    var el = detailScrollEl;
    el.innerHTML = '';
    if (detail.truncated) {
      var note = document.createElement('div');
      note.className = 'gl-trunc-note';
      note.textContent = 'Earlier messages hidden';
      el.appendChild(note);
    }
    detail.messages.forEach(function (m) {
      var wrap = document.createElement('div');
      if (m.role === 'user') {
        wrap.className = 'gl-msg gl-msg-user';
        var b = document.createElement('div');
        b.className = 'gl-bubble';
        b.textContent = m.text || '';
        wrap.appendChild(b);
      } else {
        wrap.className = 'gl-msg gl-msg-assistant';
        if (Array.isArray(m.tools) && m.tools.length) {
          var tools = document.createElement('div');
          tools.className = 'gl-msg-tools';
          m.tools.forEach(function (t) {
            var line = document.createElement('div');
            line.className = 'gl-tool-line';
            line.textContent = t.name + (t.summary ? ' · ' + t.summary : '');
            tools.appendChild(line);
          });
          wrap.appendChild(tools);
        }
        if (m.text) wrap.appendChild(renderRichText(m.text));
      }
      el.appendChild(wrap);
    });
    detail.local.forEach(function (l) {
      var wrap = document.createElement('div');
      wrap.className = 'gl-msg gl-msg-user';
      var b = document.createElement('div');
      b.className = 'gl-bubble' + (l.status === 'pending' ? ' pending' : l.status === 'failed' ? ' failed' : '');
      b.textContent = l.text;
      if (l.status === 'failed') {
        b.addEventListener('click', function () { sendReply(l); });
      }
      wrap.appendChild(b);
      if (l.status === 'failed') {
        var n = document.createElement('div');
        n.className = 'gl-bubble-note';
        n.textContent = 'Not sent. Tap to retry.';
        wrap.appendChild(n);
      }
      el.appendChild(wrap);
    });
  }

  // 'blocked' from the agent means waiting on Oliver, not an error; only 'failed' is a failure.
  function stateLabel(st) { return st === 'blocked' ? 'waiting for you' : st; }

  function renderDetailHeader() {
    var info = detail.info;
    detailNameEl.textContent = info.name || '(untitled)';
    var st = info.state || 'unknown';
    detailStateEl.className = 'gl-state-pill ' + st;
    detailStateEl.textContent = stateLabel(st);
    detailProjectEl.textContent = info.project || '';
    if (info.bridgeUrl) {
      openClaudeEl.href = info.bridgeUrl;
      openClaudeEl.classList.remove('gl-hidden');
    } else {
      openClaudeEl.removeAttribute('href');
      openClaudeEl.classList.add('gl-hidden');
    }
    updateComposer();
  }

  function updateComposer() {
    var info = detail.info;
    var hint = '';
    if (info.kind === 'interactive') hint = 'Open in Claude to reply';
    else if (isBusyState(info.state)) hint = 'Working… you can reply when it finishes';
    var disabled = !!hint;
    replyEl.disabled = disabled;
    sendBtn.disabled = disabled;
    detailHintEl.textContent = hint;
    detailHintEl.classList.toggle('gl-hidden', !hint);
  }

  function atBottom() {
    return detailScrollEl.scrollHeight - detailScrollEl.scrollTop - detailScrollEl.clientHeight < 40;
  }
  function scrollToBottom() { detailScrollEl.scrollTop = detailScrollEl.scrollHeight; }

  // Re-render keeping the reader's place unless they were already at the bottom.
  function renderDetail(forceBottom) {
    var wasAtBottom = forceBottom || atBottom();
    var prevTop = detailScrollEl.scrollTop;
    renderDetailHeader();
    renderDetailMessages();
    if (wasAtBottom) scrollToBottom(); else detailScrollEl.scrollTop = prevTop;
  }

  function schedulePoll() {
    if (!detail) return;
    clearTimeout(detail.timer);
    if (document.hidden) return;
    var ms = isBusyState(detail.info.state) ? 4000 : 15000;
    var d = detail;
    d.timer = setTimeout(function () { if (detail === d) fetchTranscript(); }, ms);
  }

  function fetchTranscript() {
    var d = detail;
    if (!d) return Promise.resolve();
    var seq = ++d.fetchSeq;
    return authedFetch('/sessions/' + encodeURIComponent(d.sessionId) + '/transcript').then(function (res) {
      if (!res.ok) return Promise.reject(new Error('HTTP ' + res.status));
      return res.json();
    }).then(function (json) {
      if (detail !== d || seq !== d.fetchSeq) return; // left detail / superseded
      var first = !d.loaded;
      d.loaded = true;
      d.info = Object.assign({}, d.info, json.session || {});
      // Right after a successful reply the server may still report the old
      // idle state for a beat; keep showing "working" until it says busy
      // itself or a fetch started after the send has come back.
      if (d.pendingWorking) {
        if (isBusyState(d.info.state) || seq > d.pendingWorking) d.pendingWorking = 0;
        else d.info.state = 'working';
      }
      d.messages = Array.isArray(json.messages) ? json.messages : [];
      d.truncated = !!json.truncated;
      // Drop sent optimistic bubbles once the server transcript shows them.
      d.local = d.local.filter(function (l) {
        if (l.status !== 'sent') return true;
        var n = d.messages.filter(function (m) { return m.role === 'user' && m.text === l.text; }).length;
        return n <= l.baseline;
      });
      clearError('transcript');
      renderDetail(first);
    }).catch(function (err) {
      if (detail !== d) return;
      showError("Couldn't load the conversation: " + err.message, 'transcript');
    }).then(function () { if (detail === d) schedulePoll(); });
  }

  function openDetail(s) {
    detail = {
      sessionId: s.sessionId || s.id,
      info: s, messages: [], truncated: false, local: [], loaded: false,
      fetchSeq: 0, timer: null, pendingWorking: 0
    };
    document.body.classList.add('detail-mode');
    launcherEl.classList.add('gl-hidden');
    detailEl.classList.remove('gl-hidden');
    headerTitleEl.textContent = 'Session';
    detailScrollEl.innerHTML = '';
    var draft = '';
    try { draft = localStorage.getItem(replyDraftKey()) || ''; } catch (e) { draft = ''; }
    replyEl.value = draft;
    renderDetailHeader();
    fetchTranscript();
  }

  function closeDetail() {
    if (detail) clearTimeout(detail.timer);
    detail = null;
    clearError('transcript');
    clearError('reply');
    document.body.classList.remove('detail-mode');
    detailEl.classList.add('gl-hidden');
    launcherEl.classList.remove('gl-hidden');
    headerTitleEl.textContent = 'New Session';
    loadRecent();
  }

  document.addEventListener('visibilitychange', function () {
    if (!detail) return;
    if (document.hidden) clearTimeout(detail.timer);
    else fetchTranscript();
  });

  function sendReply(entry) {
    var d = detail;
    if (!d) return;
    if (!entry) {
      var text = replyEl.value.trim();
      if (!text || replyEl.disabled) return;
      entry = {
        text: text, status: 'pending', key: randomIdempotencyKey(),
        baseline: d.messages.filter(function (m) { return m.role === 'user' && m.text === text; }).length
      };
      d.local.push(entry);
      replyEl.value = '';
      entry.model = replyModelEl.value;
      replyModelEl.value = '';
    } else {
      entry.status = 'pending';
    }
    try { localStorage.setItem(REPLY_DRAFT_PREFIX + d.sessionId, entry.text); } catch (e) { /* storage unavailable: draft just isn't persisted */ }
    // Saved before it is sent: replayed automatically until the box answers.
    // entry.model rides in the queue item so a retried send still switches it.
    if (!enqueue(PENDING_REPLIES_KEY, { sessionId: d.sessionId, text: entry.text, key: entry.key, model: entry.model })) {
      entry.status = 'failed';
      renderDetail(true);
      showError("Couldn't save the reply on this device, so it was not sent.", 'reply');
      return;
    }
    renderDetail(true);
    flushReplies();
  }

  sendBtn.addEventListener('click', function () { sendReply(null); });
  replyEl.addEventListener('input', function () {
    if (!detail) return;
    try {
      if (replyEl.value) localStorage.setItem(replyDraftKey(), replyEl.value);
      else localStorage.removeItem(replyDraftKey());
    } catch (e) { /* ignore */ }
  });

  refreshBtn.addEventListener('click', function () { if (detail) fetchTranscript(); else loadRecent(); });
  backBtn.addEventListener('click', function () {
    if (detail) { closeDetail(); return; }
    GLBridge.call('goBack', {}).catch(function () {});
  });

  loadProjects();
  loadRecent();
  if (readQueue(PENDING_STARTS_KEY).length) {
    setConfirmation('Starting', 'Waiting for the box. Your session starts automatically.');
  }
  flushQueues();
  pollVoice();
})();
</script>
</body>
</html>
