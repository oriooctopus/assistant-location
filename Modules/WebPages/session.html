  function onStartRejected(entry, result) {
    var msg = (result.json && result.json.error) || ('HTTP ' + result.status);
    var queue = readQueue(PENDING_STARTS_KEY);
    queue.forEach(function (q) { if (q.key === entry.key) q.failed = msg; });
    writeQueue(PENDING_STARTS_KEY, queue);
    confirmationEl.classList.add('gl-hidden');
    if (clarifyStartKey === entry.key) { clarifyStartKey = null; clarifyEl.classList.add('gl-hidden'); }
    rerenderRecent();
  }

  /** Failed Start -> Retry: back in the queue under a new key, sent now. */
  function retryFailedStart(entry) {
    rekeyStart(entry);
    flushStarts();
  }

  /** Failed Start -> Edit: exactly what was typed (plus any clarifications) goes back into the composer, merged with anything typed since. */
  function editFailedStart(entry) {
    var clarifications = readQueue(PENDING_CLARIFY_KEY).filter(function (c) { return c.startKey === entry.key; });
    var typedSince = promptEl.value.trim();
    promptEl.value = [entry.body.prompt].concat(clarifications.map(function (c) { return c.text; }), [typedSince]).filter(Boolean).join('\n\n');
    (entry.body.attachments || []).forEach(addServerAttachment);
    restorePendingAttachments((entry.pending || []).filter(function (p) { return !p.id; }).map(function (p) { return p.localId; }));
    saveDraft();
    updateStartEnabled();
    removeStart(entry);
  }

  /** Takes a queued Start out of the queue, with its clarifications and the box's "Not started" row. */
  function removeStart(entry) {
    dequeue(PENDING_STARTS_KEY, entry.key);
    writeQueue(PENDING_CLARIFY_KEY, readQueue(PENDING_CLARIFY_KEY).filter(function (c) { return c.startKey !== entry.key; }));
    rerenderRecent();
    postJson('/sessions/submissions/' + encodeURIComponent(entry.key) + '/dismiss', {}).then(loadRecent, function () {});
  }

  /**
   * Cancel on the Starting card or a Sending row: drops a Start (typed or
   * voice) the box has not taken yet. A request already in flight may still
   * start; it then shows up as a normal session.
   */
  function cancelStart(key) {
    var queued = readQueue(PENDING_STARTS_KEY).filter(function (e) { return e.key === key; })[0];
    var launch = readVoiceLaunches()[key];
    if (clarifyStartKey === key) { clarifyStartKey = null; confirmationEl.classList.add('gl-hidden'); }
    if (queued) discardFailedStart(queued);
    else if (launch) discardVoiceLaunch(launch);
  }
  confirmationCancelEl.addEventListener('click', function () { cancelStart(clarifyStartKey); });

  /** Failed Start -> Discard: the user's explicit choice to lose it, screenshots and recording included. */
  function discardFailedStart(entry) {
    (entry.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
    removeStart(entry);
    if (entry.voiceId) ackVoice(entry.voiceId).catch(function (err) { showError("Couldn't delete the recording: " + err.message); });
  }

  var flushingReplies = false;
  function flushReplies() {
    if (flushingReplies) return;
    var item = readQueue(PENDING_REPLIES_KEY)[0];
    if (!item) return;
    flushingReplies = true;
    uploadQueuedAttachments(item, PENDING_REPLIES_KEY).then(function (up) {
      if (!up.ok) return up;
      var ids = (item.pending || []).map(function (p) { return p.id; });
      return postJson('/sessions/' + encodeURIComponent(item.sessionId) + '/reply', { text: item.text, idempotencyKey: item.key, model: item.model || undefined, attachments: ids.length ? ids : undefined }, SPAWN_TIMEOUT_MS);
    }).then(function (result) {
      dequeue(PENDING_REPLIES_KEY, item.key);
      flushingReplies = false;
      (item.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
      var d = detail && detail.sessionId === item.sessionId ? detail : null;
      var entry = d && d.local.find(function (l) { return l.key === item.key; });
      // Keep the ids that did upload, so tapping the failed bubble retries with them.
      if (entry && item.pending) entry.pending = item.pending;
      if (!result.ok) {
        if (entry) entry.status = 'failed';
        showError("Couldn't send the reply: " + ((result.json && result.json.error) || ('HTTP ' + result.status)), 'reply');
        if (d) renderDetail(true);
      } else {
        try { localStorage.removeItem(REPLY_DRAFT_PREFIX + item.sessionId); } catch (e) { /* ignore */ }
        if (entry) entry.status = 'sent';
        var forkedTo = result.json.sessionId && result.json.sessionId !== item.sessionId ? result.json : null;
        if (forkedTo) {
          // The box resumed this reply under a new session; the old one is gone.
          loadRecent();
          if (d) {
            clearTimeout(d.timer);
            clearError('reply');
            openDetail(Object.assign({}, d.info, { id: forkedTo.id, sessionId: forkedTo.sessionId, state: 'working' }));
          }
        } else if (d) {
          d.pendingWorking = d.fetchSeq + 1;
          d.info = Object.assign({}, d.info, { state: 'working' });
          clearError('reply');
          renderDetail(true);
          fetchTranscript();
        }
      }
      flushReplies();
    }, function () {
      // Network-level failure: the bubble stays pending, the entry stays saved.
      flushingReplies = false;
      scheduleQueueRetry();
    });
  }

  // --- clarifications: a follow-up message for the Start on the card, sent
  // by that Start's idempotency key. The box waits for a spawn still in
  // flight, then delivers into the running session; one whose Start is still
  // queued on this device waits here until that Start has been answered.
  function showClarifyStatus(text) {
    clarifyStatusEl.textContent = text;
    clarifyStatusEl.classList.toggle('gl-hidden', !text);
  }

  function sendClarification() {
    var text = clarifyTextEl.value.trim();
    var shots = clarifyShots.slice();
    if ((!text && !shots.length) || !clarifyStartKey) return;
    // The blobs must be on disk before the queued clarification can refer to them.
    Promise.all(shots.map(function (a) { return storedWrites[a.localId]; })).then(function () {
      if (!enqueue(PENDING_CLARIFY_KEY, { key: randomIdempotencyKey(), startKey: clarifyStartKey, text: text, pending: shots.map(function (a) { return { localId: a.localId, id: null }; }) })) {
        showError("Couldn't save the clarification on this device, so it was not sent.", 'clarify');
        return;
      }
      clarifyTextEl.value = '';
      takeClarifyShots();
      showClarifyStatus('Sending clarification…');
      rerenderRecent();
      flushClarifications();
    }, function () {
      showError("Couldn't keep the screenshot on this device, so the clarification was not sent.", 'clarify');
    });
  }

  function renderClarifyThumbs() {
    paintShotThumbs(clarifyThumbsEl, clarifyShots, removeClarifyShot);
    clarifyAttachBtn.disabled = clarifyShots.length >= MAX_ATTACHMENTS;
  }

  /** Empties the box's photos (their blobs now belong to a queued clarification) and returns them. */
  function takeClarifyShots() {
    var shots = clarifyShots;
    clarifyShots = [];
    shots.forEach(function (a) { if (a.objectUrl) { try { URL.revokeObjectURL(a.objectUrl); } catch (e) { /* ignore */ } } });
    renderClarifyThumbs();
    return shots;
  }

  function removeClarifyShot(localId) {
    var idx = clarifyShots.findIndex(function (a) { return a.localId === localId; });
    if (idx === -1) return;
    var entry = clarifyShots.splice(idx, 1)[0];
    if (entry.objectUrl) { try { URL.revokeObjectURL(entry.objectUrl); } catch (e) { /* ignore */ } }
    idbLoud(idbDelete(localId));
    renderClarifyThumbs();
  }

  /** Puts photos whose blobs are still in IndexedDB back in the box. */
  function restoreClarifyShots(pending) {
    (pending || []).forEach(function (p) { clarifyShots.push({ localId: p.localId, fileName: 'screenshot', objectUrl: null }); });
    renderClarifyThumbs();
  }

  clarifyAttachBtn.addEventListener('click', function () { clarifyAttachInput.click(); });
  clarifyAttachInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(clarifyAttachInput.files || []);
    clarifyAttachInput.value = ''; // so picking the SAME file again still fires 'change'
    var toAdd = files.slice(0, Math.max(MAX_ATTACHMENTS - clarifyShots.length, 0));
    toAdd.forEach(function (file) {
      var entry = { localId: 'local-' + randomIdempotencyKey(), fileName: file.name, objectUrl: null };
      try { entry.objectUrl = URL.createObjectURL(file); } catch (e) { /* preview is best-effort only */ }
      clarifyShots.push(entry);
      storedWrites[entry.localId] = idbPut(entry.localId, file);
      idbLoud(storedWrites[entry.localId]);
    });
    renderClarifyThumbs();
    if (files.length > toAdd.length) showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (files.length - toAdd.length) + ' skipped.', 'clarify');
  });

  var flushingClarifications = false;
  function flushClarifications() {
    if (flushingClarifications) return;
    var startsQueued = readQueue(PENDING_STARTS_KEY).map(function (e) { return e.key; }).concat(Object.keys(readVoiceLaunches()));
    var item = readQueue(PENDING_CLARIFY_KEY).filter(function (c) { return startsQueued.indexOf(c.startKey) === -1; })[0];
    if (!item) return;
    flushingClarifications = true;
    uploadQueuedAttachments(item, PENDING_CLARIFY_KEY).then(function (up) {
      if (!up.ok) return up;
      var ids = (item.pending || []).map(function (p) { return p.id; });
      return postJson('/sessions/clarify', { startKey: item.startKey, text: item.text, idempotencyKey: item.key, attachments: ids.length ? ids : undefined }, SPAWN_TIMEOUT_MS);
    }).then(function (result) {
      dequeue(PENDING_CLARIFY_KEY, item.key);
      flushingClarifications = false;
      var mine = item.startKey === clarifyStartKey;
      if (result.ok) {
        clearError('clarify');
        (item.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
        if (mine) showClarifyStatus('Clarification sent' + (result.json && result.json.delivered === 'live' ? ' into the running session.' : '.'));
      } else {
        var msg = (result.json && result.json.error) || ('HTTP ' + result.status);
        if (mine) {
          clarifyTextEl.value = [item.text, clarifyTextEl.value.trim()].filter(Boolean).join('\n\n');
          restoreClarifyShots(item.pending); // blobs stay for the next send
          showClarifyStatus('');
        } else {
          (item.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
        }
        showError("Couldn't send the clarification: " + msg, 'clarify');
      }
      flushClarifications();
    }, function () {
      flushingClarifications = false;
      if (item.startKey === clarifyStartKey) showClarifyStatus('Saved. Sends when the box is reachable.');
      scheduleQueueRetry();
    });
  }
  clarifySendBtn.addEventListener('click', sendClarification);

  window.addEventListener('online', flushQueues);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { flushQueues(); pollVoice(); }
  });

  // --- iOS keyboard dictation vs Start -----------------------------------
  // Tapping a <button> on iOS does not blur a focused textarea, so keyboard
  // dictation keeps running through the tap. While it runs, promptEl.value
  // holds only the words WebKit has committed so far; the rest sits in
  // dictation's own buffer. Incident (2026-11-05): Start sent the first 281
  // chars, the composer was cleared, then dictation finalized and wrote its
  // whole 735-char result back into the empty box (input event -> saveDraft),
  // so hours later the "unsent" text was sitting there and a resend made a
  // duplicate session. Two guards:
  //  1. Settle: when the prompt has focus at the tap, blur it (which ends
  //     dictation and commits its text) and read the value only after
  //     DICTATION_SETTLE_MS. The commit arrives over WebKit's UI-process IPC,
  //     so it is never synchronous with blur(). 300ms is a guess sized above
  //     one IPC round-trip; nothing on the device measured it.
  //  2. Echo: if text that begins with the prompt a Start just sent still
  //     shows up in the cleared box within DICTATION_ECHO_MS, the sent part is
  //     stripped and only the unsent tail stays, flagged, so it is never
  //     mistaken for an unsent request again.
  var DICTATION_SETTLE_MS = 300;
  var DICTATION_ECHO_MS = 60000;
  var settlingStart = false;
  var lastClearedPrompt = null; // {text, at} of the last Start that emptied the composer

  // Focus is sampled at pointerdown because browsers that DO move focus to a
  // tapped button (desktop Chromium) have already blurred the prompt by the
  // time 'click' fires; iOS never moves it, so either check alone misses one.
  var promptFocusedAtTap = false;
  startBtn.addEventListener('pointerdown', function () { promptFocusedAtTap = document.activeElement === promptEl; });

  function onStartTap() {
    if (settlingStart) return; // a second tap inside the settle window is the same Start
    var hadFocus = promptFocusedAtTap || document.activeElement === promptEl;
    promptFocusedAtTap = false;
    if (!hadFocus) { startSession(); return; }
    settlingStart = true;
    promptEl.blur();
    setTimeout(function () { settlingStart = false; startSession(); }, DICTATION_SETTLE_MS);
  }

  /** Runs before every input-driven saveDraft: drops a dictation echo of the prompt a Start just sent. Returns true when it left an unsent tail (and its notice) behind. */
  function stripDictationEcho() {
    var sent = lastClearedPrompt;
    if (!sent) return;
    if (Date.now() - sent.at > DICTATION_ECHO_MS) { lastClearedPrompt = null; return; }
    var value = promptEl.value.trim();
    // Checked before the prefix test below, which an identical value also passes.
    if (value === sent.text) { lastClearedPrompt = null; promptEl.value = ''; return false; }
    // Dictation may refill the box in steps: a value that is still a prefix of
    // what was sent is the echo mid-way, so keep watching rather than judge it.
    if (sent.text.indexOf(value) === 0) return;
    if (value.indexOf(sent.text) !== 0) { lastClearedPrompt = null; return; } // genuinely new text
    lastClearedPrompt = null;
    var rest = value.slice(sent.text.length).trim();
    promptEl.value = rest;
    if (rest) showError("Dictation finished after Start. This part wasn't sent.");
    return !!rest;
  }

  startBtn.addEventListener('click', onStartTap);

  // --- recent sessions -----------------------------------------------------

  var stateDisplayFormatter = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });

  // Same grouping, order and glyphs as the terminal agents view. Interactive
  // terminal sessions (not shown there) go last, since they can't be replied to here.
  var RECENT_GROUPS = [
    { label: 'Failed to send', failed: true, match: function (s) { return s.kind === 'pending' && s.failed; } },
    { label: 'Sending', match: function (s) { return s.kind === 'pending'; } },
    { label: 'Needs input', match: function (s) { return s.state === 'blocked'; } }, // includes the box's unanswered skill questions
    { label: 'Not started', match: function (s) { return s.kind === 'submission' && s.state !== 'starting'; } },
    { label: 'Working', match: function (s) { return s.kind === 'submission' ? s.state === 'starting' : (s.kind !== 'interactive' && isBusyState(s.state)); } },
    { label: 'Completed', match: function (s) { return s.kind !== 'interactive'; } },
    { label: 'Terminal', match: function () { return true; } },
  ];
  var RECENT_GLYPHS = { blocked: '✻', working: '●', busy: '●', done: '✻', failed: '✕', sending: '●', starting: '●', interrupted: '✕' };
  var lastSessions = []; // the last server list, so the queue can re-render Recent without a fetch
  var startsOffline = false; // the last Start flush hit a network error

  /** Sends saved on this phone that the box has not confirmed yet (voice launches and queued Starts), as Recent rows. Failed ones carry the reason and Retry/Discard. */
  function pendingStartRows() {
    var launches = readVoiceLaunches();
    var rows = Object.keys(launches).map(function (k) {
      var l = launches[k];
      var failed = l.status === 'failed';
      var actions = [];
      if (l.voiceId && nativeKnowsLaunches) actions.push({ label: '▶ Play', run: function () { playVoice(l.voiceId); } });
      var name = (l.snap.prefix || '').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Voice note';
      if (!failed) actions.push(clarifyAction(l.localId, name));
      if (failed && l.voiceId && nativeKnowsLaunches) actions.push({ label: 'Retry', run: function () { retryVoiceLaunch(l); } });
      actions.push({ label: 'Discard', run: function () { discardVoiceLaunch(l); } });
      return {
        kind: 'pending',
        state: failed ? 'failed' : 'sending',
        failed: failed,
        key: l.localId,
        name: name,
        summary: (failed ? 'Failed: ' + l.error : l.status === 'waiting' ? 'Waiting for box — transcribes automatically' : 'Transcribing…') + ' · ' + l.localId.slice(0, 8) + clarificationsWaiting(l.localId),
        activityAt: l.at,
        actions: actions,
      };
    });
    return rows.concat(readQueue(PENDING_STARTS_KEY).map(function (e) {
      var prompt = (e.body.prompt || '').replace(/\s+/g, ' ').trim();
      var actions = [];
      if (e.voiceId && nativeKnowsLaunches) actions.push({ label: '▶ Play', run: function () { playVoice(e.voiceId); } });
      var name = prompt.slice(0, 80) || (e.body.project ? '/' + e.body.project : 'Screenshot only');
      if (!e.failed) {
        actions.push(clarifyAction(e.key, name));
        actions.push({ label: 'Cancel', run: function () { cancelStart(e.key); } });
      }
      if (e.failed) {
        actions.push({ label: 'Retry', run: function () { retryFailedStart(e); } });
        if (!e.voiceId) actions.push({ label: 'Edit', run: function () { editFailedStart(e); } });
        actions.push({ label: 'Discard', run: function () { discardFailedStart(e); } });
      }
      return {
        kind: 'pending',
        state: e.failed ? 'failed' : 'sending',
        failed: !!e.failed,
        key: e.key,
        name: name,

  // http(s) URLs become tappable links. target=_blank is what hands the URL to
  // Safari natively (GLWebModuleViewController createWebViewWithConfiguration);
  // this page is file://, so a same-frame navigation would replace the app UI.
  var URL_RE = /https?:\/\/[^\s<>"'`)\]]+/g;
  function appendTextWithLinks(parent, text) {
    var last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      var url = m[0].replace(/[.,;:!?]+$/, '');
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');

      a.target = '_blank';
      a.rel = 'noopener';

      parent.appendChild(a);

  // One regex rather than a pass per syntax, so whichever token starts first wins:
  // `a**b**` stays code and https://x/*y* stays a URL, while **`a`** recurses into
  // bold + code. No lookbehind: it is a parse error on older WebKit and would
  // take down the whole page script, so the word-boundary check for *italic*
  // happens in the loop instead (keeps a*b*c and 2*3*4 literal).
  // Groups: 1 code, 2 bold, 3 link text, 4 link url, 5 italic. A bare URL matches no group.
  var INLINE_RE = /`([^`\n]+)`|\*\*(?=\S)([^\n]*?\S)\*\*|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|\*(?=[^\s*])([^*\n]*?[^\s*])\*|https?:\/\/[^\s<>"'`)\]]+/g;
  function appendInline(parent, text) {
    // A local regex, because the bold/link branches recurse and a shared lastIndex would be clobbered.
    var re = new RegExp(INLINE_RE.source, 'g');
    var last = 0, m;
    while ((m = re.exec(text))) {
      if (m[5] !== undefined && (/\w/.test(text.charAt(m.index - 1)) || /\w/.test(text.charAt(m.index + m[0].length)))) {
        re.lastIndex = m.index + 1;
        continue;
      }
      if (m.index > last) appendTextWithLinks(parent, text.slice(last, m.index));
      var el;
      if (m[1] !== undefined) {
        el = document.createElement('code');
        appendTextWithLinks(el, m[1]);
      } else if (m[2] !== undefined) {
        el = document.createElement('strong');
        appendInline(el, m[2]);
      } else if (m[3] !== undefined) {
        el = document.createElement('a');
        el.href = m[4];
        el.target = '_blank'; // same reason as appendTextWithLinks: hands the URL to Safari
        el.rel = 'noopener';

      last = m.index + m[0].length;

  var TABLE_DIVIDER_RE = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;

  }

  // Scrolls sideways inside its own box: Claude's tables are often wider than a

  function renderTable(rows) {

  // Line-level markdown for text outside code fences: headings, rules, lists,
  // tables, paragraphs. Assistant replies are written as markdown, so anything
  // left out here shows its raw syntax on the phone. Blank lines become paragraph
  // margins; single line breaks survive via .gl-msg-text's pre-wrap.
  function appendMarkdown(parent, text) {
    var lines = text.split('\n');
    var para = [];
    function flush() {
      if (!para.length) return;
      var p = document.createElement('div');
      p.className = 'gl-md-p';
      appendInline(p, para.join('\n'));
      parent.appendChild(p);
      para = [];
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i], m;
      if (!line.trim()) {
        flush();
      } else if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/))) {
        flush();
        var h = document.createElement('div');
        h.className = 'gl-md-h gl-md-h' + m[1].length;
        appendInline(h, m[2]);
        parent.appendChild(h);
      } else if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) {
        flush();

      } else if (line.indexOf('|') !== -1 && i + 1 < lines.length && lines[i + 1].indexOf('-') !== -1 && TABLE_DIVIDER_RE.test(lines[i + 1])) {
        flush();
        var rows = [tableCells(line)];
        i += 2; // past the header and its divider
        while (i < lines.length && lines[i].indexOf('|') !== -1) rows.push(tableCells(lines[i++]));
        i--; // the for loop's i++ must land on the first line after the table
        parent.appendChild(renderTable(rows));
      } else if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
        flush();

        marker.textContent = /\d/.test(m[2]) ? m[2] : '•';
        var body = document.createElement('span');
        appendInline(body, m[3]);
        li.appendChild(marker);
        li.appendChild(body);
        parent.appendChild(li);
      } else {

      }

  }

  // ``` fences -> <code block>; everything else goes through appendMarkdown.

  function renderRichText(text) {

    d.messages = Array.isArray(json.messages) ? json.messages : [];
    d.truncated = !!json.truncated;
    // Drop sent optimistic bubbles once the server transcript shows them.
    d.local = d.local.filter(function (l) {
      if (l.status !== 'sent') return true;
      var n = d.messages.filter(function (m) { return m.role === 'user' && m.text === l.text; }).length;
      return n <= l.baseline;
    });
    renderDetail(first);
  }

  function fetchTranscript() {
    var d = detail;
    if (!d) return Promise.resolve();
    var seq = ++d.fetchSeq;
    return getTranscript(d.sessionId).then(function (json) {
      if (detail !== d || seq !== d.fetchSeq) return; // left detail / superseded
      applyTranscript(d, json, seq, true);
      clearError('transcript');
    }).catch(function (err) {
      if (detail !== d) return;
      showError("Couldn't load the conversation: " + err.message, 'transcript');
    }).then(function () { if (detail === d) schedulePoll(); });
  }

  function openDetail(s) {
    detail = {
      sessionId: s.sessionId || s.id,
      info: s, messages: [], truncated: false, local: [], loaded: false,
      fetchSeq: 0, timer: null, pendingWorking: 0,
      attachments: [], sending: false  // screenshots picked for the reply being composed
    };
    document.body.classList.add('detail-mode');
    launcherEl.classList.add('gl-hidden');
    detailEl.classList.remove('gl-hidden');
    headerTitleEl.textContent = 'Session';
    detailScrollEl.innerHTML = '';
    var draft = '';
    try { draft = localStorage.getItem(replyDraftKey()) || ''; } catch (e) { draft = ''; }
    replyEl.value = draft;
    renderReplyThumbs();
    reconcileReplyLaunches(detail);
    renderDetailHeader();
    var cached = transcriptCache[detail.sessionId];
    if (cached) applyTranscript(detail, cached, 0, false);
    fetchTranscript();
  }

  function closeDetail() {
    if (detail) {
      clearTimeout(detail.timer);
      // Unsent screenshots are not kept: drop their blobs rather than leak them.
      detail.attachments.slice().forEach(function (a) { removeReplyAttachment(a.localId); });
    }
    detail = null;
    clearError('transcript');
    clearError('reply');
    document.body.classList.remove('detail-mode');
    detailEl.classList.add('gl-hidden');
    launcherEl.classList.remove('gl-hidden');
    headerTitleEl.textContent = 'New Session';
    loadRecent();
    loadInboxStrip();
  }

  document.addEventListener('visibilitychange', function () {
    if (!detail) return;
    if (document.hidden) clearTimeout(detail.timer);
    else fetchTranscript();
  });

  var SHOT_ONLY_TEXT = 'See the attached screenshot(s).'; // what the box records for a reply with no text

  /** Paints removable thumbnails for `list` into `rowEl`; the x calls onRemove(localId). */
  function paintShotThumbs(rowEl, list, onRemove) {
    rowEl.innerHTML = '';
    list.forEach(function (entry) {
      var wrap = document.createElement('div');
      wrap.className = 'gl-thumb done';
      var clip = document.createElement('div');
      clip.className = 'gl-thumb-clip';
      if (entry.objectUrl) {
        var img = document.createElement('img');
        img.src = entry.objectUrl;
        img.alt = entry.fileName || 'attached screenshot';
        clip.appendChild(img);
      } else {
        var placeholder = document.createElement('div');
        placeholder.className = 'gl-thumb-placeholder';
        placeholder.textContent = '\ud83d\uddbc';
        clip.appendChild(placeholder);
      }
      wrap.appendChild(clip);
      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'gl-thumb-remove';
      removeBtn.setAttribute('aria-label', 'Remove screenshot');
      var glyph = document.createElement('span');
      glyph.className = 'gl-thumb-remove-glyph';
      glyph.textContent = '\u00d7';
      removeBtn.appendChild(glyph);
      removeBtn.addEventListener('click', function () { onRemove(entry.localId); });
      wrap.appendChild(removeBtn);
      rowEl.appendChild(wrap);
    });
  }

  function renderReplyThumbs() {
    paintShotThumbs(detailThumbsEl, detail ? detail.attachments : [], removeReplyAttachment);
    if (detail) updateComposer();
  }

  // Picked screenshots go to IndexedDB at once and upload only when the reply
  // is sent (flushReplies), so picking works offline and survives a restart.
  function addReplyAttachment(file) {
    var d = detail;
    if (!d) return;
    var entry = { localId: 'local-' + randomIdempotencyKey(), fileName: file.name, objectUrl: null };
    try { entry.objectUrl = URL.createObjectURL(file); } catch (e) { /* preview is best-effort only */ }
    d.attachments.push(entry);
    storedWrites[entry.localId] = idbPut(entry.localId, file);
    idbLoud(storedWrites[entry.localId]);
    renderReplyThumbs();
  }

  function removeReplyAttachment(localId) {
    var d = detail;
    if (!d) return;
    var idx = d.attachments.findIndex(function (a) { return a.localId === localId; });
    if (idx === -1) return;
    var entry = d.attachments.splice(idx, 1)[0];
    if (entry.objectUrl) { try { URL.revokeObjectURL(entry.objectUrl); } catch (e) { /* ignore */ } }
    idbLoud(idbDelete(localId));
    renderReplyThumbs();
  }

  // Saves the reply to the offline queue (entry.pending = screenshots not yet
  // uploaded), then shows it; flushReplies uploads and sends it.
  function queueReply(d, entry) {
    try { localStorage.setItem(REPLY_DRAFT_PREFIX + d.sessionId, entry.draft); } catch (e) { /* storage unavailable: draft just isn't persisted */ }
    // Saved before it is sent: replayed automatically until the box answers.
    // entry.model rides in the queue item so a retried send still switches it.
    if (!enqueue(PENDING_REPLIES_KEY, { sessionId: d.sessionId, text: entry.text, key: entry.key, model: entry.model, pending: entry.pending })) {
      entry.status = 'failed';
      renderDetail(true);
      showError("Couldn't save the reply on this device, so it was not sent.", 'reply');
      return;
    }
    renderDetail(true);
    flushReplies();
  }

  function sendReply(entry) {
    var d = detail;
    if (!d) return;
    if (entry) {
      entry.status = 'pending';
      queueReply(d, entry);
      return;
    }
    var typed = replyEl.value.trim();
    var shots = d.attachments.slice();
    if ((!typed && !shots.length) || replyEl.disabled || d.sending) return;
    var text = typed || SHOT_ONLY_TEXT;
    function commit() {
      entry = {
        text: text, draft: typed, status: 'pending', key: randomIdempotencyKey(),
        baseline: d.messages.filter(function (m) { return m.role === 'user' && m.text === text; }).length,
        model: replyModelEl.value,
        pending: shots.map(function (a) { return { localId: a.localId, id: null }; })
      };
      d.local.push(entry);
      replyEl.value = '';
      replyModelEl.value = '';
      d.attachments = [];
      shots.forEach(function (a) { if (a.objectUrl) { try { URL.revokeObjectURL(a.objectUrl); } catch (e) { /* ignore */ } } });
      renderReplyThumbs();
      queueReply(d, entry);
    }
    if (!shots.length) { commit(); return; }
    // The blobs must be on disk before the queued reply can refer to them.
    d.sending = true;
    Promise.all(shots.map(function (a) { return storedWrites[a.localId]; })).then(function () {
      d.sending = false;
      if (detail === d) commit();
    }, function () {
      d.sending = false;
      showError("Couldn't keep the screenshot on this device, so the reply was not sent.", 'reply');
    });
  }

  sendBtn.addEventListener('click', function () { sendReply(null); });
  detailAttachBtn.addEventListener('click', function () { detailAttachInput.click(); });
  detailAttachInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(detailAttachInput.files || []);
    detailAttachInput.value = ''; // so picking the SAME file again still fires 'change'
    if (!detail) return;
    var room = MAX_ATTACHMENTS - detail.attachments.length;
    var toAdd = files.slice(0, Math.max(room, 0));
    toAdd.forEach(addReplyAttachment);
    if (files.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (files.length - toAdd.length) + ' skipped.', 'reply');
    }
  });
  // Same gesture as the launcher mic: tap-tap sends the reply, hold + Insert inserts, hold + Cancel discards.
  attachMicHold(detailRecordBtn, {
    targetsEl: document.getElementById('detail-hold-targets'),
    insertEl: document.getElementById('detail-insert-target'),
    cancelEl: document.getElementById('detail-cancel-target'),
    canHold: function () { return recording && voiceTarget === 'reply'; },
    onTap: function () {
      if (!recording) startVoiceCapture('reply');
      else if (voiceTarget === 'reply') stopAndSendReply();
    }
  });
  replyEl.addEventListener('input', function () {
    if (!detail) return;
    try {
      if (replyEl.value) localStorage.setItem(replyDraftKey(), replyEl.value);
      else localStorage.removeItem(replyDraftKey());
    } catch (e) { /* ignore */ }
  });

  refreshBtn.addEventListener('click', function () { if (detail) fetchTranscript(); else loadRecent(); });
  // Sessions is a tab root (no navigation stack to pop), so Back only exists
  // in the detail view; CSS hides it on the list via body.detail-mode.
  backBtn.addEventListener('click', function () {
    if (detail) closeDetail();
  });

  migrateLegacyAutoSends();
  loadProjects();
  loadRecent();
  var queuedStarts = readQueue(PENDING_STARTS_KEY).filter(function (e) { return !e.failed; });
  if (queuedStarts.length) {
    setConfirmation('Starting', 'Waiting for the box. Your session starts automatically.', false, queuedStarts[queuedStarts.length - 1].key);
  }
  flushQueues();
  pollVoice();
})();
</script>
</body>
</html>
