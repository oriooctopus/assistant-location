      // voiceStop's .then() below (see GLWebBridge.m's voiceStartWithReply:).
      if (err && err.message === 'mic_denied') {
        showError('Microphone access needed — enable it in Settings to record.');
        return;
      }
      showError('Could not start recording: ' + err.message);
    });
  }

  // Every send by voice owns a "launch" from the moment the button is pressed:
  // the composer snapshot plus a local id, status (transcribing / waiting /
  // failed) and, once native has queued the recording, its voiceId. It lives
  // in localStorage (not memory) so it survives a reload, shows as a Recent
  // row, and is only removed when the transcript has become a queued Start
  // (which then owns the recording) or the user discards it. launchId is also
  // sent to native with the recording so the two can be matched after a reload.
  var VOICE_LAUNCHES_KEY = 'gl-session-voice-launches-v1';
  function readVoiceLaunches() {
    try { return JSON.parse(localStorage.getItem(VOICE_LAUNCHES_KEY) || '{}'); } catch (e) { return {}; }
  }
  function writeVoiceLaunches(all) {
    try {
      if (Object.keys(all).length) localStorage.setItem(VOICE_LAUNCHES_KEY, JSON.stringify(all));
      else localStorage.removeItem(VOICE_LAUNCHES_KEY);
      return true;
    } catch (e) { return false; }
  }
  /** Returns false when the write failed, so the caller refuses to clear the composer. */
  function addVoiceLaunch(launch) {
    var all = readVoiceLaunches();
    all[launch.localId] = launch;
    return writeVoiceLaunches(all);
  }
  function updateVoiceLaunch(localId, patch) {
    var all = readVoiceLaunches();
    if (!all[localId]) return;
    Object.keys(patch).forEach(function (k) { all[localId][k] = patch[k]; });
    writeVoiceLaunches(all);
    rerenderRecent();
  }
  function removeVoiceLaunch(localId) {
    var all = readVoiceLaunches();
    delete all[localId];
    writeVoiceLaunches(all);
    rerenderRecent();
  }
  /** The launch a native voice item belongs to (matched by launchId, or by voiceId once known). */
  function launchForVoice(r) {
    var all = readVoiceLaunches();
    return all[r.launchId] || Object.keys(all).map(function (k) { return all[k]; }).filter(function (l) { return l.voiceId === r.id; })[0] || null;
  }
  /** A queued or failed Start already owns this recording, so a late poll must not treat it as a loose dictation. */
  function voiceOwnedByStart(voiceId) {
    return readQueue(PENDING_STARTS_KEY).some(function (e) { return e.voiceId === voiceId; });
  }
  function ackVoice(voiceId) {
    return GLBridge.call('voiceAck', { id: voiceId });
  }

  // Version skew: this page ships over the air and can run inside an OLDER
  // native build that has no launchId meta, no voicePending.pending list and
  // no voiceAudio / voiceRetry (and deletes rejected recordings itself). The
  // capability is read from the voicePending reply itself: only a native that
  // knows launches sends a `pending` array. Until a reply proves it (and on
  // any reply without it) Play/Retry stay hidden, since they would call
  // missing bridge methods, and launches are never declared "native never saw
  // it", since an old native cannot echo launchId back to match them.
  var nativeKnowsLaunches = false;

  // A voice send that was in flight before this page version existed lives in
  // the old per-voice-note snapshot store. Move each into a launch (waiting,
  // keyed by its voice-note id, which is how pollVoice matches it) so the
  // transcript still starts its session. Written before the old key is
  // removed, so a failed write loses nothing.
  var LEGACY_AUTOSEND_KEY = 'gl-session-voice-autosend-v1';
  function migrateLegacyAutoSends() {
    var legacy;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_AUTOSEND_KEY) || '{}'); } catch (e) { return; }
    var ids = Object.keys(legacy);
    if (!ids.length) { try { localStorage.removeItem(LEGACY_AUTOSEND_KEY); } catch (e) {} return; }
    var all = readVoiceLaunches();
    ids.forEach(function (voiceId) {
      var localId = randomIdempotencyKey();
      all[localId] = { localId: localId, voiceId: voiceId, snap: legacy[voiceId], status: 'waiting', error: null, at: Date.now() };
    });
    if (!writeVoiceLaunches(all)) return;
    try { localStorage.removeItem(LEGACY_AUTOSEND_KEY); } catch (e) {}
  }

  // Reply launches: the reply-row mic's equivalent of a voice launch. Tapping
  // stop empties the reply box at once, so the typed text, the screenshots
  // and WHICH SESSION dictated it must outlive the page until the transcript
  // arrives (it can be minutes late when the box is unreachable, and the
  // detail may be closed or the page reloaded meanwhile). Kept in localStorage
  // under its own key (launcher launches render as Recent rows; these do not),
  // matched to native's recording by launchId, or by voiceId on an older native.
  // Record: {localId, sessionId, voiceId, prefix, model, shots:[{localId,
  // fileName}], status: transcribing | waiting | delivered | failed, error, at}.
  // `delivered` = the reply is already in PENDING_REPLIES_KEY (which sends by
  // sessionId, needing no open detail) and we are only waiting to ack native's
  // recording, so a late poll cannot treat it as a loose dictation.
  var REPLY_LAUNCHES_KEY = 'gl-session-voice-reply-launches-v1';
  var replyLaunches = launchStore(REPLY_LAUNCHES_KEY);
  var readReplyLaunches = replyLaunches.read;
  var writeReplyLaunches = replyLaunches.write;
  var updateReplyLaunch = replyLaunches.update;
  var removeReplyLaunch = replyLaunches.remove;
  var replyLaunchForVoice = replyLaunches.forVoice;

  /** A localStorage map of voice sends waiting on a transcript: the reply and clarify mics each own one. */
  function launchStore(key) {
    function read() {
      try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; }
    }
    function write(all) {
      try {
        if (Object.keys(all).length) localStorage.setItem(key, JSON.stringify(all));
        else localStorage.removeItem(key);
        return true;
      } catch (e) { return false; }
    }
    return {
      read: read,
      write: write,
      update: function (localId, patch) {
        var all = read();
        if (!all[localId]) return;
        Object.keys(patch).forEach(function (k) { all[localId][k] = patch[k]; });
        write(all);
      },
      remove: function (localId) {
        var all = read();
        delete all[localId];
        write(all);
      },
      // By launchId, or by voiceId on an older native that cannot echo launchId back.
      forVoice: function (r) {
        var all = read();
        return all[r.launchId] || Object.keys(all).map(function (k) { return all[k]; }).filter(function (l) { return l.voiceId === r.id; })[0] || null;
      }
    };
  }

  // Clarify launches: the clarify-row mic's equivalent, for the same reason:
  // the box empties on the stop tap, and the transcript can arrive long after
  // the card has moved on or the page has reloaded. Record: {localId, startKey,
  // voiceId, prefix, status: transcribing | waiting | delivered, error, at}.
  var clarifyLaunches = launchStore('gl-session-voice-clarify-launches-v1');

  /** The clarify-row mic's stop tap: commit at once (box emptied), send when the transcript arrives. */
  function stopAndSendClarification() {
    var key = voiceClarifyKey;
    var live = clarifyStartKey === key; // the box holds this Start's text only while the card still shows it
    var rec = { localId: randomIdempotencyKey(), startKey: key, voiceId: null, prefix: live ? clarifyTextEl.value.trim() : '', status: 'transcribing', error: null, at: Date.now() };
    if (live) rec.shots = clarifyShots.map(function (a) { return { localId: a.localId }; }); // photos in the box ride along
    // Durable FIRST: nothing is cleared until the record that can restore it is on disk.
    var all = clarifyLaunches.read();
    all[rec.localId] = rec;
    if (!clarifyLaunches.write(all)) {
      showError("Couldn't save the clarification on this device, so nothing was sent or cleared.", 'clarify');
      return;
    }
    if (live) { clarifyTextEl.value = ''; takeClarifyShots(); }
    stopVoiceCapture(null, rec.localId, {
      localId: rec.localId,
      store: clarifyLaunches,
      deliver: deliverClarifyLaunch,
      fail: failClarifyLaunch
    });
  }

  /** The transcript exists: "typed + transcript" joins the clarification queue, which waits for that Start and retries offline. */
  function deliverClarifyLaunch(localId, transcript, voiceId) {
    var rec = clarifyLaunches.read()[localId];
    if (!rec) return;
    if (rec.status === 'delivered') { // already queued in an earlier page life; only the ack is missing
      ackVoice(voiceId).then(function () { clarifyLaunches.remove(localId); }, function () {});
      return;
    }
    var text = [rec.prefix, transcript].filter(Boolean).join(' ');
    // The record's id is the queue key, so a delivery repeated after a crash here is still one clarification to the box.
    if (!enqueue(PENDING_CLARIFY_KEY, { key: rec.localId, startKey: rec.startKey, text: text, pending: (rec.shots || []).map(function (a) { return { localId: a.localId, id: null }; }) })) {
      failClarifyLaunch(localId, "Couldn't save the clarification on this device, so it was not sent.", voiceId);
      return;
    }
    clarifyLaunches.update(localId, { status: 'delivered', voiceId: voiceId });
    if (rec.startKey === clarifyStartKey) showClarifyStatus('Sending clarification…');
    rerenderRecent();
    flushClarifications();
    // The clarification is durable now, so native may drop the recording; the record goes with it.
    ackVoice(voiceId).then(function () { clarifyLaunches.remove(localId); }, function () {});
  }

  /** Transcription failed: the typed part goes back in the box if the card still shows that Start, else into the error so it is not lost. */
  function failClarifyLaunch(localId, msg, voiceId) {
    var rec = clarifyLaunches.read()[localId];
    if (!rec) return;
    clarifyLaunches.remove(localId);
    if (voiceId || rec.voiceId) ackVoice(voiceId || rec.voiceId).catch(function () {});
    if (rec.startKey === clarifyStartKey) {
      clarifyTextEl.value = [rec.prefix, clarifyTextEl.value.trim()].filter(Boolean).join(' ');
      restoreClarifyShots(rec.shots);
      showClarifyStatus('');
      showError(msg + (rec.prefix ? ' Your clarification is back in the box.' : ''), 'clarify');
    } else {
      showError(msg + (rec.prefix ? ' Clarification not sent: ' + rec.prefix : ''), 'clarify');
    }
  }

  function openDetailFor(sessionId) { return detail && detail.sessionId === sessionId ? detail : null; }

  /** The optimistic bubble for a reply launch in an open detail (made if missing, e.g. after the detail was reopened). */
  function replyLaunchBubble(d, rec) {
    var entry = d.local.filter(function (l) { return l.key === rec.localId; })[0];
    if (!entry) {
      entry = { text: '', draft: '', status: 'pending', key: rec.localId, baseline: 0, model: rec.model, pending: rec.shots.map(function (a) { return { localId: a.localId, id: null }; }) };
      d.local.push(entry);
    }
    if (!entry.text) entry.text = rec.prefix ? rec.prefix + ' …' : 'Transcribing…'; // placeholder until the transcript exists
    return entry;
  }

  /** The reply-row mic's stop tap: commit at once (box emptied, pending bubble), send when the transcript arrives. */
  function stopAndSendReply() {
    var d = voiceDetail; // the detail that dictated this, even if the user has since moved on
    // The composer holds this detail's draft only while that detail is the open one.
    var live = detail === d;
    var shots = live ? d.attachments.slice() : [];
    var rec = {
      localId: randomIdempotencyKey(), sessionId: d.sessionId, voiceId: null,
      prefix: live ? replyEl.value.trim() : '', model: live ? replyModelEl.value : '',
      shots: shots.map(function (a) { return { localId: a.localId, fileName: a.fileName }; }),
      status: 'transcribing', error: null, at: Date.now()
    };
    // Durable FIRST: nothing is cleared until the record that can restore it is on disk.
    var all = readReplyLaunches();
    all[rec.localId] = rec;
    if (!writeReplyLaunches(all)) {
      showError("Couldn't save the reply on this device, so nothing was sent or cleared.", 'reply');
      return;
    }
    if (live) {
      replyEl.value = '';
      replyEl.dispatchEvent(new Event('input')); // drops the saved draft: the record owns the text now
      replyModelEl.value = '';
      d.attachments = []; // blobs stay in IndexedDB: the record points at them
      shots.forEach(function (a) { if (a.objectUrl) { try { URL.revokeObjectURL(a.objectUrl); } catch (e) { /* ignore */ } } });
      renderReplyThumbs();
      replyLaunchBubble(d, rec);
      renderDetail(true);
    }
    // rec.localId is what lets pollVoice match the recording after a reload, before voiceStop has answered with a voice id.
    stopVoiceCapture(null, rec.localId, {
      localId: rec.localId,
      store: replyLaunches,
      deliver: deliverReplyLaunch,
      fail: failReplyLaunch
    });
  }

  /** The transcript exists: queue "typed + transcript" (+ screenshots) as a reply to the dictating session. */
  function deliverReplyLaunch(localId, transcript, voiceId) {
    var rec = readReplyLaunches()[localId];
    if (!rec) return;
    if (rec.status === 'delivered') { // already queued in an earlier page life; only the ack is missing
      ackVoice(voiceId).then(function () { removeReplyLaunch(localId); }, function () {});
      return;
    }
    var text = [rec.prefix, transcript].filter(Boolean).join(' ');
    // The screenshot blobs must be on disk before the queued reply can refer to them (none pending after a reload: already written).
    Promise.all(rec.shots.map(function (a) { return storedWrites[a.localId]; })).then(function () {
      var pending = rec.shots.map(function (a) { return { localId: a.localId, id: null }; });
      var d = openDetailFor(rec.sessionId);
      if (!d) {
        // No bubble to retry from: leave the text as that session's reply draft too, like queueReply, so a send the box refuses is recoverable.
        try { localStorage.setItem(REPLY_DRAFT_PREFIX + rec.sessionId, text); } catch (e) { /* storage unavailable */ }
      }
      if (!enqueue(PENDING_REPLIES_KEY, { sessionId: rec.sessionId, text: text, key: rec.localId, model: rec.model, pending: pending })) {
        failReplyLaunch(localId, "Couldn't save the reply on this device, so it was not sent.", voiceId);
        return;
      }
      updateReplyLaunch(localId, { status: 'delivered', voiceId: voiceId });
      if (d) {
        var entry = replyLaunchBubble(d, rec);
        entry.text = text;
        entry.draft = text;
        entry.baseline = d.messages.filter(function (m) { return m.role === 'user' && m.text === text; }).length;
        renderDetail(true);
      }
      flushReplies();
      // The reply is durable now, so native may drop the recording; the record goes with it.
      ackVoice(voiceId).then(function () { removeReplyLaunch(localId); }, function () {});
    }, function () {
      failReplyLaunch(localId, "Couldn't keep the screenshot on this device, so the reply was not sent.", voiceId);
    });
  }

  /** Transcription failed: the typed text and screenshots go back to that reply box (now, or when the session is next opened). */
  function failReplyLaunch(localId, msg, voiceId) {
    var rec = readReplyLaunches()[localId];
    if (!rec) return;
    updateReplyLaunch(localId, { status: 'failed', error: msg });
    // The audio cannot be re-attached to a reply, and the text is being restored: native can drop the recording.
    if (voiceId || rec.voiceId) ackVoice(voiceId || rec.voiceId).catch(function () {});
    var d = openDetailFor(rec.sessionId);
    if (d) restoreFailedReplyLaunches(d);
    else showError(msg + ' Your reply text is back in that session\'s reply box.');
  }

  /** Puts failed reply launches of an open detail back in its box (prefix, screenshots) and says why. */
  function restoreFailedReplyLaunches(d) {
    var all = readReplyLaunches();
    Object.keys(all).forEach(function (k) {
      var rec = all[k];
      if (rec.sessionId !== d.sessionId || rec.status !== 'failed') return;
      d.local = d.local.filter(function (l) { return l.key !== rec.localId; });
      replyEl.value = [rec.prefix, replyEl.value.trim()].filter(Boolean).join(' ');
      replyEl.dispatchEvent(new Event('input'));
      rec.shots.forEach(function (a) { d.attachments.push({ localId: a.localId, fileName: a.fileName, objectUrl: null }); });
      if (rec.model) replyModelEl.value = rec.model;
      removeReplyLaunch(rec.localId);
      renderReplyThumbs();
      renderDetail(true);
      showError(rec.error + ' Your reply is back in the box.', 'reply');
    });
  }

  /** Reopening a session: bring back what its voice replies in flight left behind (pending bubbles, failures). */
  function reconcileReplyLaunches(d) {
    var all = readReplyLaunches();
    Object.keys(all).forEach(function (k) {
      var rec = all[k];
      if (rec.sessionId === d.sessionId && (rec.status === 'transcribing' || rec.status === 'waiting')) replyLaunchBubble(d, rec);
    });
    restoreFailedReplyLaunches(d);
  }

  // Two ways to "send" a stopped recording, both of which free the composer at
  // once and finish later (however late the transcript is):
  //   autoSend (+ launchId) = {project, prefix, attachmentIds}: launcher mic; the
  //     transcript is appended to `prefix` and a session is started.
  //   sink = {localId, store, deliver, fail} for a launch owned by the reply-row
  //     mic (stopAndSendReply) or the clarify-row mic (stopAndSendClarification);
  //     launchId is its localId. The transcript is appended to its typed prefix
  //     and sent through that composer's durable queue.
  // With neither, the transcript is inserted into the composer (hold + Insert,
  // or a recording left running after its detail was closed).
  function stopVoiceCapture(autoSend, launchId, sink) {
    if (!recording) return;
    var target = voiceTarget;
    var targetDetail = target === 'reply' ? voiceDetail : null;
    var targetClarifyKey = target === 'clarify' ? voiceClarifyKey : null;
    setRecordingUI(false, autoSend ? '' : sink ? 'Transcribing, then sending…' : 'Transcribing…');
    setMicBusy(target, true);
    if (autoSend) {
      // The launch id becomes the Start's key, so a clarification typed now waits for that Start.
      setConfirmation('Starting', 'Transcribing, then starting the session…', false, launchId);
    }
    // A send that went wrong stays in Recent as a Failed row (with the clip, when native has it) -- never back in the composer, never a toast.
    function failLaunch(msg, voiceId) {
      // A reply's or clarification's failure puts its typed text back in that box instead.
      if (sink) { sink.fail(sink.localId, msg, voiceId); return; }
      hideLaunchCard();
      updateVoiceLaunch(launchId, { status: 'failed', error: msg, voiceId: voiceId || null });
    }
    // The Starting card may already show a newer launch (this one detached, see
    // below), so only hide it while it still belongs to this launch.
    function hideLaunchCard() {
      if (clarifyStartKey === launchId) confirmationEl.classList.add('gl-hidden');
    }
    // A send never holds the composer hostage. Native saves the recording to its
    // durable outbox before it uploads, so after VOICE_STOP_DETACH_MS the launch
    // moves to the same 'waiting' state a "queued" answer gives: mic free, card
    // gone, the Recent row carries it. voiceStop keeps running; when its answer
    // comes it still starts the session at once (handledVoice stops pollVoice
    // starting it twice). Without this, a box that is down or rebooting held the
    // mic spinner (pointer-events: none) and the card for up to 90s.
    var detached = false;
    var detachTimer = (autoSend || sink) ? setTimeout(function () {
      detached = true;
      setVoiceStatus('', target);
      setMicBusy(target, false);
      if (sink) sink.store.update(sink.localId, { status: 'waiting' });
      else { updateVoiceLaunch(launchId, { status: 'waiting' }); hideLaunchCard(); }
      pollVoice();
    }, VOICE_STOP_DETACH_MS) : null;
    /** Clears this stop's busy UI, unless it detached: by then the mic may belong to a newer recording. */
    function settle() {
      clearTimeout(detachTimer);
      if (detached) return;
      setVoiceStatus('', target);
      setMicBusy(target, false);
    }
    GLBridge.call('voiceStop', { launchId: launchId }, { timeoutMs: VOICE_STOP_TIMEOUT_MS }).then(function (res) {
      settle();
      var text = res && res.text;
      var code = res && res.code;
      // mic_denied is NOT expected here -- voiceStop only ever runs after a
      // voiceStart that already succeeded, so a mid-recording permission
      // revocation is the only way this code could show up in a voiceStop
      // result, and native doesn't currently send it that way (see
      // startVoiceCapture's catch above for the actual mic_denied path).
      // Kept as a defensive no-op branch rather than removed outright, in
      // case that changes; empty_transcript is the real code native sends
      // from this call (server 422 / empty audio -- see GLWebBridge.m's
      // voiceStopWithReply:).
      if (code === 'empty_transcript' || code === 'failed') {
        var why = code === 'failed' ? res.error : "Didn't catch anything";
        if (autoSend || sink) { failLaunch(why, res.id); return; }
        showError(why + (code === 'failed' ? '' : ' — try again.'));
        if (res.id) ackVoice(res.id).catch(function () {});
        return;
      }
      if (code === 'queued') {
        // A tap-stop still means "send": the launch (snapshot + voice note id)
        // waits on disk and pollVoice starts the session once the transcript
        // exists, however late it is.
        if (autoSend) {
          updateVoiceLaunch(launchId, { voiceId: res.id, status: 'waiting' });
          hideLaunchCard();
        }
        // Same for a reply or clarification: its record waits on disk for the transcript.
        if (sink) sink.store.update(sink.localId, { voiceId: res.id, status: 'waiting' });
        // The box was unreachable. Native saved the recording and retries it
        // by itself; pollVoice() delivers the transcript once it exists.
        if (targetDetail && res.id && !sink) voiceReplyDetails[res.id] = targetDetail;
        if (targetClarifyKey && res.id && !sink) voiceClarifyKeys[res.id] = targetClarifyKey;
        pollVoice();
        return;
      }
      if (!text) {
        if (autoSend || sink) failLaunch('Transcription failed', res.id); else showError('Transcription failed.');
        return;
      }
      // A concurrent pollVoice may already have started this one.
      if (handledVoice[res.id]) return;
      handledVoice[res.id] = true;
      if (sink) {
        sink.deliver(sink.localId, text, res.id);
      } else if (autoSend) {
        // The recording stays until this Start is confirmed (flushStarts acks it).
        startSessionWith(autoSend.project, [autoSend.prefix, text].filter(Boolean).join(' '), autoSend.attachmentIds, false, autoSend.pendingIds, autoSend.autoSkill, res.id, launchId);
      } else {
        insertVoiceText(text, targetDetail, targetClarifyKey);
        ackVoice(res.id).catch(function () {});
      }
    }).catch(function (err) {
      settle();
      if (!autoSend && !sink) { showError('Transcription failed: ' + err.message); return; }
      // A timeout leaves native still working on the recording; pollVoice picks it up by launchId. Any other error means native has nothing to retry.
      if (err.message === 'timeout') {
        if (sink) sink.store.update(sink.localId, { status: 'waiting' }); else updateVoiceLaunch(launchId, { status: 'waiting' });
        pollVoice();
      } else failLaunch('Transcription failed: ' + err.message);
    });
  }

  // Voice notes the box could not transcribe yet (offline) are kept by native
  // and finish later: pick their transcripts up here, on load, on coming back
  // to the page, and every few seconds while any is still waiting. A launch's
  // transcript starts its session (native keeps the recording until that
  // Start is confirmed); a loose dictation is appended, like a live one, and
  // acknowledged so native drops the recording.
  var handledVoice = {};
  var pageStartedAt = Date.now();
  var voicePollTimer = null;
  var voiceWaitingShown = false;
  function pollVoice() {
    if (!GLBridge.isAvailable()) return;
    GLBridge.call('voicePending', {}).then(function (res) {
      var wasKnown = nativeKnowsLaunches;
      nativeKnowsLaunches = Array.isArray(res.pending);
      if (wasKnown !== nativeKnowsLaunches) rerenderRecent();
      (res.pending || []).forEach(function (r) {
        var launch = launchForVoice(r);
        if (launch && (launch.voiceId !== r.id || launch.status !== 'waiting')) updateVoiceLaunch(launch.localId, { voiceId: r.id, status: 'waiting', error: null });
        var rl = replyLaunchForVoice(r);
        if (rl && (rl.status === 'transcribing' || rl.status === 'waiting') && (rl.voiceId !== r.id || rl.status !== 'waiting')) updateReplyLaunch(rl.localId, { voiceId: r.id, status: 'waiting' });
        var cl = clarifyLaunches.forVoice(r);
        if (cl && (cl.status === 'transcribing' || cl.status === 'waiting') && (cl.voiceId !== r.id || cl.status !== 'waiting')) clarifyLaunches.update(cl.localId, { voiceId: r.id, status: 'waiting' });
      });
      res.ready.forEach(function (r) {
        if (handledVoice[r.id] || voiceOwnedByStart(r.id)) return;
        handledVoice[r.id] = true;
        var launch = launchForVoice(r);
        if (launch) {
          var snap = launch.snap;
          startSessionWith(snap.project, [snap.prefix, r.text].filter(Boolean).join(' '), snap.attachmentIds, false, snap.pendingIds, snap.autoSkill, r.id, launch.localId);
        } else if (replyLaunchForVoice(r)) {
          // Dictated for a reply: goes to that session, never to the launcher prompt.
          deliverReplyLaunch(replyLaunchForVoice(r).localId, r.text, r.id);
        } else if (clarifyLaunches.forVoice(r)) {
          // Dictated for a clarification: goes to that Start, never to the launcher prompt.
          deliverClarifyLaunch(clarifyLaunches.forVoice(r).localId, r.text, r.id);
        } else {
          insertVoiceText(r.text, voiceReplyDetails[r.id], voiceClarifyKeys[r.id]);
          delete voiceReplyDetails[r.id];
          delete voiceClarifyKeys[r.id];
          ackVoice(r.id).catch(function () {});
        }
      });
      res.failed.forEach(function (r) {
        var cl = clarifyLaunches.forVoice(r);
        if (cl) {
          if (cl.status === 'transcribing' || cl.status === 'waiting') failClarifyLaunch(cl.localId, 'Transcription failed: ' + r.error, r.id);
          return;
        }
        var rl = replyLaunchForVoice(r);
        if (rl) {
          if (rl.status === 'transcribing' || rl.status === 'waiting') failReplyLaunch(rl.localId, 'Transcription failed: ' + r.error, r.id);
          return;
        }
        var launch = launchForVoice(r);
        if (launch) {
          if (launch.status !== 'failed' || launch.error !== r.error) updateVoiceLaunch(launch.localId, { voiceId: r.id, status: 'failed', error: r.error });
          return;
        }
        if (handledVoice[r.id] || voiceOwnedByStart(r.id)) return;
        handledVoice[r.id] = true;
        showError('A saved voice note could not be transcribed: ' + r.error);
        ackVoice(r.id).catch(function () {});
      });
      // A launch from an earlier page life that native never heard of: the app died before the recording was queued. Say so loudly.
      var all = readVoiceLaunches();
      Object.keys(all).forEach(function (k) {
        var l = all[k];
        if (nativeKnowsLaunches && l.status === 'transcribing' && !l.voiceId && l.at < pageStartedAt) updateVoiceLaunch(k, { status: 'failed', error: 'The recording was not saved before the app closed' });
      });
      var allReplies = readReplyLaunches();
      Object.keys(allReplies).forEach(function (k) {
        var l = allReplies[k];
        if (nativeKnowsLaunches && l.status === 'transcribing' && !l.voiceId && l.at < pageStartedAt) failReplyLaunch(k, 'The recording was not saved before the app closed.');
      });
      var allClarify = clarifyLaunches.read();
      Object.keys(allClarify).forEach(function (k) {
        var l = allClarify[k];
        if (nativeKnowsLaunches && l.status === 'transcribing' && !l.voiceId && l.at < pageStartedAt) failClarifyLaunch(k, 'The recording was not saved before the app closed.');
      });
      if (res.waiting > 0 && !recording) {
        recordStatusEl.textContent = 'Voice note saved. It transcribes when the box is reachable.';
        voiceWaitingShown = true;
      } else if (voiceWaitingShown) {
        recordStatusEl.textContent = '';
        voiceWaitingShown = false;
      }
      if (res.waiting > 0 && !voicePollTimer) {
        voicePollTimer = setTimeout(function () { voicePollTimer = null; pollVoice(); }, 5000);
      }
    }).catch(function (err) {
      console.warn('voicePending failed: ' + err.message);
    });
  }

  // All three mics share this gesture: a tap toggles (start; while recording, stop
  // and SEND -- see stopVoiceCapture's autoSend / sink); holding the mic
  // ~450ms while recording pops Insert and Cancel targets out; releasing over
  // Insert stops the recording and just inserts the transcript into the
  // composer, over Cancel stops and discards the audio, anywhere else
  // dismisses the targets and keeps recording.
  var LONG_PRESS_MS = 450;

  function overTarget(el, x, y) {
    var r = el.getBoundingClientRect();
    // Forgiving, a thumb is not a pixel; sideways only up to half the 10px gap between the two targets.
    return x >= r.left - 5 && x <= r.right + 5 && y >= r.top - 14 && y <= r.bottom + 14;
  }

  function cancelVoiceCapture() {
    if (!recording) return;
    setRecordingUI(false, '');
    GLBridge.call('voiceCancel', {}).catch(function (err) {
      showError('Could not cancel the recording: ' + err.message);
    });
  }

  /**
   * Wires the tap + hold-drag gesture onto a mic button. Hold state is per
   * mic (closure), so the mics cannot cross-arm each other's targets.
   * opts: targetsEl/insertEl/cancelEl (the popped-out targets), canHold()
   * (is there a recording this mic may hold-control), onTap() (a plain tap).
   */
  function attachMicHold(btn, opts) {
    var holdTimer = null;
    var holdActive = false;     // the hold targets are showing for the current press
    var suppressNextClick = false;
    function endHold() {
      clearTimeout(holdTimer);
      holdTimer = null;
      holdActive = false;
      opts.targetsEl.hidden = true;
      opts.insertEl.classList.remove('armed');
      opts.cancelEl.classList.remove('armed');
    }
    btn.addEventListener('pointerdown', function (e) {
      if (!opts.canHold()) return;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(function () {
        holdTimer = null;
        if (!opts.canHold()) return;
        holdActive = true;
        opts.targetsEl.hidden = false;
        if (navigator.vibrate) { try { navigator.vibrate(10); } catch (err) { /* ignore */ } }
      }, LONG_PRESS_MS);
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    btn.addEventListener('pointermove', function (e) {
      if (!holdActive) return;
      opts.insertEl.classList.toggle('armed', overTarget(opts.insertEl, e.clientX, e.clientY));
      opts.cancelEl.classList.toggle('armed', overTarget(opts.cancelEl, e.clientX, e.clientY));
    });
    btn.addEventListener('pointerup', function (e) {
      var wasHold = holdActive;
      var insert = holdActive && overTarget(opts.insertEl, e.clientX, e.clientY);
      var cancel = holdActive && overTarget(opts.cancelEl, e.clientX, e.clientY);
      endHold();
      if (!wasHold) return; // short press: the click handler below owns it
      suppressNextClick = true; // a long press must not also fire the toggle
      if (insert) stopVoiceCapture();
      else if (cancel) cancelVoiceCapture();
    });
    btn.addEventListener('pointercancel', endHold);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('click', function () {
      if (suppressNextClick) { suppressNextClick = false; return; }
      opts.onTap();
    });
  }

  // Snapshot the composer, empty it for the next session, then stop+send.
  function stopAndSend() {
    var snapshot = { project: selectedProject, prefix: promptEl.value.trim(), attachmentIds: attachIdsForStart(), pendingIds: pendingLocalIds(), autoSkill: boxShouldPickSkill() };
    // Durable FIRST, like a typed Start: the send is a Recent row before anything is cleared or uploaded.
    var launchId = randomIdempotencyKey();
    if (!addVoiceLaunch({ localId: launchId, voiceId: null, snap: snapshot, status: 'transcribing', error: null, at: Date.now() })) {
      showError("Couldn't save the request on this device, so nothing was sent or cleared.");
      return;
    }
    rerenderRecent();
    clearDraft();
    promptEl.value = '';
    attachments.forEach(function (a) { if (a.objectUrl) { try { URL.revokeObjectURL(a.objectUrl); } catch (err) { /* ignore */ } } });
    attachments = [];
    renderAttachments();
    updateStartEnabled();
    stopVoiceCapture(snapshot, launchId);
  }

  attachMicHold(recordBtn, {
    targetsEl: document.getElementById('session-hold-targets'),
    insertEl: document.getElementById('session-insert-target'),
    cancelEl: document.getElementById('session-cancel-target'),
    canHold: function () { return recording; },
    onTap: function () {
      // A reply- or clarify-box recording whose box has gone (detail closed, card
      // moved on): stop it (its transcript goes to the prompt, see insertVoiceText),
      // never auto-send. This is the only way left to stop one.
      if (recording && voiceTarget !== 'launcher') { stopVoiceCapture(); return; }
      if (!recording) startVoiceCapture();
      else if (selectedProject === null) stopVoiceCapture();
      else stopAndSend();
    }
  });

  // Same gesture again: tap-tap sends the clarification, hold + Insert inserts, hold + Cancel discards.
  attachMicHold(clarifyRecordBtn, {
    targetsEl: document.getElementById('session-clarify-hold-targets'),
    insertEl: document.getElementById('session-clarify-insert-target'),
    cancelEl: document.getElementById('session-clarify-cancel-target'),
    canHold: function () { return recording && voiceTarget === 'clarify'; },
    onTap: function () {
      if (!recording) startVoiceCapture('clarify');
      else if (voiceTarget === 'clarify') stopAndSendClarification();
    }
  });

  // Exposed for native to call via GLWebModuleViewController's
  // -callWebFunctionIfDefined: (see that header's doc comment for the
  // typeof-guard convention) — this is how overland://session/voice and
  // /text pick a mode after the page has already loaded, cold or warm
  // launch alike.
  window.startVoiceMode = function () {
    voiceModeCalledAt = performance.now();
    startVoiceCapture();
  };

  // Native-launched voice (share sheet, lock-screen Control) timing: how long
  // the page had been alive when native asked for voice, and how long native
  // took to get the mic live. Queued in localStorage so an offline launch still
  // reports once the box is reachable (lines show in assistant-location's log).
  var voiceModeCalledAt = null;
  var VOICE_TIMING_KEY = 'gl-session-voice-timing-v1';
  function readVoiceTiming() {
    try { return JSON.parse(localStorage.getItem(VOICE_TIMING_KEY) || '[]'); } catch (e) { return []; }
  }
  function logVoiceTiming(line) {
    var q = readVoiceTiming();
    q.push(new Date().toISOString() + ' ' + line);
    try { localStorage.setItem(VOICE_TIMING_KEY, JSON.stringify(q.slice(-20))); } catch (e) { /* storage full: this line is lost */ }
    flushVoiceTiming();
  }
  var voiceTimingFlushing = false;
  function flushVoiceTiming() {
    var q = readVoiceTiming();
    if (!q.length || voiceTimingFlushing || !apiBase()) return;
    voiceTimingFlushing = true;
    fetch(apiBase() + '/debug-log?msg=' + encodeURIComponent('session-voice: ' + q[0])).then(function (res) {
      voiceTimingFlushing = false;
      if (!res.ok) return;
      var rest = readVoiceTiming();
      if (rest[0] === q[0]) rest.shift();
      try { localStorage.setItem(VOICE_TIMING_KEY, JSON.stringify(rest)); } catch (e) { /* retried next flush */ }
      flushVoiceTiming();
    }, function () { voiceTimingFlushing = false; });
  }
  flushVoiceTiming();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) flushVoiceTiming(); });
  window.focusTextMode = function () {
    promptEl.focus();
  };

  // --- attachments (screenshots) ------------------------------------------
  // Each pick uploads immediately. A Start tapped while an upload is still in
  // flight (or offline) carries the attachment into the queued Start, which
  // awaits that same upload (inflightUploads) rather than uploading twice.

  // --- inbox quick-select strip -------------------------------------------
  // Fetches the 8 most-recent images from the drop inbox and renders them as
  // tappable thumbnails above the Start button. Tapping claims the image as an
  // attachment (POST /sessions/inbox-claim/<name>); a second tap removes it.
  // Thumbnails are fetched via authedFetch (same pattern as fetchThumbnail --
  // <img src> can't carry Authorization headers).

  var inboxStripEl = document.getElementById('session-inbox-strip');
  // {name -> {cell, claimedId|null}} -- tracks which inbox items are selected
  var inboxSelected = {};
  // {name -> cell} for the cells now in the strip. A refresh reuses the cell of
  // an image still among the newest 8, so its loaded thumbnail and its
  // selection survive; rebuilding from scratch would drop a pick mid-compose.
  var inboxCells = {};

  // Runs on load and again every time the page becomes visible. The tab's web
  // view stays alive in the background between visits, so a one-time fetch
  // shows screenshots from whenever the app was first opened.
  // Inside the app the strip shows the Photos library's 8 newest images via
  // the native bridge (recentPhotos / photoData). A plain browser, or a native
  // build that predates those methods ("unknown method"), falls back to the
  // server inbox. A real bridge error (e.g. Photos access denied) is logged,
  // never papered over with the inbox.
  var inboxFolderMode = !GLBridge.isAvailable();
  function loadInboxStrip() {
    if (inboxFolderMode) { loadInboxFolderStrip(); return; }
    GLBridge.call('recentPhotos', { limit: 8 }, { timeoutMs: 60000 }).then(function (res) {
      if (!res || !Array.isArray(res.photos)) throw new Error('recentPhotos: bad reply');
      var ids = res.photos.map(function (p) { return p.id; });
      Object.keys(inboxCells).forEach(function (id) {
        if (ids.indexOf(id) !== -1) return;
        inboxCells[id].remove();
        delete inboxCells[id];
        delete inboxSelected[id];
      });
      res.photos.forEach(function (photo) {
        inboxStripEl.appendChild(inboxCells[photo.id] || buildPhotoCell(photo));
      });
    }).catch(function (err) {
      if (String(err && err.message).indexOf('unknown method') !== -1) {
        inboxFolderMode = true;
        loadInboxFolderStrip();
        return;
      }
      console.error('camera roll strip:', err);
    });
  }

  // One tappable camera-roll thumbnail. Tap fetches the full image from
  // native and adds it through addAttachment, the same path as the picker.
  function buildPhotoCell(photo) {
    var cell = document.createElement('div');
    cell.className = 'gl-inbox-cell';
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', photo.id);
    var img = document.createElement('img');
    img.src = 'data:image/jpeg;base64,' + photo.thumb;
    img.alt = '';
    cell.appendChild(img);
    var check = document.createElement('div');
    check.className = 'gl-inbox-cell-check';
    check.textContent = '\u2713';
    cell.appendChild(check);
    inboxCells[photo.id] = cell;

    cell.addEventListener('click', function () {
      var state = inboxSelected[photo.id];
      if (state && state.entry) {
        removeAttachment(state.entry.localId);
        delete inboxSelected[photo.id];
        cell.classList.remove('selected');
        return;
      }
      if (state && state.pending) return;
      if (attachments.length >= MAX_ATTACHMENTS) {
        showError('Up to ' + MAX_ATTACHMENTS + ' screenshots.');
        return;
      }
      inboxSelected[photo.id] = { pending: true, entry: null };
      GLBridge.call('photoData', { id: photo.id }, { timeoutMs: 60000 }).then(function (res) {
        if (!res || typeof res.data !== 'string') throw new Error('photoData: bad reply');
        var bin = atob(res.data);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var file = new File([bytes], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' });
        inboxSelected[photo.id] = { pending: false, entry: addAttachment(file) };
        cell.classList.add('selected');
        saveDraft();
      }).catch(function (err) {
        delete inboxSelected[photo.id];
        console.error('camera roll photo:', err);
        showError("Couldn't load that photo: " + err.message);
      });
    });
    return cell;
  }

  function loadInboxFolderStrip() {
    authedFetch('/sessions/inbox-recents').then(function (res) {
      if (!res.ok) return;
      return res.json();
    }).then(function (data) {
      if (!data || !Array.isArray(data.recents)) return;
      var names = data.recents.map(function (item) { return item.name; });
      Object.keys(inboxCells).forEach(function (name) {
        if (names.indexOf(name) !== -1) return;
        var oldImg = inboxCells[name].querySelector('img');
        if (oldImg) URL.revokeObjectURL(oldImg.src);
        inboxCells[name].remove();
        delete inboxCells[name];
        // An attachment already claimed from this cell stays attached; only
        // the strip's tracking of it goes.
        delete inboxSelected[name];
      });
      // appendChild moves a kept cell rather than copying it, so this loop
      // also puts kept cells into the server's newest-first order.
      data.recents.forEach(function (item) {
        inboxStripEl.appendChild(inboxCells[item.name] || buildInboxCell(item));
      });
    }).catch(function () { /* inbox strip is a nice-to-have; silent fail */ });
  }

  // One tappable thumbnail for an inbox image; registered in inboxCells.
  function buildInboxCell(item) {
    var cell = document.createElement('div');
    cell.className = 'gl-inbox-cell';
    cell.setAttribute('role', 'button');
    cell.setAttribute('aria-label', item.name);

    var loading = document.createElement('div');
    loading.className = 'gl-inbox-cell-loading';
    loading.textContent = '\u22ef';
    cell.appendChild(loading);

    var check = document.createElement('div');
    check.className = 'gl-inbox-cell-check';
    check.textContent = '\u2713';
    cell.appendChild(check);

    inboxCells[item.name] = cell;

    // Fetch thumbnail bytes and wrap in objectURL (same pattern as fetchThumbnail)
    authedFetch('/sessions/inbox-image/' + encodeURIComponent(item.name)).then(function (r) {
      if (!r.ok) return;
      return r.blob();
    }).then(function (blob) {
      if (!blob) return;
      var img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      img.alt = item.name;
      cell.replaceChild(img, loading);
    }).catch(function () { /* leave loading placeholder */ });

    cell.addEventListener('click', function () {
      var state = inboxSelected[item.name];
      if (state && state.claimedId) {
        // Already claimed -- remove the attachment and deselect
        removeAttachment('server-' + state.claimedId);
        delete inboxSelected[item.name];
        cell.classList.remove('selected');
        return;
      }
      if (state && state.pending) return; // claim in flight, ignore double-tap
      inboxSelected[item.name] = { cell: cell, pending: true, claimedId: null };
      authedFetch('/sessions/inbox-claim/' + encodeURIComponent(item.name), { method: 'POST' }).then(function (r) {
        return r.json();
      }).then(function (body) {
        if (!body || !body.id) {
          delete inboxSelected[item.name];
          return;
        }
        inboxSelected[item.name] = { cell: cell, pending: false, claimedId: body.id };
        cell.classList.add('selected');
        addServerAttachment(body.id);
        updateStartEnabled();
        saveDraft();
      }).catch(function () {
        delete inboxSelected[item.name];
      });
    });
    return cell;
  }

  loadInboxStrip();
  // WKWebView fires visibilitychange both when the app comes to the
  // foreground and when this tab's view goes back on screen.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadInboxStrip();
  });
  // A screenshot taken just before opening the launcher is usually still
  // uploading when the page is shown, so the strip keeps refetching while the
  // launcher is on screen (not in a session's detail view, which hides the
  // strip). The interval is a guess: a 2 MB phone screenshot reached /drop
  // about 5 s after capture in the box's logs, and the request is a local
  // directory listing. Hidden web views don't run it at all.
  var INBOX_POLL_MS = 4000;
  setInterval(function () {
    if (inboxFolderMode && !document.hidden && !detail) loadInboxStrip();
  }, INBOX_POLL_MS);


  function renderAttachments() {
    thumbRowEl.innerHTML = '';
    attachments.forEach(function (entry) {
      var wrap = document.createElement('div');
      wrap.className = 'gl-thumb ' + entry.status;

      // Everything that should be corner-rounded/clipped (the image itself,
      // and the uploading/failed overlay painted on top of it) lives in this
      // inner box -- the remove badge below is a SIBLING, not a child, of
      // it, so the clip never cuts the badge off (see .gl-thumb's CSS
      // comment for the crop that caught this).
      var clip = document.createElement('div');
      clip.className = 'gl-thumb-clip';
      if (entry.objectUrl) {
        var img = document.createElement('img');
        img.src = entry.objectUrl;
        img.alt = entry.fileName || 'attached screenshot';
        clip.appendChild(img);
      } else {
        // A draft-restored (or deep-link-added, see window.addAttachments)
        // attachment has no blob to preview -- a generic placeholder beats a
        // blank tile. objectUrlFailed (set by fetchThumbnail's catch) is the
        // SAME case visually: the fetch-for-thumbnail attempt failed, so
        // there's still nothing to show but the id is still real/usable.
        var placeholder = document.createElement('div');
        placeholder.className = 'gl-thumb-placeholder';
        placeholder.textContent = '🖼'; // 🖼
        clip.appendChild(placeholder);
      }
      if (entry.status === 'uploading') {
        var uploading = document.createElement('div');
        uploading.className = 'gl-thumb-status';
        uploading.textContent = 'Uploading…';
        clip.appendChild(uploading);
      } else if (entry.status === 'pending') {
        var waiting = document.createElement('div');
        waiting.className = 'gl-thumb-status';
        waiting.textContent = 'Waiting for signal';
        clip.appendChild(waiting);
      } else if (entry.status === 'failed') {
        // The whole overlay is the retry tap target (not a separate tiny
        // button) -- easiest one-handed target on a thumbnail this small,
        // and it can never be "silently dropped": it stays visibly failed
        // until retried or removed.
        var failedBtn = document.createElement('button');
        failedBtn.type = 'button';
        failedBtn.className = 'gl-thumb-status';
        failedBtn.textContent = 'Failed — tap to retry';
        failedBtn.addEventListener('click', function () { uploadAttachment(entry); });
        clip.appendChild(failedBtn);
      }
      wrap.appendChild(clip);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'gl-thumb-remove';
      removeBtn.setAttribute('aria-label', 'Remove screenshot');
      var glyph = document.createElement('span');
      glyph.className = 'gl-thumb-remove-glyph';
      glyph.textContent = '×';
      removeBtn.appendChild(glyph);
      removeBtn.addEventListener('click', function () { removeAttachment(entry.localId); });
      wrap.appendChild(removeBtn);

      thumbRowEl.appendChild(wrap);
    });
    attachBtn.disabled = attachments.length >= MAX_ATTACHMENTS;
  }

  // IndexedDB holds the blob of every attachment not yet on the server, keyed
  // by localId, so it survives closing the app. Errors surface loudly.
  var IDB_NAME = 'gl-session-attachments';
  function idbRun(mode, fn) {
    return new Promise(function (resolve, reject) {
      var open = indexedDB.open(IDB_NAME, 1);
      open.onupgradeneeded = function () { open.result.createObjectStore('blobs'); };
      open.onerror = function () { reject(open.error); };
      open.onsuccess = function () {
        var db = open.result;
        var tx = db.transaction('blobs', mode);
        var req = fn(tx.objectStore('blobs'));
        tx.oncomplete = function () { db.close(); resolve(req && req.result); };
        tx.onerror = function () { db.close(); reject(tx.error); };
      };
    });
  }
  function idbPut(localId, file) { return idbRun('readwrite', function (st) { return st.put(file, localId); }); }
  function idbGet(localId) { return idbRun('readonly', function (st) { return st.get(localId); }); }
  function idbDelete(localId) { return idbRun('readwrite', function (st) { return st.delete(localId); }); }
  // localId -> the in-flight idbPut for that blob. A Start must not be queued
  // until every pending attachment it carries is on disk (see startSession).
  var storedWrites = {};
  function idbLoud(promise) {
    promise.catch(function (err) { showError("Couldn't keep the screenshot on this device: " + err.message); });
  }

  /** POSTs one image; resolves {ok, status, json}, rejects on a network failure. */
  function uploadFile(file) {
    return authedFetch('/sessions/upload', {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/octet-stream' },
      body: file,
      timeoutMs: UPLOAD_TIMEOUT_MS,
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        return { ok: res.ok, status: res.status, json: json };
      });
    });
  }

  // localId -> the in-flight (or finished-ok) upload promise, so a queued Start
  // that carries this attachment awaits it instead of re-uploading from
  // IndexedDB. Cleared on a network failure so the next retry uploads afresh.
  var inflightUploads = {};

  function uploadAttachment(entry) {
    if (navigator.onLine === false) { markPending(entry); return; }
    entry.status = 'uploading';
    renderAttachments();
    updateStartEnabled();
    var upload = uploadFile(entry.file);
    inflightUploads[entry.localId] = upload;
    upload.then(function (result) {
      // A late-finishing upload for an attachment removed while in flight
      // (× tapped mid-upload) is harmless with no guard needed here: mutating
      // `entry`'s status/id below only matters if `entry` is still reachable
      // from the `attachments` array, and removeAttachment() already
      // spliced it out -- renderAttachments()/updateStartEnabled()/
      // saveDraft() all read the CURRENT `attachments` array, never this
      // closure's `entry` reference directly, so an orphaned entry mutating
      // itself renders nothing and enables nothing. (Proved by the "removing
      // an in-flight thumbnail" test in session.test.mjs, which passes
      // identically with or without an indexOf guard here -- a prior
      // revision had one and it was dead code.)
      if (!result.ok || !result.json || !result.json.id) {
        entry.status = 'failed';
        renderAttachments();
        updateStartEnabled();
        return;
      }
      entry.id = result.json.id;
      entry.status = 'done';
      renderAttachments();
      updateStartEnabled();
      saveDraft();
      // On the server now; the blob is only needed while there is no id. If
      // Start already took this attachment, the queued Start owns the blob
      // (flushStarts deletes it once the start resolves).
      if (attachments.indexOf(entry) !== -1) idbLoud(idbDelete(entry.localId));
    }, function () {
      // Network failure: not a rejection. Keep the blob, upload when back.
      delete inflightUploads[entry.localId];
      markPending(entry);
    });
  }

  function markPending(entry) {
    entry.status = 'pending';
    renderAttachments();
    updateStartEnabled();
    saveDraft();
    scheduleQueueRetry();
  }

  function retryPendingAttachments() {
    attachments.forEach(function (a) { if (a.status === 'pending' && a.file) uploadAttachment(a); });
  }

  function addAttachment(file) {
    var entry = {
      localId: 'local-' + randomIdempotencyKey(),
      id: null,
      status: 'uploading',
      fileName: file.name,
      objectUrl: null,
      file: file,
    };
    try { entry.objectUrl = URL.createObjectURL(file); } catch (e) { /* preview is best-effort only */ }
    attachments.push(entry);
    renderAttachments();
    updateStartEnabled();
    storedWrites[entry.localId] = idbPut(entry.localId, file);
    idbLoud(storedWrites[entry.localId]);
    // Persist the draft once the blob is on disk so a reload mid-upload
    // restores it (idbLoud already reported a failed write).
    storedWrites[entry.localId].then(saveDraft, function () {});
    uploadAttachment(entry);
    return entry;
  }

  var sharedFileCount = 0;
  /**
   * Native entry point (SessionsViewController, from the share extension's
   * keychain handoff): files = [{type: 'image/jpeg', data: '<base64>'}].
   * Each goes through addAttachment, so it uploads now or waits as pending.
   */
  window.addAttachmentFiles = function (files) {
    if (!Array.isArray(files)) return;
    var room = MAX_ATTACHMENTS - attachments.length;
    var toAdd = files.slice(0, Math.max(room, 0));
    toAdd.forEach(function (f) {
      var bin = atob(f.data);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      sharedFileCount++;
      var ext = f.type === 'image/png' ? 'png' : 'jpg';
      addAttachment(new File([bytes], 'shared-' + sharedFileCount + '.' + ext, { type: f.type }));
    });
    if (files.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (files.length - toAdd.length) + ' skipped.');
    }
    updateStartEnabled();
    saveDraft();
  };

  /** Re-adds attachments picked offline in an earlier launch, from their IndexedDB blobs. */
  function restorePendingAttachments(localIds) {
    localIds.forEach(function (localId) {
      idbGet(localId).then(function (file) {
        if (!file) throw new Error('screenshot ' + localId + ' is missing from device storage');
        var entry = { localId: localId, id: null, status: 'pending', fileName: file.name, objectUrl: null, file: file };
        try { entry.objectUrl = URL.createObjectURL(file); } catch (e) { /* preview is best-effort only */ }
        attachments.push(entry);
        renderAttachments();
        updateStartEnabled();
        uploadAttachment(entry);
      }).catch(function (err) { showError("Couldn't restore a screenshot: " + err.message); });
    });
  }

  function removeAttachment(localId) {
    var idx = -1;
    for (var i = 0; i < attachments.length; i++) {
      if (attachments[i].localId === localId) { idx = i; break; }
    }
    if (idx === -1) return;
    var entry = attachments[idx];
    if (entry.objectUrl) { try { URL.revokeObjectURL(entry.objectUrl); } catch (e) { /* ignore */ } }
    attachments.splice(idx, 1);
    if (!entry.id) idbLoud(idbDelete(localId));
    renderAttachments();
    updateStartEnabled();
    saveDraft();
  }

  /**
   * Best-effort fetches an already-uploaded attachment's bytes as a thumbnail
   * preview -- GET /sessions/upload/<id> needs the Authorization header, so
   * this can't just be an <img src="..."> (no way to attach a header to an
   * image-tag fetch); fetch -> blob -> objectURL is the standard workaround.
   * Falls back to the placeholder icon (renderAttachments' objectUrl-null
   * branch) on any failure -- a thumbnail that never loads is cosmetic, the
   * entry's id/status are untouched either way and it still counts toward
   * Start normally.
   */
  function fetchThumbnail(entry) {
    authedFetch('/sessions/upload/' + encodeURIComponent(entry.id)).then(function (res) {
      if (!res.ok) return Promise.reject(new Error('HTTP ' + res.status));
      return res.blob();
    }).then(function (blob) {
      // entry may since have been removeAttachment()'d -- harmless either
      // way, same reasoning as uploadAttachment's late-finish comment above:
      // renderAttachments() only ever paints the CURRENT attachments array.
      try { entry.objectUrl = URL.createObjectURL(blob); } catch (e) { /* stays a placeholder */ }
      renderAttachments();
    }).catch(function () { /* stays a placeholder -- see header comment */ });
  }

  /** Adds an id the server already has as a `done` attachment (never re-uploads), then best-effort fetches its thumbnail. Shared by draft restore and window.addAttachments below. */
  function addServerAttachment(id) {
    // Load-bearing: the draft restore runs only once /sessions/projects
    // answers, and on a share-sheet cold launch native's addAttachments runs
    // first and saves this id into the draft -- so the restore re-adds it.
    // The dedupe lives here so both callers get it, whatever the order.
    var existing = attachments.find(function (a) { return a.id === id; });
    if (existing) return existing;
    var entry = { localId: 'server-' + id, id: id, status: 'done', fileName: null, objectUrl: null, file: null };
    attachments.push(entry);
    renderAttachments();
    fetchThumbnail(entry);
    return entry;
  }

  /** Draft restore: each id is shown as an already-`done` attachment (see addServerAttachment). */
  function restoreAttachments(ids) {
    ids.forEach(addServerAttachment);
  }

  // `<uuid>.<ext>` for exactly the extensions the server ever actually
  // issues (saveUpload's sniffImageType never emits "jpeg", only "jpg" --
  // see lib/sessions.mjs) -- matches server.mjs's UPLOAD_ID_RE except that
  // it also accepts "jpeg" for validating ids that came from elsewhere; this
  // is strictly the set of ids a real /sessions/upload response can contain.
  var ATTACH_ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|gif|webp)$/i;

  // Called by native (GLWebModuleViewController's -callWebFunctionIfDefined:,
  // same typeof-guard convention as startVoiceMode/focusTextMode above) AFTER
  // the mode function, on a cold or warm launch from
  // overland://session/text?attach=<id1>,<id2> -- the share extension has
  // already uploaded these via POST /sessions/upload before opening this
  // URL, so this just wires the already-issued ids into the page the same
  // way a draft restore does. Invalid ids are dropped silently (never sent
  // on to the server, which would 400 the whole Start on one bad one); the
  // 5-cap and its "N skipped" message are shared with the manual picker.
  window.addAttachments = function (ids) {
    if (!Array.isArray(ids)) return;
    // Dedupe against ids ALREADY present (any status -- an id the page
    // already knows about in any form counts) -- native can call this again
    // after a page reload from the same deep link (e.g. the WKWebView
    // relaunches mid-flow), and a draft restore may already have re-added
    // these same ids before native's call runs. Without this, the exact
    // same screenshot shows up as two separate thumbnails and gets sent to
    // /sessions/start twice in the same `attachments` array.
    var existingIds = attachments.map(function (a) { return a.id; });
    var valid = ids.filter(function (id) {
      return typeof id === 'string' && ATTACH_ID_RE.test(id) && existingIds.indexOf(id) === -1;
    });
    var room = MAX_ATTACHMENTS - attachments.length;
    var toAdd = valid.slice(0, Math.max(room, 0));
    toAdd.forEach(addServerAttachment);
    if (valid.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (valid.length - toAdd.length) + ' skipped.');
    }
    updateStartEnabled();
    saveDraft();
  };

  attachBtn.addEventListener('click', function () { attachInput.click(); });

  attachInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(attachInput.files || []);
    attachInput.value = ''; // clears the input so picking the SAME file again still fires 'change'
    var room = MAX_ATTACHMENTS - attachments.length;
    var toAdd = files.slice(0, Math.max(room, 0));
    // Each pick is independent -- two copies of the same photo become two
    // separate attachments with their own upload/id, and removing one never
    // touches the other (they don't share any state beyond the File object
    // each holds its own reference to).
    toAdd.forEach(addAttachment);
    if (files.length > toAdd.length) {
      showError('Up to ' + MAX_ATTACHMENTS + ' screenshots — ' + (files.length - toAdd.length) + ' skipped.');
    }
  });

  // --- start session -------------------------------------------------------

  // Optimistic commit (see MODULES.md's "web-backed tabs are optimistic"
  // contract): the tap itself is treated as the event that starts the
  // session, not the server's response. The form clears and the
  // confirmation shows BEFORE the network round-trip resolves, so Oliver can
  // queue up a second Start immediately instead of watching a disabled
  // button say "Starting…" -- the exact wait this task exists to remove.
  // `starting` no longer gates the button (removed from updateStartEnabled
  // below); the button re-disables itself naturally once hasStartableContent()
  // goes false from the optimistic clear, and re-enables the instant new
  // content is typed.
  var startAwaitingWrites = false;
  function startSession() {
    if (startAwaitingWrites) return;
    var project = selectedProject, text = promptEl.value.trim(), ids = attachIdsForStart(), pending = pendingLocalIds();
    var autoSkill = boxShouldPickSkill();
    var writes = pending.map(function (id) { return storedWrites[id]; }).filter(Boolean);
    if (!writes.length) { startSessionWith(project, text, ids, true, pending, autoSkill); return; }
    // The blob must be durable before the request that depends on it is.
    startAwaitingWrites = true;
    Promise.all(writes).then(function () {
      startAwaitingWrites = false;
      startSessionWith(project, text, ids, true, pending, autoSkill);
    }, function (err) {
      startAwaitingWrites = false;
      showError("Couldn't keep the screenshot on this device, so nothing was started: " + err.message);
    });
  }

  // clearComposer=false is the voice auto-send path: the composer was already
  // emptied at stop and may hold a NEW draft by now, which must survive.
  // autoSkill=true asks the box to double-check the skill (from the text, else the screenshot) because it was not picked by hand.
  // voiceId/launchId: the recording this Start came from (kept by native until the Start is confirmed) and the launch row it replaces.
  // answersKey: the box's "asked" submission this Start answers; the box retires that row and dedupes repeat answers.
  function startSessionWith(project, promptText, attachmentIds, clearComposer, pendingIds, autoSkill, voiceId, launchId, answersKey) {
    pendingIds = pendingIds || [];
    // project === null means nothing chosen yet -- '' (None) is a real,
    // startable choice (see updateStartEnabled's comment on this contract).
    if (project === null || (!promptText && !attachmentIds.length && !pendingIds.length)) return;
    // A voice send cancelled while it was transcribing: its launch row is gone, so nothing starts.
    if (launchId && !readVoiceLaunches()[launchId]) {
      if (voiceId) ackVoice(voiceId).catch(function (err) { showError("Couldn't delete the recording: " + err.message); });
      return;
    }

    // Every attempt owns its own idempotency key and carries it in the
    // persisted queue entry, so a replay after a reload re-sends the SAME key
    // (the server dedupes on it) instead of spawning a second session. A voice
    // send reuses its launch id, which clarifications typed while it was
    // transcribing are already addressed to.
    var key = launchId || randomIdempotencyKey();

    // model is always sent; effort is omitted entirely when "Default" is
    // selected (empty <option value="">) -- the server infers its own
    // default from an absent field, never from an empty string.
    var requestBody = { project: project, prompt: promptText, attachments: attachmentIds, idempotencyKey: key, model: modelSelectEl.value };
    if (effortSelectEl.value) requestBody.effort = effortSelectEl.value;
    if (autoSkill) requestBody.autoSkill = true;
    if (answersKey) requestBody.answers = answersKey;

    // Durable FIRST: the request is on disk before anything is cleared or
    // sent, so what Oliver typed can never exist only in memory. If the
    // write fails nothing is cleared.
    var queued = { key: key, queuedAt: Date.now(), body: requestBody, pending: pendingIds.map(function (id) { return { localId: id, id: null }; }) };
    if (voiceId) queued.voiceId = voiceId;
    if (!enqueue(PENDING_STARTS_KEY, queued)) {
      showError("Couldn't save the request on this device, so nothing was sent or cleared.");
      return;
    }
    // Visible in Recent from this instant, before the box has answered (the Start row replaces the launch row).
    if (launchId) removeVoiceLaunch(launchId); else rerenderRecent();

    clearError();
    setConfirmation('Starting', autoSkill ? 'Starting — checking which skill fits…' : 'Starting' + (project ? ' in ' + project : '') + '…', false, key);
    // The queue entry is the durable copy from here on; a rejection restores
    // the prompt and attachments from it (see onStartRejected).
    if (clearComposer) {
      lastClearedPrompt = promptText ? { text: promptText, at: Date.now() } : null; // see stripDictationEcho
      clearDraft();
      promptEl.value = '';
      attachments.forEach(function (a) { if (a.objectUrl) { try { URL.revokeObjectURL(a.objectUrl); } catch (e) { /* ignore */ } } });
      attachments = [];
      renderAttachments();
      updateStartEnabled();
    }
    flushStarts();
  }

  // --- offline queues: Start and Reply are saved first, replayed until the
  // box answers. Policy: a network failure keeps the entry and retries
  // automatically (load, 'online', coming back to the page, a timer); an HTTP
  // 4xx/5xx is a real answer, the entry is dropped and the user is told.

  var PENDING_STARTS_KEY = 'gl-session-pending-starts-v1';
  var PENDING_REPLIES_KEY = 'gl-session-pending-replies-v1';
  var PENDING_CLARIFY_KEY = 'gl-session-pending-clarify-v1';
  var QUEUE_RETRY_MS = 15000;

  function readQueue(storageKey) {
    try {
      var parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }
  function writeQueue(storageKey, queue) {
    try {
      if (queue.length) localStorage.setItem(storageKey, JSON.stringify(queue));
      else localStorage.removeItem(storageKey);
      return true;
    } catch (e) {
      return false;
    }
  }
  /** Returns false when the write failed, so the caller can refuse to clear its UI. */
  function enqueue(storageKey, item) {
    var queue = readQueue(storageKey);
    queue.push(item);
    return writeQueue(storageKey, queue);
  }
  function dequeue(storageKey, key) {
    writeQueue(storageKey, readQueue(storageKey).filter(function (e) { return e.key !== key; }));
  }

  var queueTimer = null;
  function scheduleQueueRetry() {
    if (queueTimer) return;
    queueTimer = setTimeout(function () { queueTimer = null; flushQueues(); }, QUEUE_RETRY_MS);
  }
  function flushQueues() {
    retryPendingAttachments();
    flushStarts();
    flushReplies();
    flushClarifications();
  }

  function postJson(path, body, timeoutMs) {
    return authedFetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      timeoutMs: timeoutMs,
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (json) {
        return { ok: res.ok, status: res.status, json: json };
      });
    });
  }

  var flushingStarts = false;

  // Uploads a queued Start's or Reply's not-yet-uploaded screenshots (blobs
  // from IndexedDB), recording each server id in the saved entry (in the
  // queue under storageKey) so a retry never re-uploads it. Resolves
  // {ok:true} or {ok:false, status, json} for a 4xx on upload; rejects on a
  // network failure.
  function uploadQueuedAttachments(entry, storageKey) {
    return (entry.pending || []).reduce(function (chain, item) {
      return chain.then(function (state) {
        if (!state.ok || item.id) return state;
        // An upload for this attachment may still be in flight from the
        // composer: await that same request (it rejects on a network failure
        // and is then cleared, so the next retry uploads from IndexedDB).
        var inflight = inflightUploads[item.localId];
        return (inflight || idbGet(item.localId).then(function (file) {
          if (!file) return { ok: false, status: 0, json: { error: 'a screenshot is missing from device storage' } };
          return uploadFile(file);
        })).then(function (result) {
          if (!result.ok || !result.json || !result.json.id) return { ok: false, status: result.status, json: result.json };
          item.id = result.json.id;
          var queue = readQueue(storageKey);
          queue.forEach(function (q) { if (q.key === entry.key) q.pending = entry.pending; });
          writeQueue(storageKey, queue);
          return state;
        });
      });
    }, Promise.resolve({ ok: true }));
  }

  function flushStarts() {
    if (flushingStarts) return;
    var entry = readQueue(PENDING_STARTS_KEY).filter(function (e) { return !e.failed; })[0]; // a failed one waits for Retry/Discard
    if (!entry) return;
    flushingStarts = true;
    uploadQueuedAttachments(entry, PENDING_STARTS_KEY).then(function (up) {
      if (!up.ok) return up;
      entry.body.attachments = (entry.body.attachments || []).concat((entry.pending || []).map(function (p) { return p.id; }));
      return postJson('/sessions/start', entry.body, SPAWN_TIMEOUT_MS);
    }).then(function (result) {
      flushingStarts = false;
      if (!result.ok && isTransientStatus(result.status)) {
        // The box is struggling, not refusing: keep the request and try again. It answered, so the retry gets a new key (see rekeyStart).
        startsOffline = true;
        rekeyStart(entry);
        showError('Box error (HTTP ' + result.status + '). Your request is saved and retries automatically.', 'start-queue');
        scheduleQueueRetry();
        return;
      }
      startsOffline = false;
      clearError('start-queue');
      if (!result.ok) { onStartRejected(entry, result); flushStarts(); return; }
      dequeue(PENDING_STARTS_KEY, entry.key);
      (entry.pending || []).forEach(function (p) { idbLoud(idbDelete(p.localId)); });
      // The box has the request: only now may the recording go.
      if (entry.voiceId) ackVoice(entry.voiceId).catch(function (err) { console.warn('voiceAck failed: ' + err.message); });
      if (result.json.askSkill) onAskSkill(entry, result.json.askSkill);
      else onStartSucceeded(result.json, entry.key);
      flushStarts();
      flushClarifications();
    }, function (err) {
      // Network-level failure: the entry stays saved and is retried.
      flushingStarts = false;
      startsOffline = true;
      rerenderRecent();
      showError('Box unreachable: ' + err.message + '. Your request is saved and starts automatically when the box is back.', 'start-queue');
      scheduleQueueRetry();
    });
  }

  function isTransientStatus(status) { return status >= 500 || status === 429 || status === 408; }

  /**
   * A retry after the box ANSWERED (not a network failure) needs a new
   * idempotency key: the box records every Start answer under its key and
   * replays it, so the old key would only ever return the same failure. The
   * old key's "Not started" row is retired on the box. Returns the new key.
   */
  function rekeyStart(entry) {
    var oldKey = entry.key;
    var newKey = randomIdempotencyKey();
    var queue = readQueue(PENDING_STARTS_KEY);
    queue.forEach(function (q) {
      if (q.key !== oldKey) return;
      q.key = newKey;
      q.body.idempotencyKey = newKey;
      delete q.failed;
    });
    writeQueue(PENDING_STARTS_KEY, queue);
    var clarifications = readQueue(PENDING_CLARIFY_KEY);
    clarifications.forEach(function (c) { if (c.startKey === oldKey) c.startKey = newKey; });
    writeQueue(PENDING_CLARIFY_KEY, clarifications);
    // Clarifications still being transcribed follow the Start too, or they would be sent to a key the box has dismissed.
    var inFlight = clarifyLaunches.read();
    Object.keys(inFlight).forEach(function (k) { if (inFlight[k].startKey === oldKey) inFlight[k].startKey = newKey; });
    clarifyLaunches.write(inFlight);
    if (voiceClarifyKey === oldKey) voiceClarifyKey = newKey;
    if (clarifyStartKey === oldKey) clarifyStartKey = newKey;
    rerenderRecent();
    postJson('/sessions/submissions/' + encodeURIComponent(oldKey) + '/dismiss', {}).then(loadRecent, function () {});
    return newKey;
  }

  function onStartSucceeded(json, startKey) {
    var how = json.skillSource === 'text' ? 'Skill picked from what you said'
      : json.skillSource === 'screenshot' ? 'Skill picked from the screenshot' : '';
    // Only the card's own Start keeps it; an older Start finishing late must
    // not take over the card from a newer one.
    if (clarifyStartKey && clarifyStartKey !== startKey) { loadRecent(); return; }
    setConfirmation('Started · ' + (json.project ? '/' + json.project : 'no skill'),
      (how ? how + '\n' : '') + json.name + ' (' + json.id + ')', true, startKey);
    confirmationEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    resetSuggestState();
    loadRecent();
  }

  /**
   * One button per candidate skill, an "Other skill…" dropdown of every other
   * known skill (the model's top few are often all wrong), then "No skill" and
   * "Put back"; pick(project) gets a skill name, '' for none, null for put back.
   */
  function askChips(candidates, pick) {
    var chips = candidates.map(function (name) { return { label: '/' + name, project: name }; })
      .concat([{ label: 'No skill', project: '' }, { label: 'Put back', project: null }])
      .map(function (c) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = c.label;
        b.addEventListener('click', function (ev) { ev.stopPropagation(); pick(c.project); });
        return b;
      });
    var others = allProjects.filter(function (name) { return candidates.indexOf(name) === -1; });
    // allProjects is empty until /sessions/projects has answered once; an
    // empty dropdown would only be a dead control, so it is left out.
    if (!others.length) return chips;
    var sel = document.createElement('select');
    sel.className = 'gl-ask-other';
    // The placeholder keeps the select's value '' until a real pick, so
    // 'change' fires only for a skill (re-picking the placeholder is impossible: disabled).
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = 'Other skill…';
    placeholder.disabled = true;
    placeholder.selected = true;
    sel.appendChild(placeholder);
    others.forEach(function (name) {
      var o = document.createElement('option');
      o.value = name;
      o.textContent = '/' + name;
      sel.appendChild(o);
    });
    // Inside a Recent row a tap must not bubble to the row's own handler.
    sel.addEventListener('click', function (ev) { ev.stopPropagation(); });
    sel.addEventListener('change', function () { pick(sel.value); });
    chips.splice(candidates.length, 0, sel);
    return chips;
  }

  // Answers a skill question: starts the request under the pick (new key,
  // autoSkill off, `answers` = the asked key so the box retires the row and
  // dedupes repeats) or, for Put back, dismisses the row and returns it to the composer.
  function answerAsk(key, project, promptText, ids) {
    if (askSkillEl.dataset.key === key) askSkillEl.classList.add('gl-hidden');
    lastSessions = lastSessions.filter(function (x) { return x.key !== key; });
    rerenderRecent();
    if (project !== null) { startSessionWith(project, promptText, ids, false, [], false, undefined, undefined, key); return; }
    postJson('/sessions/submissions/' + encodeURIComponent(key) + '/dismiss', {}).then(loadRecent, function () {});
    confirmationEl.classList.add('gl-hidden');
    promptEl.value = [promptText, promptEl.value.trim()].filter(Boolean).join('\n\n');
    ids.forEach(addServerAttachment);
    saveDraft();
    updateStartEnabled();
    promptEl.focus();
  }

  // The box wasn't sure which skill fits, so it started nothing and sent its
  // candidates. A chip starts the same request (new key) under that skill
  // with autoSkill off; "Put back" returns it to the composer to pick by hand.
  // Either way the box's "asked" row in Recent is retired.
  function onAskSkill(entry, candidates) {
    // Clarifications typed while it was "starting" join the prompt.
    var clarifications = readQueue(PENDING_CLARIFY_KEY).filter(function (c) { return c.startKey === entry.key; });
    writeQueue(PENDING_CLARIFY_KEY, readQueue(PENDING_CLARIFY_KEY).filter(function (c) { return c.startKey !== entry.key; }));
    var promptText = [entry.body.prompt].concat(clarifications.map(function (c) { return c.text; })).filter(Boolean).join('\n\n');
    var ids = entry.body.attachments || [];
    setConfirmation('Which skill?', '', true, null);
    askSkillEl.textContent = '';
    askSkillEl.dataset.key = entry.key;
    askChips(candidates, function (project) { answerAsk(entry.key, project, promptText, ids); })
      .forEach(function (b) { askSkillEl.appendChild(b); });
    askSkillEl.classList.remove('gl-hidden');
    confirmationEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    loadRecent();
  }

  // The box answered and refused (a client error): never retried by itself
  // (it would just refuse again). The request stays in Recent as a Failed row
  // with Retry, Edit (back into the composer) and Discard, until the user acts.
