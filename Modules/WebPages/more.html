<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>More</title>
<script src="gl-bridge.js"></script>
<link rel="stylesheet" href="page.css">
<style>
  /* Margin/gutter below MUST match GLTheme's own spacingM (16) / spacingS
     (12) -- these are the exact constants the old native grid
     (GLMoreGridViewController, see git show 862d5f4) used for its outer
     margin and inter-tile gutter, and #applyTileGeometry() below re-derives
     the native "side = floor((contentWidth - gutter) / 2)" square-tile math
     from this same gutter value, so the two must never drift apart. */
  #gl-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)) 16px;
  }

  .gl-tile {
    position: relative;
    box-sizing: border-box;
    /* Same glass rule as page.css's .gl-card (see its comment): gl-bridge.js
       always sets --gl-surface-translucent/--gl-backdrop-blur, to the real
       translucent value + blur on a theme that opts in (dusk) and to the
       resolved opaque --gl-surface + "none" everywhere else, so this one
       rule reproduces the flat look unchanged on every other theme and
       real glass -- the gradient behind the page showing through, matching
       the web tabs -- only on dusk. Was `background: var(--gl-surface)`,
       which is what made these tiles opaque white slabs on dusk (the user:
       "the square items in the main view have this shitty white
       background") even though the web tabs' cards never had that problem. */
    background: var(--gl-surface-translucent);
    -webkit-backdrop-filter: var(--gl-backdrop-blur);
    backdrop-filter: var(--gl-backdrop-blur);
    border-radius: 18px;
    padding: 16px;
    /* Square, sized to the column width -- see #applyTileGeometry(), which
       sets --gl-tile-side to the same "side" the old native grid computed
       and applies it as this tile's explicit height (a plain aspect-ratio
       here would size against the CONTENT box, and padding/box-sizing
       interactions made that drift off-square in practice; an explicit
       height sidesteps it entirely and is also what the hero tile below
       needs to borrow). */
    height: var(--gl-tile-side, 173px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: none;
    text-align: center;
    color: var(--gl-text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  .gl-tile.hero {
    grid-column: span 2;
    /* Same height as a standard tile (one grid row), not double -- the old
       native hero tile was exactly this: full content width, ordinary tile
       height, never square. */
    height: var(--gl-tile-side, 173px);
  }

  .gl-tile.dragging {
    opacity: 0.55;
    z-index: 2;
  }

  .gl-icon-chip {
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    /* Tinted accent, matching the old native chip's
       accentColor at 0.18 alpha (GLMoreGridViewController -applyTheme). */
    background: color-mix(in srgb, var(--gl-accent) 18%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gl-icon-chip svg {
    width: 26px;
    height: 26px;
    color: var(--gl-accent);
  }

  .gl-tile-title {
    font-size: 15px;
    font-weight: 600;
  }

  .gl-hero-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(127, 127, 127, 0.22);
    color: var(--gl-text);
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gl-hero-badge.active {
    background: var(--gl-accent);
    color: var(--gl-bg);
  }
</style>
</head>
<body>
<div class="gl-header">
  <span class="gl-header-title" style="margin-right:0">More</span>
</div>

<div id="gl-loading" class="gl-empty-state">
  <div class="gl-spinner" style="margin:0 auto 12px auto"></div>
  Loading…
</div>

<div id="gl-error" class="gl-error-banner gl-hidden">
  <span id="gl-error-text"></span>
  <button class="gl-btn-plain" id="gl-retry-btn" type="button">Retry</button>
</div>

<div id="gl-grid" class="gl-hidden" role="list"></div>

<div id="gl-empty" class="gl-empty-state gl-hidden">No modules available.</div>

<script>
(function () {
  'use strict';

  var LONG_PRESS_MS = 400;
  var MOVE_CANCEL_PX = 10;

  var gridEl = document.getElementById('gl-grid');
  var loadingEl = document.getElementById('gl-loading');
  var errorEl = document.getElementById('gl-error');
  var errorTextEl = document.getElementById('gl-error-text');
  var emptyEl = document.getElementById('gl-empty');
  var retryBtn = document.getElementById('gl-retry-btn');

  var byId = new Map();
  var order = [];
  var heroes = new Set();
  var openPending = false;

  // GLTheme spacingS (see Shared/GLTheme.m) -- the gutter between tiles.
  // #gl-grid's own `gap` above must stay equal to this: applyTileGeometry()
  // re-derives the native "side = floor((contentWidth - gutter) / 2)" tile
  // size from it, and if the two ever disagreed the computed square size
  // would silently stop matching what the CSS grid actually laid out.
  var TILE_GUTTER_PX = 12;

  // Inline-SVG stand-ins for the SF Symbols the old native grid used per
  // module (+moduleIcon in each Modules/*/*.m) -- more.html has no access to
  // SF Symbols, only these hand-drawn approximations. Keyed by the
  // "GLModule.<ClassName>" restoration identifier GLModuleRegistry hands
  // back from listModules (see +makeViewControllers). `currentColor` picks
  // up .gl-icon-chip svg's `color: var(--gl-accent)` from the CSS above, and
  // the couple of "knockout" shapes below use var(--gl-surface) so they read
  // as a cutout against the icon's own filled background rather than the
  // page background, whatever the current theme is.
  var MODULE_ICONS = {
    'GLModule.EventsModule':
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="5" width="14" height="15" rx="3"/>' +
      '<path d="M7 3v4M13 3v4M3 10h14"/>' +
      '<circle cx="17.5" cy="17.5" r="4.5" fill="var(--gl-surface)" stroke="currentColor"/>' +
      '<path d="M17.5 15.3v2.2l1.4 1.2"/>' +
      '</svg>',
    'GLModule.AutoJournalModule': // Journal -- mic.circle.fill
      '<svg viewBox="0 0 24 24">' +
      '<circle cx="12" cy="12" r="10" fill="currentColor"/>' +
      '<rect x="9.5" y="6" width="5" height="8" rx="2.5" fill="var(--gl-surface)"/>' +
      '<path d="M7.5 12.3a4.5 4.5 0 0 0 9 0" stroke="var(--gl-surface)" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
      '<path d="M12 16.8v2.2" stroke="var(--gl-surface)" stroke-width="1.6" stroke-linecap="round"/>' +
      '</svg>',
    'GLModule.TrackerModule': // location.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 2c-4.4 0-8 3.6-8 8 0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z"/>' +
      '<circle cx="12" cy="10" r="3" fill="var(--gl-surface)"/>' +
      '</svg>',
    'GLModule.SettingsModule': // gearshape.fill
      '<svg viewBox="0 0 24 24" fill="currentColor">' +
      '<path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2zm9 3.6c0 .5 0 1-.1 1.5l2 1.6-2 3.4-2.3-.9c-.8.6-1.7 1.1-2.6 1.4l-.3 2.5H10.3l-.3-2.5c-.9-.3-1.8-.8-2.6-1.4l-2.3.9-2-3.4 2-1.6C5 13 5 12.5 5 12s0-1 .1-1.5l-2-1.6 2-3.4 2.3.9c.8-.6 1.7-1.1 2.6-1.4L10.3 2.5h3.4l.3 2.5c.9.3 1.8.8 2.6 1.4l2.3-.9 2 3.4-2 1.6c.1.5.1 1 .1 1.5z"/>' +
      '</svg>',
    'GLModule.UploadModule': // square.and.arrow.up
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 3v11"/>' +
      '<path d="M8 7l4-4 4 4"/>' +
      '<path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>' +
      '</svg>'
  };
  // Plain rounded square: a neutral "this module has no mapped glyph yet"
  // stand-in, deliberately not blank -- an empty chip reads as a rendering
  // bug, this reads as a placeholder.
  var FALLBACK_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="4" y="4" width="16" height="16" rx="4"/>' +
    '</svg>';

  // Drag state
  var drag = null; // { id, longPressTimer, startX, startY, active }

  function showLoading() {
    loadingEl.classList.remove('gl-hidden');
    errorEl.classList.add('gl-hidden');
    gridEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
  }

  function showError(message) {
    loadingEl.classList.add('gl-hidden');
    gridEl.classList.add('gl-hidden');
    emptyEl.classList.add('gl-hidden');
    errorTextEl.textContent = message;
    errorEl.classList.remove('gl-hidden');
  }

  function showGrid() {
    loadingEl.classList.add('gl-hidden');
    errorEl.classList.add('gl-hidden');
    if (order.length === 0) {
      emptyEl.classList.remove('gl-hidden');
      gridEl.classList.add('gl-hidden');
    } else {
      emptyEl.classList.add('gl-hidden');
      gridEl.classList.remove('gl-hidden');
    }
  }

  function buildDisplayOrder(modules, savedOrder) {
    var seen = new Set();
    var moduleIdOrder = [];
    var map = new Map();
    (Array.isArray(modules) ? modules : []).forEach(function (m) {
      if (!m || typeof m.identifier !== 'string' || m.identifier === '') return;
      if (seen.has(m.identifier)) return; // duplicate identifier: keep first occurrence
      seen.add(m.identifier);
      map.set(m.identifier, m);
      moduleIdOrder.push(m.identifier);
    });
    var result = [];
    var used = new Set();
    if (Array.isArray(savedOrder)) {
      savedOrder.forEach(function (id) {
        if (typeof id === 'string' && map.has(id) && !used.has(id)) {
          result.push(id);
          used.add(id);
        }
      });
    }
    moduleIdOrder.forEach(function (id) {
      if (!used.has(id)) {
        result.push(id);
        used.add(id);
      }
    });
    return { order: result, byId: map };
  }

  function render() {
    gridEl.innerHTML = '';
    order.forEach(function (id) {
      var mod = byId.get(id);
      if (!mod) return;
      var tile = document.createElement('div');
      tile.className = 'gl-tile' + (heroes.has(id) ? ' hero' : '');
      tile.dataset.id = id;
      tile.setAttribute('role', 'listitem');

      var badge = document.createElement('button');
      badge.type = 'button';
      badge.className = 'gl-hero-badge' + (heroes.has(id) ? ' active' : '');
      badge.textContent = heroes.has(id) ? '−' : '+';
      badge.setAttribute('aria-label', 'Toggle large tile');
      badge.dataset.role = 'hero-badge';
      tile.appendChild(badge);

      var iconChip = document.createElement('div');
      iconChip.className = 'gl-icon-chip';
      // innerHTML is safe here: both operands come from MODULE_ICONS/
      // FALLBACK_ICON above, fixed markup this file defines itself, never
      // from `mod` (the bridge-supplied module descriptor).
      iconChip.innerHTML = MODULE_ICONS[id] || FALLBACK_ICON;
      tile.appendChild(iconChip);

      var title = document.createElement('div');
      title.className = 'gl-tile-title';
      title.textContent = mod.title != null ? String(mod.title) : id;
      tile.appendChild(title);

      gridEl.appendChild(tile);
    });
    applyTileGeometry();
  }

  // Re-derives the old native grid's "side = floor((contentWidth - gutter)
  // / 2)" square-tile size (GLMoreGridViewController, see git show
  // 862d5f4) from the grid's OWN measured width, and publishes it as
  // --gl-tile-side for the CSS above to use as every tile's explicit
  // height. Driven off the grid's real layout rather than the viewport
  // width so it stays correct through safe-area insets and iPad/split-view
  // widths without duplicating those calculations here. Re-run on resize
  // (rotation, or the app window resizing under Stage Manager) since the
  // computed side is a snapshot, not a live CSS relationship.
  function applyTileGeometry() {
    var style = getComputedStyle(gridEl);
    var contentWidth = gridEl.clientWidth - parseFloat(style.paddingLeft || '0') - parseFloat(style.paddingRight || '0');
    var side = Math.floor((contentWidth - TILE_GUTTER_PX) / 2);
    if (side > 0) {
      gridEl.style.setProperty('--gl-tile-side', side + 'px');
    }
  }
  window.addEventListener('resize', applyTileGeometry);

  function persistOrder() {
    GLBridge.call('setPref', { key: 'moreOrder', value: order.slice() }).catch(function () {});
  }

  function persistHeroes() {
    GLBridge.call('setPref', { key: 'moreHeroes', value: Array.from(heroes) }).catch(function () {});
  }

  function toggleHero(id) {
    if (heroes.has(id)) heroes.delete(id); else heroes.add(id);
    render();
    attachHandlers();
    persistHeroes();
  }

  function openTapped(id) {
    if (openPending) return; // double-fire guard
    openPending = true;
    GLBridge.call('openModule', { identifier: id }).then(function () {
      openPending = false;
    }, function () {
      openPending = false;
    });
  }

  function findTargetIndex(x, y, excludeId) {
    var tiles = gridEl.querySelectorAll('.gl-tile');
    var best = null;
    var bestDist = Infinity;
    tiles.forEach(function (tile) {
      var id = tile.dataset.id;
      if (id === excludeId) return;
      var r = tile.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var dx = x - cx;
      var dy = y - cy;
      var dist = dx * dx + dy * dy;
      if (dist < bestDist) {
        bestDist = dist;
        best = order.indexOf(id);
      }
    });
    return best;
  }

  function moveInOrder(id, targetIndex) {
    var from = order.indexOf(id);
    if (from === -1 || targetIndex === null || targetIndex === from) return;
    order.splice(from, 1);
    order.splice(targetIndex, 0, id);
  }

  function endDrag(persist) {
    if (!drag) return;
    if (drag.longPressTimer) clearTimeout(drag.longPressTimer);
    var wasActive = drag.active;
    var id = drag.id;
    drag = null;
    render();
    attachHandlers();
    if (wasActive && persist) persistOrder();
  }

  function onTileTouchStart(e) {
    var tile = e.currentTarget;
    if (e.target && e.target.closest && e.target.closest('[data-role="hero-badge"]')) return;
    if (e.touches.length !== 1) return;
    var touch = e.touches[0];
    var id = tile.dataset.id;
    drag = {
      id: id,
      active: false,
      startX: touch.clientX,
      startY: touch.clientY,
      longPressTimer: setTimeout(function () {
        if (!drag || drag.id !== id) return;
        drag.active = true;
        var el = gridEl.querySelector('.gl-tile[data-id="' + cssEscape(id) + '"]');
        if (el) el.classList.add('dragging');
      }, LONG_PRESS_MS)
    };
  }

  function onTileTouchMove(e) {
    if (!drag) return;
    var touch = e.touches[0];
    if (!touch) return;
    if (!drag.active) {
      var dx = touch.clientX - drag.startX;
      var dy = touch.clientY - drag.startY;
      if (Math.sqrt(dx * dx + dy * dy) > MOVE_CANCEL_PX) {
        // Movement before the long-press fired: treat as a scroll/tap gesture, not a drag.
        clearTimeout(drag.longPressTimer);
        drag = null;
      }
      return;
    }
    e.preventDefault();
    var targetIndex = findTargetIndex(touch.clientX, touch.clientY, drag.id);
    if (targetIndex !== null) {
      moveInOrder(drag.id, targetIndex);
      var draggingId = drag.id;
      render();
      attachHandlers();
      var el = gridEl.querySelector('.gl-tile[data-id="' + cssEscape(draggingId) + '"]');
      if (el) el.classList.add('dragging');
    }
  }

  function onTileTouchEnd(e) {
    if (!drag) return;
    var wasActive = drag.active;
    var id = drag.id;
    var tapTarget = e.target && e.target.closest && e.target.closest('[data-role="hero-badge"]');
    clearTimeout(drag.longPressTimer);
    drag = null;
    if (wasActive) {
      render();
      attachHandlers();
      persistOrder();
    } else if (!tapTarget) {
      // Without this, WebKit still synthesizes a compatibility `click`
      // shortly after this touchend (nothing upstream called
      // preventDefault on the gesture), and the tile's own `click` listener
      // below -- there for the non-touch/mouse fallback -- fires
      // openTapped() a SECOND time for the same finger tap. openPending
      // does not catch it: the native reply to the first openModule call
      // typically lands (resetting openPending) before the synthesized
      // click even fires. preventDefault() here suppresses that synthetic
      // click outright, so a real tap can only ever reach openTapped once.
      e.preventDefault();
      openTapped(id);
    }
  }

  function cssEscape(s) {
    return String(s).replace(/["\\]/g, '\\$&');
  }

  function attachHandlers() {
    gridEl.querySelectorAll('.gl-tile').forEach(function (tile) {
      tile.addEventListener('touchstart', onTileTouchStart, { passive: true });
      tile.addEventListener('touchmove', onTileTouchMove, { passive: false });
      tile.addEventListener('touchend', onTileTouchEnd, { passive: false });
      tile.addEventListener('touchcancel', function () { endDrag(false); }, { passive: true });
      // Non-touch fallback (mouse / trackpad in tests or on a non-touch build).
      tile.addEventListener('click', function (e) {
        if (e.target && e.target.closest && e.target.closest('[data-role="hero-badge"]')) return;
        openTapped(tile.dataset.id);
      });
    });
    gridEl.querySelectorAll('[data-role="hero-badge"]').forEach(function (badge) {
      badge.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleHero(badge.closest('.gl-tile').dataset.id);
      });
    });
  }

  function load() {
    showLoading();
    Promise.all([
      GLBridge.call('listModules', {}),
      GLBridge.call('getPref', { key: 'moreOrder' }),
      GLBridge.call('getPref', { key: 'moreHeroes' })
    ]).then(function (results) {
      var modulesResult = results[0] || {};
      var orderResult = results[1] || {};
      var heroesResult = results[2] || {};
      var built = buildDisplayOrder(modulesResult.modules, orderResult.value);
      byId = built.byId;
      order = built.order;
      var savedHeroes = Array.isArray(heroesResult.value) ? heroesResult.value : [];
      heroes = new Set(savedHeroes.filter(function (id) { return byId.has(id); }));
      render();
      attachHandlers();
      showGrid();
    }, function (err) {
      showError((err && err.message) || 'bridge unavailable');
    });
  }

  retryBtn.addEventListener('click', load);

  GLBridge.onThemeChanged(function () { /* CSS vars re-applied by gl-bridge.js itself; no rebuild needed */ });

  load();
})();
</script>
</body>
</html>
